<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latent 潜影</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #F3EDE2; }
canvas { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
</head>
<body>
<script>
// Development 001 — Latent 潜影
// Exposure has happened. The image exists, but cannot yet be seen.

const PAPER = [243, 237, 226];
const INK = [38, 43, 48];
const SILVER = [121, 126, 119];
const SAFFRON = [216, 166, 76];
const BLUE = [76, 112, 139];
const ROSE = [177, 111, 103];
const LIGHT = [255, 252, 241];

let grains = [];
let paper;
let seed = 81401;
let u;
let centre;
let plate;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(40);
  initialise();
}

function initialise() {
  randomSeed(seed++);
  noiseSeed(seed * 19);
  u = min(width, height);
  centre = createVector(width * 0.61, height * 0.49);
  plate = {
    x: width * 0.17,
    y: height * 0.13,
    w: width * 0.70,
    h: height * 0.74
  };
  makePaper();
  makeGrains();
}

function makePaper() {
  paper = createGraphics(width, height);
  paper.pixelDensity(1);
  paper.background(...PAPER);
  paper.noStroke();

  // Uneven emulsion wash — quiet, not a gradient wallpaper.
  for (let i = 0; i < 22; i++) {
    const x = lerp(plate.x, plate.x + plate.w, i / 21);
    paper.fill(BLUE[0], BLUE[1], BLUE[2], 2.8);
    paper.ellipse(x, centre.y, u * 0.19, plate.h * 0.94);
  }
  for (let i = 0; i < width * height / 105; i++) {
    const r = random();
    if (r < 0.56) paper.fill(LIGHT[0], LIGHT[1], LIGHT[2], random(7, 16));
    else if (r < 0.88) paper.fill(INK[0], INK[1], INK[2], random(1.2, 3.2));
    else paper.fill(SAFFRON[0], SAFFRON[1], SAFFRON[2], random(2.5, 6));
    paper.circle(random(width), random(height), random(0.25, 1.1));
  }
}

function makeGrains() {
  grains = [];
  const count = constrain(floor(width * height / 620), 850, 2100);

  for (let i = 0; i < count; i++) {
    const layer = random();
    let tx, ty, family;

    if (layer < 0.54) {
      // A broken oval: the image's first almost-recognisable contour.
      const a = random(-PI * 0.90, PI * 0.82);
      const radius = pow(random(), 0.58);
      const rx = u * (0.075 + radius * 0.205);
      const ry = u * (0.10 + radius * 0.285);
      tx = centre.x + cos(a) * rx + noise(i * 0.04) * u * 0.018;
      ty = centre.y + sin(a) * ry + (noise(90 + i * 0.04) - 0.5) * u * 0.032;
      family = layer < 0.37 ? BLUE : INK;
    } else if (layer < 0.79) {
      // Horizontal exposure strata cut through the contour.
      const row = floor(random(7));
      tx = plate.x + plate.w * random(0.12, 0.94);
      ty = plate.y + plate.h * (0.19 + row * 0.102) + randomGaussian() * u * 0.008;
      family = row % 3 === 0 ? SAFFRON : SILVER;
    } else {
      // Dense, warm nucleus placed off-centre.
      const a = random(TAU);
      const r = pow(random(), 1.8) * u * 0.105;
      tx = centre.x - u * 0.035 + cos(a) * r * 1.25;
      ty = centre.y + u * 0.025 + sin(a) * r * 0.66;
      family = random() < 0.68 ? ROSE : SAFFRON;
    }

    const sx = random(plate.x, plate.x + plate.w);
    const sy = random(plate.y, plate.y + plate.h);
    grains.push({
      pos: createVector(sx, sy),
      home: createVector(sx, sy),
      target: createVector(tx, ty),
      color: family,
      size: random(u * 0.00065, u * 0.0025),
      phase: random(TAU),
      lag: random(0.0, 0.23),
      drift: random(0.3, 1.2)
    });
  }
}

function draw() {
  image(paper, 0, 0);
  drawPlate();

  // Enter mid-development so the first frame already carries an image;
  // the loop later returns to blank emulsion and exposes it again.
  const cycle = ((frameCount + 390) % 600) / 600;
  const sweep = cycle < 0.84
    ? lerp(plate.x - u * 0.08, plate.x + plate.w + u * 0.08, easeInOut(cycle / 0.84))
    : plate.x + plate.w + u * 0.08;
  const reveal = cycle < 0.60 ? smoothstep(0.03, 0.58, cycle) : 1 - smoothstep(0.76, 0.99, cycle);

  drawExposure(sweep, cycle);
  drawGrains(sweep, reveal, cycle);
  drawLatentCore(reveal);
  drawPlateEdge();
}

function drawPlate() {
  noStroke();
  fill(LIGHT[0], LIGHT[1], LIGHT[2], 30);
  rect(plate.x, plate.y, plate.w, plate.h);

  // Broad translucent emulsion sheets.
  for (let i = 0; i < 5; i++) {
    const y = plate.y + plate.h * (0.17 + i * 0.16);
    fill(i % 2 ? BLUE[0] : SAFFRON[0], i % 2 ? BLUE[1] : SAFFRON[1], i % 2 ? BLUE[2] : SAFFRON[2], 4.5);
    rect(plate.x + u * 0.018, y, plate.w - u * 0.036, u * (0.036 + i * 0.004));
  }
}

function drawExposure(x, cycle) {
  if (cycle > 0.86) return;
  push();
  blendMode(SCREEN);
  noStroke();
  for (let i = 12; i >= 1; i--) {
    const w = u * (0.012 + i * 0.012);
    fill(LIGHT[0], LIGHT[1], LIGHT[2], 2.2 + (12 - i) * 1.25);
    rect(x - w * 0.5, plate.y, w, plate.h);
  }
  fill(SAFFRON[0], SAFFRON[1], SAFFRON[2], 38);
  rect(x - max(1, u * 0.0012), plate.y, max(2, u * 0.0024), plate.h);
  blendMode(BLEND);
  pop();
}

function drawGrains(sweep, reveal, cycle) {
  blendMode(MULTIPLY);
  noStroke();

  for (const g of grains) {
    const passed = smoothstep(g.target.x - u * 0.13, g.target.x + u * 0.025, sweep);
    const gather = constrain(passed * reveal - g.lag, 0, 1);
    const eased = gather * gather * (3 - 2 * gather);
    const tremble = sin(frameCount * 0.014 * g.drift + g.phase) * u * 0.0018;
    const x = lerp(g.home.x, g.target.x, eased) + cos(g.phase) * tremble;
    const y = lerp(g.home.y, g.target.y, eased) + sin(g.phase * 1.7) * tremble;
    const c = g.color;
    const pulse = 0.78 + 0.22 * sin(frameCount * 0.021 + g.phase);
    const alpha = lerp(12, 118, eased) * pulse;

    fill(c[0], c[1], c[2], alpha);
    ellipse(x, y, g.size * (1.3 + eased * 1.5), g.size * (0.75 + eased * 0.7));
  }
  blendMode(BLEND);
}

function drawLatentCore(reveal) {
  const breathe = 1 + sin(frameCount * 0.016) * 0.035;
  const alpha = 10 + reveal * 32;
  noFill();

  for (let i = 6; i >= 1; i--) {
    stroke(ROSE[0], ROSE[1], ROSE[2], alpha * (1 - i * 0.09));
    strokeWeight(max(0.6, u * 0.00075));
    const w = u * (0.085 + i * 0.034) * breathe;
    const h = u * (0.048 + i * 0.021) * breathe;
    arc(centre.x - u * 0.035, centre.y + u * 0.025, w, h, -PI * 0.88, PI * 0.84);
  }

  noStroke();
  fill(LIGHT[0], LIGHT[1], LIGHT[2], 22 + reveal * 58);
  ellipse(centre.x - u * 0.045, centre.y + u * 0.008, u * 0.061, u * 0.028);
  fill(SAFFRON[0], SAFFRON[1], SAFFRON[2], 16 + reveal * 58);
  ellipse(centre.x - u * 0.035, centre.y + u * 0.025, u * 0.032, u * 0.014);
}

function drawPlateEdge() {
  noFill();
  stroke(INK[0], INK[1], INK[2], 22);
  strokeWeight(max(0.6, u * 0.0007));
  rect(plate.x, plate.y, plate.w, plate.h);
  stroke(LIGHT[0], LIGHT[1], LIGHT[2], 90);
  line(plate.x + 1, plate.y + 1, plate.x + plate.w - 1, plate.y + 1);
}

function smoothstep(a, b, x) {
  const t = constrain((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - pow(-2 * t + 2, 2) / 2;
}

function mousePressed() {
  initialise();
  frameCount = 0;
}

function touchStarted() {
  initialise();
  frameCount = 0;
  return false;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  initialise();
}
</script>
</body>
</html>
