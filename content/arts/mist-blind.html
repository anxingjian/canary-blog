<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind 盲 — Mist Series</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A0A0A; overflow: hidden; cursor: none; }
canvas { display: block; }
#hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  color: #E8DFD055; font: 14px/1 monospace; letter-spacing: 0.05em;
  transition: opacity 2s; pointer-events: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">按住鼠标闭上眼</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let pressing = false;
let pressTime = 0;
let phosphenes = [];
let frame = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Colors
const AMBER = '#FFB800';
const RED = '#FF2E00';
const BONE = '#E8DFD0';
const VOID = '#1A1A1A';

class Phosphene {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.radius = Math.random() * 60 + 20;
    this.maxRadius = this.radius;
    this.color = [AMBER, RED, BONE, AMBER, RED][Math.floor(Math.random() * 5)];
    this.alpha = 0;
    this.targetAlpha = Math.random() * 0.6 + 0.1;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.02 + 0.005;
    this.driftX = (Math.random() - 0.5) * 0.3;
    this.driftY = (Math.random() - 0.5) * 0.3;
    this.life = 0;
    this.maxLife = Math.random() * 300 + 100;
    this.shape = Math.random() > 0.6 ? 'ring' : Math.random() > 0.5 ? 'blob' : 'geo';
    this.sides = Math.floor(Math.random() * 4) + 3;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.01;
  }
  update(intensity) {
    this.life++;
    this.phase += this.speed;
    this.x += this.driftX;
    this.y += this.driftY;
    this.rotation += this.rotSpeed;
    
    const lifeRatio = this.life / this.maxLife;
    const fadeIn = Math.min(this.life / 30, 1);
    const fadeOut = lifeRatio > 0.7 ? 1 - (lifeRatio - 0.7) / 0.3 : 1;
    this.alpha = this.targetAlpha * fadeIn * fadeOut * intensity * (0.7 + 0.3 * Math.sin(this.phase));
    
    this.radius = this.maxRadius * (0.8 + 0.2 * Math.sin(this.phase * 1.3));
    
    if (this.life >= this.maxLife) {
      this.reset();
      this.alpha = 0;
    }
  }
  draw(ctx) {
    if (this.alpha < 0.01) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = this.alpha;
    
    if (this.shape === 'ring') {
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3 + Math.sin(this.phase) * 2;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 20;
      ctx.stroke();
    } else if (this.shape === 'blob') {
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
      grad.addColorStop(0, this.color);
      grad.addColorStop(0.5, this.color + '88');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      // Organic blob shape
      for (let i = 0; i <= 36; i++) {
        const a = (i / 36) * Math.PI * 2;
        const r = this.radius * (0.7 + 0.3 * Math.sin(a * 3 + this.phase) * Math.cos(a * 2 - this.phase));
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // Geometric ghost
      ctx.beginPath();
      for (let i = 0; i <= this.sides; i++) {
        const a = (i / this.sides) * Math.PI * 2;
        const r = this.radius * (i % 2 === 0 ? 1 : 0.6);
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = this.color + '44';
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }
}

// Create phosphenes
for (let i = 0; i < 25; i++) {
  phosphenes.push(new Phosphene());
}

// Neural static
function drawStatic(intensity) {
  if (intensity < 0.1) return;
  const imageData = ctx.getImageData(0, 0, W, H);
  const data = imageData.data;
  const density = intensity * 0.003;
  for (let i = 0; i < data.length; i += 4) {
    if (Math.random() < density) {
      const v = Math.random() * 40;
      data[i] = v;
      data[i + 1] = v * 0.8;
      data[i + 2] = v * 0.5;
      data[i + 3] = Math.random() * 80 * intensity;
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// Pressure waves - like pressing on closed eyelids
function drawPressureWaves(intensity) {
  if (intensity < 0.3) return;
  const count = Math.floor(intensity * 3);
  for (let i = 0; i < count; i++) {
    const cx = W * 0.3 + Math.sin(frame * 0.007 + i * 2) * W * 0.3;
    const cy = H * 0.3 + Math.cos(frame * 0.009 + i * 1.5) * H * 0.3;
    const r = 100 + Math.sin(frame * 0.02 + i) * 50;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, VOID);
    grad.addColorStop(0.5, VOID + '88');
    grad.addColorStop(1, 'transparent');
    ctx.globalAlpha = intensity * 0.15;
    ctx.fillStyle = grad;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
}

function animate() {
  frame++;
  
  // Background fade
  ctx.fillStyle = pressing ? '#0A0A0A' : '#0A0A0Acc';
  ctx.fillRect(0, 0, W, H);
  
  // Calculate intensity based on press duration
  let intensity;
  if (pressing) {
    pressTime++;
    intensity = Math.min(pressTime / 60, 1); // ramp up over 1 second
  } else {
    pressTime = Math.max(pressTime - 3, 0);
    intensity = Math.min(pressTime / 60, 1) * 0.3; // gentle idle phosphenes
  }
  
  // Always some minimal activity (eyes never truly rest)
  const baseIntensity = 0.15 + 0.05 * Math.sin(frame * 0.01);
  intensity = Math.max(intensity, baseIntensity);
  
  // Draw pressure distortion
  drawPressureWaves(intensity);
  
  // Update and draw phosphenes
  phosphenes.forEach(p => {
    p.update(intensity);
    p.draw(ctx);
  });
  
  // Neural static overlay
  drawStatic(intensity * 0.5);
  
  // Subtle vignette
  const vignette = ctx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.7);
  vignette.addColorStop(0, 'transparent');
  vignette.addColorStop(1, '#0A0A0A88');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  
  // Hide hint after first press
  if (pressTime > 30) {
    document.getElementById('hint').style.opacity = '0';
  }
  
  requestAnimationFrame(animate);
}

// Event listeners
canvas.addEventListener('mousedown', () => { pressing = true; });
canvas.addEventListener('mouseup', () => { pressing = false; });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pressing = true; });
canvas.addEventListener('touchend', () => { pressing = false; });

animate();
</script>
</body>
</html>
