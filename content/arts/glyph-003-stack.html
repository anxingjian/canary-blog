<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stack 叠</title>
<style>
* { margin: 0; padding: 0; }
html, body { overflow: hidden; background: #0C0A0E; width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
</head>
<body>
<script>
// Glyph 003 - Stack 叠
// Multiple characters overlaid in the same space
// Density, interference, emergent pattern from layered meaning

let layers = [];
let time = 0;

// Character pools by visual weight
const lightChars = '一二三人入八几又十千万上下大太天中';
const mediumChars = '日月水火木土金石田目耳手足心口山川';
const heavyChars = '龍龜鑄藝豐觀歸靈體驗聽讀層樹鬱蠶';

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  textAlign(CENTER, CENTER);
  
  generateLayers();
}

function generateLayers() {
  layers = [];
  
  // Create 3-4 composition zones on the canvas
  const zoneCount = 3 + floor(random(2));
  
  for (let z = 0; z < zoneCount; z++) {
    const zone = {
      cx: width * (0.2 + random(0.6)),
      cy: height * (0.2 + random(0.6)),
      chars: [],
      radius: min(width, height) * (0.15 + random(0.1))
    };
    
    // Stack 6-15 characters in this zone
    const charCount = 6 + floor(random(10));
    
    for (let i = 0; i < charCount; i++) {
      // Mix of visual weights
      let pool, weight;
      const r = random();
      if (r < 0.3) { pool = lightChars; weight = 'light'; }
      else if (r < 0.7) { pool = mediumChars; weight = 'medium'; }
      else { pool = heavyChars; weight = 'heavy'; }
      
      const char = pool[floor(random(pool.length))];
      
      // Position near zone center with gaussian-like distribution
      const angle = random(TWO_PI);
      const dist = random() * random() * zone.radius; // cluster toward center
      
      zone.chars.push({
        char,
        weight,
        x: zone.cx + cos(angle) * dist,
        y: zone.cy + sin(angle) * dist,
        size: weight === 'heavy' ? random(40, 120) : (weight === 'medium' ? random(50, 100) : random(60, 140)),
        alpha: weight === 'heavy' ? random(8, 20) : (weight === 'medium' ? random(12, 30) : random(15, 35)),
        rotation: random(-0.3, 0.3),
        // Animation
        breathPhase: random(TWO_PI),
        breathSpeed: 0.0004 + random(0.0003),
        breathAmp: random(3, 10),
        rotSpeed: (random() - 0.5) * 0.00005,
        // Color temperature
        warmth: random(),
        pulsePhase: random(TWO_PI),
        pulseSpeed: 0.0002 + random(0.0003)
      });
    }
    
    layers.push(zone);
  }
}

function draw() {
  // Persistent canvas with very slow fade
  fill(12, 10, 14, 8);
  noStroke();
  rect(0, 0, width, height);
  
  time += deltaTime;
  
  // Mouse influence
  const mx = mouseX;
  const my = mouseY;
  
  for (const zone of layers) {
    for (const c of zone.chars) {
      // Breathing motion
      const breathX = cos(time * c.breathSpeed + c.breathPhase) * c.breathAmp;
      const breathY = sin(time * c.breathSpeed * 0.7 + c.breathPhase + 1.5) * c.breathAmp * 0.6;
      
      // Slow rotation
      const rot = c.rotation + time * c.rotSpeed;
      
      // Alpha pulse
      const pulse = sin(time * c.pulseSpeed + c.pulsePhase) * 0.3 + 0.7;
      const a = c.alpha * pulse;
      
      // Mouse proximity — nearby characters become more visible
      const d = dist(mx, my, c.x + breathX, c.y + breathY);
      const mouseInfluence = constrain(map(d, 0, 200, 2.5, 1), 1, 2.5);
      
      push();
      translate(c.x + breathX, c.y + breathY);
      rotate(rot);
      
      textFont('serif');
      textSize(c.size);
      
      // Color based on warmth
      let r, g, b;
      if (c.warmth < 0.3) {
        // Cool — blue-gray
        r = 130 + c.warmth * 60;
        g = 135 + c.warmth * 50;
        b = 155 + c.warmth * 30;
      } else if (c.warmth < 0.7) {
        // Neutral — warm gray
        r = 170 + (c.warmth - 0.3) * 40;
        g = 160 + (c.warmth - 0.3) * 30;
        b = 145 + (c.warmth - 0.3) * 20;
      } else {
        // Warm — amber
        r = 190 + (c.warmth - 0.7) * 40;
        g = 165 + (c.warmth - 0.7) * 20;
        b = 130;
      }
      
      fill(r, g, b, a * mouseInfluence);
      noStroke();
      text(c.char, 0, 0);
      
      pop();
    }
  }
  
  // Occasional new character drifts in from edge
  if (random() > 0.997 && layers.length > 0) {
    const zone = layers[floor(random(layers.length))];
    const edge = floor(random(4));
    let x, y;
    switch(edge) {
      case 0: x = random(width); y = -50; break;
      case 1: x = width + 50; y = random(height); break;
      case 2: x = random(width); y = height + 50; break;
      case 3: x = -50; y = random(height); break;
    }
    
    const pool = [lightChars, mediumChars, heavyChars][floor(random(3))];
    zone.chars.push({
      char: pool[floor(random(pool.length))],
      weight: 'medium',
      x, y,
      size: random(40, 100),
      alpha: random(10, 25),
      rotation: random(-0.3, 0.3),
      breathPhase: random(TWO_PI),
      breathSpeed: 0.0004 + random(0.0003),
      breathAmp: random(3, 10),
      rotSpeed: (random() - 0.5) * 0.00005,
      warmth: random(),
      pulsePhase: random(TWO_PI),
      pulseSpeed: 0.0002 + random(0.0003)
    });
    
    // Keep count reasonable
    if (zone.chars.length > 25) zone.chars.shift();
  }
}

function mousePressed() {
  generateLayers();
  background(12, 10, 14);
  time = 0;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  generateLayers();
  background(12, 10, 14);
  time = 0;
}
</script>
</body>
</html>
