<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干涉 / Interference</title>
<style>
* { margin: 0; padding: 0; }
body { background: #08080e; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let time = 0;
let sources = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Start with two sources
sources.push({ x: 0.3, y: 0.4 });
sources.push({ x: 0.7, y: 0.6 });

// Wave function from a source
function wave(sx, sy, px, py, t, freq) {
  const dx = px - sx, dy = py - sy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return Math.sin(dist * freq - t) / (1 + dist * 0.8);
}

function draw() {
  time += 0.03;

  // Full clear with slight persistence
  ctx.fillStyle = 'rgba(8,8,14,0.25)';
  ctx.fillRect(0, 0, W, H);

  const cols = Math.floor(W / 4);
  const rows = Math.floor(H / 4);
  const cellW = W / cols;
  const cellH = H / rows;
  const freq = 25;

  // Draw interference field as displaced dots/dashes
  for (let row = 0; row < rows; row++) {
    const py = (row + 0.5) / rows;

    ctx.beginPath();
    let started = false;

    for (let col = 0; col < cols; col++) {
      const px = (col + 0.5) / cols;

      // Sum waves from all sources
      let val = 0;
      for (const s of sources) {
        val += wave(s.x, s.y, px, py, time, freq);
      }

      // Displacement based on wave value
      const displaceY = val * cellH * 3;
      const screenX = col * cellW + cellW / 2;
      const screenY = row * cellH + cellH / 2 + displaceY;

      // Color: warm when constructive (high |val|), dim when destructive
      const absVal = Math.abs(val);
      const constructive = absVal > 0.5;

      if (constructive) {
        // Draw bright dots at constructive interference
        const intensity = Math.min(absVal * 0.8, 1);
        const r = 180 + intensity * 60;
        const g = 150 + intensity * 50;
        const b = 110 + intensity * 30;
        
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${intensity * 0.7})`;
        ctx.fillRect(screenX - 1.2, screenY - 1.2, 2.4, 2.4);

        // Glow for strong constructive
        if (absVal > 1.0) {
          ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${intensity * 0.15})`;
          ctx.beginPath();
          ctx.arc(screenX, screenY, 4 + intensity * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // Faint dot at destructive interference
        ctx.fillStyle = `rgba(100,100,120,${absVal * 0.15})`;
        ctx.fillRect(screenX - 0.5, screenY - 0.5, 1, 1);
      }
    }
  }

  // Draw source indicators
  for (let i = 0; i < sources.length; i++) {
    const s = sources[i];
    const sx = s.x * W, sy = s.y * H;
    const pulse = 0.5 + 0.5 * Math.sin(time * 2 + i);
    
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 12 + pulse * 6);
    grad.addColorStop(0, `rgba(220,190,140,${0.4 + pulse * 0.2})`);
    grad.addColorStop(0.5, `rgba(220,190,140,0.08)`);
    grad.addColorStop(1, 'rgba(220,190,140,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sx, sy, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(240,220,180,${0.6 + pulse * 0.3})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('click', (e) => {
  if (sources.length < 5) {
    sources.push({ x: e.clientX / W, y: e.clientY / H });
  }
});

draw();
</script>
</body>
</html>
