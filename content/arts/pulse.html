<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse 脉 — Frequency #2</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0A0A0A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Palette
const CARMINE = '#C41E3A';
const FOREST = '#1B4332';
const IVORY = '#F7F3E3';
const BLACK = '#0A0A0A';

// State
let bpm = 72;
let lastBeat = 0;
let beatInterval = 60000 / bpm;
let pulses = [];
let secondaryPulses = [];
let time = 0;
let ekg = [];
const EKG_LEN = 200;

// Click to change heart rate
canvas.addEventListener('click', () => {
  bpm = 40 + Math.random() * 140;
  beatInterval = 60000 / bpm;
  // Flash
  pulses.push({ x: W/2, y: H/2, r: 0, maxR: Math.max(W, H) * 0.7, alpha: 1, color: IVORY, speed: 4 });
});

function beat(now) {
  // Main pulse
  pulses.push({
    x: W/2, y: H/2,
    r: 0,
    maxR: Math.max(W, H) * 0.6,
    alpha: 0.9,
    color: CARMINE,
    speed: 2 + Math.random() * 0.5
  });
  // Secondary green pulse (offset)
  setTimeout(() => {
    secondaryPulses.push({
      x: W/2, y: H/2,
      r: 0,
      maxR: Math.max(W, H) * 0.4,
      alpha: 0.5,
      color: FOREST,
      speed: 1.5
    });
  }, beatInterval * 0.3);
}

function generateEKGPoint(phase) {
  // Simulate QRS complex
  const p = phase % 1;
  if (p > 0.38 && p < 0.42) return 0.3; // P wave
  if (p > 0.44 && p < 0.46) return -0.15; // Q
  if (p > 0.46 && p < 0.50) return 1.0; // R peak
  if (p > 0.50 && p < 0.53) return -0.3; // S
  if (p > 0.60 && p < 0.68) return 0.2; // T wave
  return 0 + (Math.random() - 0.5) * 0.02; // baseline noise
}

function draw(now) {
  // Semi-transparent black for trails
  ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
  ctx.fillRect(0, 0, W, H);

  time += 0.016;

  // Beat timing
  if (now - lastBeat > beatInterval) {
    beat(now);
    lastBeat = now;
  }

  // Draw concentric resting rings (subtle)
  ctx.strokeStyle = 'rgba(27, 67, 50, 0.1)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i <= 8; i++) {
    const r = i * Math.min(W, H) / 16;
    const wobble = Math.sin(time * 0.5 + i) * 2;
    ctx.beginPath();
    ctx.arc(W/2, H/2, r + wobble, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Draw and update main pulses
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.r += p.speed;
    p.alpha *= 0.985;

    if (p.alpha < 0.01 || p.r > p.maxR) {
      pulses.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.lineWidth = 2 + p.alpha * 3;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Inner glow
    if (p.r < 50) {
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `rgba(196, 30, 58, ${p.alpha * 0.3})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }

  // Secondary pulses
  for (let i = secondaryPulses.length - 1; i >= 0; i--) {
    const p = secondaryPulses[i];
    p.r += p.speed;
    p.alpha *= 0.98;

    if (p.alpha < 0.01 || p.r > p.maxR) {
      secondaryPulses.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // EKG trace at bottom
  const ekgY = H * 0.82;
  const ekgH = H * 0.12;
  const phase = (now % beatInterval) / beatInterval;
  ekg.push(generateEKGPoint(phase));
  if (ekg.length > EKG_LEN) ekg.shift();

  ctx.beginPath();
  ctx.strokeStyle = CARMINE;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.7;
  for (let i = 0; i < ekg.length; i++) {
    const x = (i / EKG_LEN) * W;
    const y = ekgY - ekg[i] * ekgH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Cursor dot on EKG
  if (ekg.length > 0) {
    const lastX = ((ekg.length - 1) / EKG_LEN) * W;
    const lastY = ekgY - ekg[ekg.length - 1] * ekgH;
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
    ctx.fillStyle = IVORY;
    ctx.fill();
  }

  // BPM display
  ctx.font = '12px monospace';
  ctx.fillStyle = 'rgba(247, 243, 227, 0.4)';
  ctx.fillText(`${Math.round(bpm)} BPM`, 20, 30);

  // Center dot - the heart
  const beatPhase = (now - lastBeat) / beatInterval;
  const centerSize = 4 + Math.pow(Math.max(0, 1 - beatPhase * 4), 2) * 8;
  ctx.beginPath();
  ctx.arc(W/2, H/2, centerSize, 0, Math.PI * 2);
  const centerAlpha = 0.6 + Math.pow(Math.max(0, 1 - beatPhase * 3), 2) * 0.4;
  ctx.fillStyle = `rgba(196, 30, 58, ${centerAlpha})`;
  ctx.fill();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
