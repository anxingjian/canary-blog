<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choke 窒 — Smoke Series</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0E0D; }
canvas { display: block; }
</style>
</head>
<body>
<script>
// Choke 窒 — Smoke that has nowhere to go
// Particles accumulate, density builds, movement slows to suffocation

const COLORS = {
  bg: [10, 14, 13],
  deepGreen: [27, 67, 50],
  rustRed: [139, 26, 26],
  sage: [45, 106, 79],
  sandstone: [212, 165, 116]
};

let particles = [];
let barriers = [];
let constrictionY;
let breathPhase = 0;
let constrictionAmount = 0;
const MAX_PARTICLES = 2000;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(RGB, 255, 255, 255, 1.0);
  constrictionY = height * 0.45;
  
  // Create initial barrier geometry
  generateBarriers();
}

function generateBarriers() {
  barriers = [];
  let segments = 12;
  for (let i = 0; i < segments; i++) {
    let angle = (TWO_PI / segments) * i;
    let r = min(width, height) * 0.35;
    barriers.push({
      x: width/2 + cos(angle) * r * random(0.8, 1.0),
      y: height/2 + sin(angle) * r * random(0.6, 0.9),
      size: random(30, 80),
      phase: random(TWO_PI)
    });
  }
}

function draw() {
  // Semi-transparent background for trails
  background(COLORS.bg[0], COLORS.bg[1], COLORS.bg[2], 0.08);
  
  breathPhase += 0.008;
  constrictionAmount = (sin(breathPhase) + 1) * 0.5; // 0 to 1, slow breathing
  
  // Emit particles from bottom
  if (particles.length < MAX_PARTICLES && frameCount % 2 === 0) {
    let emitX = width/2 + random(-width*0.15, width*0.15);
    particles.push(createParticle(emitX, height + 10));
  }
  
  // Mouse interaction: emit extra particles
  if (mouseIsPressed) {
    for (let i = 0; i < 3; i++) {
      particles.push(createParticle(mouseX + random(-20, 20), mouseY + random(-20, 20)));
    }
  }
  
  // Draw constriction zone (the throat)
  drawConstriction();
  
  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    updateParticle(p);
    drawParticle(p);
    
    if (p.life <= 0 || p.y < -50) {
      particles.splice(i, 1);
    }
  }
  
  // Draw density overlay in choke zone
  drawDensityOverlay();
}

function createParticle(x, y) {
  return {
    x: x,
    y: y,
    vx: random(-0.5, 0.5),
    vy: random(-2.5, -1.0),
    life: 1.0,
    decay: random(0.001, 0.003),
    size: random(3, 12),
    colorType: random() < 0.6 ? 'green' : (random() < 0.5 ? 'rust' : 'sand'),
    noiseOff: random(1000),
    trapped: false
  };
}

function updateParticle(p) {
  // Perlin noise turbulence
  let n = noise(p.x * 0.003, p.y * 0.003, frameCount * 0.005 + p.noiseOff);
  let angle = n * TWO_PI * 2;
  
  p.vx += cos(angle) * 0.15;
  p.vy += sin(angle) * 0.1;
  
  // Natural upward buoyancy
  p.vy -= 0.03;
  
  // Constriction effect — narrow the passable zone
  let chokeWidth = width * (0.08 + 0.12 * constrictionAmount); // narrows on exhale
  let distFromCenter = abs(p.x - width/2);
  let distFromChoke = abs(p.y - constrictionY);
  
  if (distFromChoke < 80) {
    // In the choke zone
    if (distFromCenter > chokeWidth) {
      // Push back toward center
      let pushForce = map(distFromCenter, chokeWidth, width/2, 0, 0.8);
      p.vx += (width/2 - p.x) * 0.005 * pushForce;
      // Slow down vertical movement — congestion
      p.vy *= 0.92;
      p.trapped = true;
    }
    // All particles slow in the throat
    p.vx *= 0.95;
    p.vy *= 0.96;
    // Extra decay in choke zone — suffocation
    p.decay *= 1.001;
  } else {
    p.trapped = false;
  }
  
  // Damping
  p.vx *= 0.98;
  p.vy *= 0.98;
  
  p.x += p.vx;
  p.y += p.vy;
  p.life -= p.decay;
  
  // Wrap horizontally
  if (p.x < 0) p.x = width;
  if (p.x > width) p.x = 0;
}

function drawParticle(p) {
  let alpha = p.life * (p.trapped ? 0.7 : 0.5);
  let c;
  
  if (p.colorType === 'green') {
    let t = p.trapped ? 0.7 : 0.3;
    c = lerpColor(
      color(COLORS.deepGreen[0], COLORS.deepGreen[1], COLORS.deepGreen[2]),
      color(COLORS.sage[0], COLORS.sage[1], COLORS.sage[2]),
      t
    );
  } else if (p.colorType === 'rust') {
    c = color(COLORS.rustRed[0], COLORS.rustRed[1], COLORS.rustRed[2]);
  } else {
    c = color(COLORS.sandstone[0], COLORS.sandstone[1], COLORS.sandstone[2]);
  }
  
  noStroke();
  fill(red(c), green(c), blue(c), alpha);
  
  let s = p.size * (0.5 + p.life * 0.5);
  if (p.trapped) s *= 1.3; // Swell when trapped
  
  ellipse(p.x, p.y, s, s * random(0.8, 1.2));
}

function drawConstriction() {
  // Draw the throat walls
  let chokeWidth = width * (0.08 + 0.12 * constrictionAmount);
  
  // Left wall
  noStroke();
  for (let i = 0; i < 5; i++) {
    let alpha = map(i, 0, 5, 0.3, 0.05);
    let offset = i * 20;
    fill(COLORS.rustRed[0], COLORS.rustRed[1], COLORS.rustRed[2], alpha);
    
    beginShape();
    vertex(0, constrictionY - 100 - offset);
    vertex(width/2 - chokeWidth - offset, constrictionY);
    vertex(0, constrictionY + 100 + offset);
    endShape(CLOSE);
    
    // Right wall
    beginShape();
    vertex(width, constrictionY - 100 - offset);
    vertex(width/2 + chokeWidth + offset, constrictionY);
    vertex(width, constrictionY + 100 + offset);
    endShape(CLOSE);
  }
  
  // Highlight the throat edges
  stroke(COLORS.sandstone[0], COLORS.sandstone[1], COLORS.sandstone[2], 0.15);
  strokeWeight(1);
  noFill();
  
  let nx1 = noise(frameCount * 0.01) * 10;
  let nx2 = noise(frameCount * 0.01 + 100) * 10;
  
  line(width/2 - chokeWidth + nx1, constrictionY - 80, width/2 - chokeWidth - nx1, constrictionY + 80);
  line(width/2 + chokeWidth - nx2, constrictionY - 80, width/2 + chokeWidth + nx2, constrictionY + 80);
}

function drawDensityOverlay() {
  // Count particles in choke zone for density visualization
  let chokeCount = 0;
  for (let p of particles) {
    if (abs(p.y - constrictionY) < 60) chokeCount++;
  }
  
  let density = min(chokeCount / 200, 1.0);
  
  if (density > 0.3) {
    // Suffocation vignette — gets more oppressive as density builds
    let vignetteAlpha = map(density, 0.3, 1.0, 0, 0.15);
    
    // Draw radial gradient overlay from edges
    for (let r = 0; r < 5; r++) {
      let ra = map(r, 0, 5, min(width, height) * 0.6, min(width, height) * 0.2);
      noStroke();
      fill(COLORS.deepGreen[0], COLORS.deepGreen[1], COLORS.deepGreen[2], vignetteAlpha * (1 - r/5));
      ellipse(width/2, constrictionY, width - ra, 200 - r * 20);
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  constrictionY = height * 0.45;
  generateBarriers();
}
</script>
</body>
</html>
