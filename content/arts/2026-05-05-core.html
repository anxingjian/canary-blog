<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core 核 — 熔 / Melt</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1e; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let mouseX = -1000, mouseY = -1000;
let particles = [];
let cracks = [];
let time = 0;

const COLORS = {
  molten: '#e87040',
  incandescent: '#fff4d4',
  steel: '#4a6070',
  slag: '#4a2040',
  bg: '#1a1a1e'
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  initCracks();
}

function initCracks() {
  cracks = [];
  const numCracks = 24;
  for (let i = 0; i < numCracks; i++) {
    const angle = (i / numCracks) * Math.PI * 2 + Math.random() * 0.3;
    const segments = [];
    const len = Math.min(W, H) * (0.15 + Math.random() * 0.25);
    let x = 0, y = 0;
    const steps = 8 + Math.floor(Math.random() * 6);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const r = len * t;
      const drift = (Math.random() - 0.5) * 30 * t;
      x = Math.cos(angle + drift * 0.01) * r;
      y = Math.sin(angle + drift * 0.01) * r;
      segments.push({ x, y, t });
    }
    cracks.push({ angle, segments, speed: 0.5 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2 });
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * Math.min(W, H) * 0.35;
    particles.push({
      x: Math.cos(angle) * dist,
      y: Math.sin(angle) * dist,
      vx: 0, vy: 0,
      baseAngle: angle,
      baseDist: dist,
      size: 1 + Math.random() * 3,
      heat: Math.random(),
      orbitSpeed: (0.2 + Math.random() * 0.5) * (Math.random() > 0.5 ? 1 : -1)
    });
  }
}

function getHeatAtPoint(x, y) {
  const distFromCenter = Math.sqrt(x * x + y * y);
  const maxDist = Math.min(W, H) * 0.4;
  let heat = 1 - Math.min(distFromCenter / maxDist, 1);
  
  // Mouse proximity increases heat
  const mx = mouseX - cx, my = mouseY - cy;
  const distFromMouse = Math.sqrt((x - mx) ** 2 + (y - my) ** 2);
  const mouseHeat = Math.max(0, 1 - distFromMouse / 150) * 0.6;
  heat = Math.min(1, heat + mouseHeat);
  
  return heat;
}

function heatColor(heat) {
  if (heat > 0.85) return COLORS.incandescent;
  if (heat > 0.6) return COLORS.molten;
  if (heat > 0.35) return COLORS.slag;
  return COLORS.steel;
}

function drawCore() {
  // Central glow
  const pulse = Math.sin(time * 0.02) * 0.15 + 0.85;
  const coreRadius = Math.min(W, H) * 0.06 * pulse;
  
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 3);
  grad.addColorStop(0, 'rgba(255, 244, 212, 0.9)');
  grad.addColorStop(0.3, 'rgba(232, 112, 64, 0.6)');
  grad.addColorStop(0.6, 'rgba(74, 32, 64, 0.3)');
  grad.addColorStop(1, 'rgba(26, 26, 30, 0)');
  
  ctx.beginPath();
  ctx.arc(cx, cy, coreRadius * 3, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Inner bright core
  const innerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius);
  innerGrad.addColorStop(0, '#fffef8');
  innerGrad.addColorStop(0.5, '#fff4d4');
  innerGrad.addColorStop(1, '#e87040');
  
  ctx.beginPath();
  ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
  ctx.fillStyle = innerGrad;
  ctx.fill();
}

function drawCracks() {
  cracks.forEach(crack => {
    const flowOffset = Math.sin(time * 0.015 * crack.speed + crack.phase);
    
    ctx.beginPath();
    crack.segments.forEach((seg, i) => {
      const heat = getHeatAtPoint(seg.x, seg.y);
      const px = cx + seg.x;
      const py = cy + seg.y;
      
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        // Add wobble based on heat
        const wobble = heat * Math.sin(time * 0.03 + i + crack.phase) * 3;
        ctx.lineTo(px + wobble, py + wobble);
      }
    });
    
    // Heat-based gradient along crack
    const lastSeg = crack.segments[crack.segments.length - 1];
    const crackGrad = ctx.createLinearGradient(cx, cy, cx + lastSeg.x, cy + lastSeg.y);
    crackGrad.addColorStop(0, 'rgba(255, 244, 212, 0.8)');
    crackGrad.addColorStop(0.3, 'rgba(232, 112, 64, 0.6)');
    crackGrad.addColorStop(0.7, 'rgba(74, 32, 64, 0.3)');
    crackGrad.addColorStop(1, 'rgba(74, 96, 112, 0.1)');
    
    ctx.strokeStyle = crackGrad;
    ctx.lineWidth = 1.5 + flowOffset * 0.5;
    ctx.stroke();
    
    // Glow on hot parts
    crack.segments.forEach((seg, i) => {
      if (i % 3 !== 0) return;
      const heat = getHeatAtPoint(seg.x, seg.y);
      if (heat > 0.5) {
        ctx.beginPath();
        ctx.arc(cx + seg.x, cy + seg.y, heat * 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232, 112, 64, ${heat * 0.3})`;
        ctx.fill();
      }
    });
  });
}

function drawParticles() {
  particles.forEach(p => {
    // Orbit around center
    p.baseAngle += p.orbitSpeed * 0.003;
    
    const heat = getHeatAtPoint(p.x, p.y);
    
    // Heat makes particles drift outward and jitter
    const jitter = heat * 2;
    p.x = Math.cos(p.baseAngle) * p.baseDist + (Math.random() - 0.5) * jitter;
    p.y = Math.sin(p.baseAngle) * p.baseDist + (Math.random() - 0.5) * jitter;
    
    // Expand slightly when hot
    p.baseDist += (heat - 0.4) * 0.1;
    p.baseDist = Math.max(15, Math.min(p.baseDist, Math.min(W, H) * 0.45));
    
    const color = heatColor(heat);
    const alpha = 0.3 + heat * 0.7;
    const size = p.size * (0.8 + heat * 0.5);
    
    ctx.beginPath();
    ctx.arc(cx + p.x, cy + p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawShell() {
  // Outer shell — steel blue ring suggesting solid exterior
  const shellRadius = Math.min(W, H) * 0.38;
  const shellWidth = 2;
  
  ctx.beginPath();
  ctx.arc(cx, cy, shellRadius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(74, 96, 112, 0.3)';
  ctx.lineWidth = shellWidth;
  ctx.setLineDash([4, 8]);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Stress marks on shell
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2 + time * 0.001;
    const stress = Math.sin(time * 0.02 + i * 1.5) * 0.5 + 0.5;
    const x1 = cx + Math.cos(angle) * (shellRadius - 10);
    const y1 = cy + Math.sin(angle) * (shellRadius - 10);
    const x2 = cx + Math.cos(angle) * (shellRadius + 5 + stress * 8);
    const y2 = cy + Math.sin(angle) * (shellRadius + 5 + stress * 8);
    
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(74, 96, 112, ${0.2 + stress * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawHeatDistortion() {
  // Subtle radial lines showing heat radiation
  const numRays = 36;
  for (let i = 0; i < numRays; i++) {
    const angle = (i / numRays) * Math.PI * 2;
    const waveOffset = Math.sin(time * 0.025 + i * 0.5) * 10;
    const innerR = Math.min(W, H) * 0.08;
    const outerR = Math.min(W, H) * 0.2 + waveOffset;
    
    const x1 = cx + Math.cos(angle) * innerR;
    const y1 = cy + Math.sin(angle) * innerR;
    const x2 = cx + Math.cos(angle) * outerR;
    const y2 = cy + Math.sin(angle) * outerR;
    
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(232, 112, 64, ${0.05 + Math.sin(time * 0.03 + i) * 0.03})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

function draw() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
  
  drawHeatDistortion();
  drawCracks();
  drawParticles();
  drawCore();
  drawShell();
  
  time++;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => {
  mouseX = -1000;
  mouseY = -1000;
});

resize();
initParticles();
draw();
</script>
</body>
</html>
