<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>源点 / Origin Point</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #FFF8F0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
function resize() {
  W = canvas.width = Math.min(window.innerWidth, window.innerHeight, 800);
  H = canvas.height = W;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// Palette — spring-toned resonance
const palette = [
  [255, 183, 197, 0.6],  // sakura pink
  [168, 216, 185, 0.6],  // tender green
  [135, 206, 235, 0.5],  // sky blue
  [200, 162, 200, 0.5],  // lavender
  [255, 222, 173, 0.4],  // apricot
];

class Wave {
  constructor(x, y, birth, colorIdx) {
    this.x = x;
    this.y = y;
    this.birth = birth;
    this.speed = 0.8 + Math.random() * 0.3;
    this.color = palette[colorIdx % palette.length];
    this.maxRadius = W * 0.6;
  }

  draw(t) {
    const age = (t - this.birth) * 0.001;
    const r = age * 80 * this.speed;
    if (r > this.maxRadius) return false;

    const fade = 1 - (r / this.maxRadius);
    const breathe = 0.5 + 0.5 * Math.sin(age * 2);
    const alpha = this.color[3] * fade * (0.6 + 0.4 * breathe);

    // Draw 3 concentric rings per wave for richness
    for (let i = 0; i < 3; i++) {
      const ri = r - i * 4;
      if (ri < 0) continue;
      const lineWidth = (3 - i) * 1.2 * fade;
      ctx.beginPath();
      ctx.arc(this.x, this.y, ri, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${alpha * (1 - i * 0.25)})`;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
    return true;
  }
}

// Interference pattern renderer
function drawInterference(t) {
  const elapsed = t * 0.001;
  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;

  // 3-5 source points that slowly orbit
  const sources = [];
  const numSources = 4;
  for (let i = 0; i < numSources; i++) {
    const angle = (Math.PI * 2 * i / numSources) + elapsed * 0.15;
    const dist = W * 0.12 + W * 0.05 * Math.sin(elapsed * 0.3 + i);
    sources.push({
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist
    });
  }

  // Per-pixel interference
  const freq = 0.06 + 0.01 * Math.sin(elapsed * 0.2);
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      let sum = 0;
      for (let s = 0; s < numSources; s++) {
        const dx = px - sources[s].x;
        const dy = py - sources[s].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        sum += Math.sin(dist * freq - elapsed * 1.5 + s * 0.7);
      }
      // Normalize to [0, 1]
      const val = (sum / numSources + 1) * 0.5;

      // Map to palette blend
      const pi = val * (palette.length - 1);
      const idx = Math.floor(pi);
      const frac = pi - idx;
      const c1 = palette[Math.min(idx, palette.length - 1)];
      const c2 = palette[Math.min(idx + 1, palette.length - 1)];

      const r = c1[0] + (c2[0] - c1[0]) * frac;
      const g = c1[1] + (c2[1] - c1[1]) * frac;
      const b = c1[2] + (c2[2] - c1[2]) * frac;

      // Soft vignette
      const vdx = (px - cx) / cx;
      const vdy = (py - cy) / cy;
      const vignette = 1 - 0.3 * (vdx * vdx + vdy * vdy);

      const intensity = 0.15 + 0.85 * val;
      const alpha = intensity * vignette;

      const offset = (py * W + px) * 4;
      // Blend with background #FFF8F0
      data[offset]     = 255 * (1 - alpha) + r * alpha;
      data[offset + 1] = 248 * (1 - alpha) + g * alpha;
      data[offset + 2] = 240 * (1 - alpha) + b * alpha;
      data[offset + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// Floating particles along wave fronts
const particles = [];
for (let i = 0; i < 40; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    dist: W * 0.05 + Math.random() * W * 0.35,
    size: 1.5 + Math.random() * 2.5,
    speed: 0.2 + Math.random() * 0.4,
    colorIdx: Math.floor(Math.random() * palette.length),
    phase: Math.random() * Math.PI * 2
  });
}

function drawParticles(t) {
  const elapsed = t * 0.001;
  for (const p of particles) {
    const angle = p.angle + elapsed * p.speed * 0.1;
    const breathe = Math.sin(elapsed * 0.8 + p.phase);
    const dist = p.dist + breathe * 8;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const c = palette[p.colorIdx];
    const alpha = 0.4 + 0.3 * Math.sin(elapsed + p.phase);

    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
    ctx.fill();

    // Soft glow
    const grad = ctx.createRadialGradient(x, y, 0, x, y, p.size * 4);
    grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${alpha * 0.3})`);
    grad.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.beginPath();
    ctx.arc(x, y, p.size * 4, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// Central glow
function drawCenterGlow(t) {
  const elapsed = t * 0.001;
  const pulse = 0.6 + 0.4 * Math.sin(elapsed * 0.5);
  const radius = W * 0.08 * pulse;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  grad.addColorStop(0, `rgba(255, 255, 255, ${0.6 * pulse})`);
  grad.addColorStop(0.5, `rgba(255, 222, 173, ${0.2 * pulse})`);
  grad.addColorStop(1, 'rgba(255, 248, 240, 0)');
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

// Ripple rings from center
const ripples = [];
let lastRipple = 0;

function animate(t) {
  // Interference background
  drawInterference(t);

  // Spawn ripple every 2s
  if (t - lastRipple > 2000) {
    ripples.push(new Wave(cx, cy, t, ripples.length));
    lastRipple = t;
  }

  // Draw ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    if (!ripples[i].draw(t)) {
      ripples.splice(i, 1);
    }
  }

  drawParticles(t);
  drawCenterGlow(t);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
