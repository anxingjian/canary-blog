<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蚀 / Erode</title>
<style>
* { margin: 0; padding: 0; }
body { background: #1a1a2e; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouseX = -1, mouseY = -1;
let prevMouseX = -1, prevMouseY = -1;
let mouseSpeed = 0;

const VERDIGRIS = '#4a9e8e';
const ABYSS = '#1a1a2e';
const WEATHERED = '#8e8d8a';
const BARE = '#ede6d6';

// Rock layers — each layer is a row of columns with height and material
const COLS = 200;
let layers = []; // array of column heights per layer
let particles = [];
let erosionParticles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initRock();
}

function initRock() {
  layers = [];
  // Create layered rock structure from bottom up
  // 5 layers with different materials
  const layerDefs = [
    { color: ABYSS, baseH: H * 0.15, variance: 8 },      // deepest
    { color: '#2a3a4e', baseH: H * 0.12, variance: 12 },  // deep blue-gray
    { color: VERDIGRIS, baseH: H * 0.10, variance: 15 },   // verdigris band
    { color: WEATHERED, baseH: H * 0.13, variance: 10 },   // weathered gray
    { color: BARE, baseH: H * 0.08, variance: 6 },         // top bare rock
  ];

  const colW = W / COLS;
  for (let l = 0; l < layerDefs.length; l++) {
    const def = layerDefs[l];
    const heights = [];
    for (let c = 0; c < COLS; c++) {
      // Use perlin-like noise via sin combinations
      const x = c / COLS;
      const h = def.baseH +
        Math.sin(x * 6.28 * 2 + l * 1.7) * def.variance +
        Math.sin(x * 6.28 * 5 + l * 3.1) * def.variance * 0.5 +
        Math.sin(x * 6.28 * 11 + l * 0.3) * def.variance * 0.25;
      heights.push(Math.max(4, h));
    }
    layers.push({ ...def, heights });
  }
}

function getWindAt(x, y) {
  if (mouseX < 0) return { vx: 0, vy: 0 };
  const dx = x - mouseX;
  const dy = y - mouseY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const radius = 150;
  if (dist > radius) return { vx: 0, vy: 0 };

  const strength = (1 - dist / radius) * mouseSpeed * 0.3;
  const windDirX = mouseX - prevMouseX;
  const windDirY = mouseY - prevMouseY;
  const windLen = Math.sqrt(windDirX * windDirX + windDirY * windDirY) || 1;

  return {
    vx: (windDirX / windLen) * strength + (dx / dist) * strength * 0.3,
    vy: -strength * 0.5 + (windDirY / windLen) * strength * 0.2
  };
}

function erodeAt(col, amount) {
  // Erode from top layer down
  const colW = W / COLS;
  const cx = (col + 0.5) * colW;

  for (let l = layers.length - 1; l >= 0; l--) {
    if (layers[l].heights[col] > 2) {
      const eroded = Math.min(amount, layers[l].heights[col] - 2);
      layers[l].heights[col] -= eroded;

      // Calculate y position of erosion
      let y = H;
      for (let ll = 0; ll <= l; ll++) {
        y -= layers[ll].heights[col];
      }

      // Spawn erosion particles
      for (let i = 0; i < Math.ceil(eroded * 2); i++) {
        const wind = getWindAt(cx, y);
        erosionParticles.push({
          x: cx + (Math.random() - 0.5) * colW,
          y: y + Math.random() * 3,
          vx: wind.vx * 0.5 + (Math.random() - 0.5) * 2,
          vy: -Math.random() * 2 - 1,
          size: Math.random() * 2.5 + 0.5,
          color: layers[l].color,
          life: 1,
          decay: 0.003 + Math.random() * 0.008,
          gravity: 0.02 + Math.random() * 0.03
        });
      }
      break;
    }
  }
}

function drawRock() {
  const colW = W / COLS;

  for (let c = 0; c < COLS; c++) {
    let y = H;
    for (let l = 0; l < layers.length; l++) {
      const h = layers[l].heights[c];
      y -= h;
      ctx.fillStyle = layers[l].color;
      ctx.fillRect(c * colW, y, colW + 0.5, h + 0.5);
    }

    // Draw surface highlight on topmost visible layer
    for (let l = layers.length - 1; l >= 0; l--) {
      if (layers[l].heights[c] > 2) {
        let surfY = H;
        for (let ll = 0; ll <= l; ll++) surfY -= layers[ll].heights[c];
        // Subtle highlight line
        ctx.fillStyle = 'rgba(237,230,214,0.15)';
        ctx.fillRect(c * colW, surfY, colW + 0.5, 1);
        break;
      }
    }
  }
}

function updateParticles() {
  for (let i = erosionParticles.length - 1; i >= 0; i--) {
    const p = erosionParticles[i];
    const wind = getWindAt(p.x, p.y);
    p.vx += wind.vx * 0.1;
    p.vy += p.gravity + wind.vy * 0.05;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;

    if (p.life <= 0 || p.y > H + 10 || p.x < -50 || p.x > W + 50) {
      erosionParticles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (const p of erosionParticles) {
    ctx.globalAlpha = p.life * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Ambient wind particles (always present, subtle)
let ambientParticles = [];
function initAmbient() {
  for (let i = 0; i < 60; i++) {
    ambientParticles.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      vx: 0.3 + Math.random() * 0.5,
      vy: Math.sin(Math.random() * 6.28) * 0.2,
      size: Math.random() * 1.5 + 0.3,
      phase: Math.random() * 6.28
    });
  }
}

let time = 0;
function updateAmbient() {
  time += 0.01;
  for (const p of ambientParticles) {
    p.x += p.vx + Math.sin(time + p.phase) * 0.3;
    p.y += p.vy + Math.cos(time * 0.7 + p.phase) * 0.2;
    if (p.x > W + 10) { p.x = -10; p.y = Math.random() * H * 0.6; }
    if (p.y < -10 || p.y > H) { p.y = Math.random() * H * 0.6; }
  }
}

function drawAmbient() {
  ctx.fillStyle = WEATHERED;
  for (const p of ambientParticles) {
    ctx.globalAlpha = 0.15 + Math.sin(time + p.phase) * 0.1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Wind visualization near mouse
function drawWind() {
  if (mouseX < 0 || mouseSpeed < 0.5) return;
  const count = Math.min(mouseSpeed * 3, 20);
  ctx.strokeStyle = 'rgba(237,230,214,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i < count; i++) {
    const angle = Math.atan2(mouseY - prevMouseY, mouseX - prevMouseX);
    const spread = (Math.random() - 0.5) * 1.5;
    const dist = Math.random() * 120;
    const x = mouseX + Math.cos(angle + spread) * dist;
    const y = mouseY + Math.sin(angle + spread) * dist;
    const len = 15 + Math.random() * 25;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
    ctx.stroke();
  }
}

function frame() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0f23');
  grad.addColorStop(0.4, '#1a1a2e');
  grad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawAmbient();
  drawWind();
  drawRock();

  // Erosion logic: if mouse is moving over rock, erode
  if (mouseSpeed > 1 && mouseX > 0) {
    const colW = W / COLS;
    const centerCol = Math.floor(mouseX / colW);
    const radius = Math.floor(mouseSpeed * 0.8) + 2;
    for (let c = centerCol - radius; c <= centerCol + radius; c++) {
      if (c >= 0 && c < COLS) {
        const dist = Math.abs(c - centerCol);
        const amount = (1 - dist / (radius + 1)) * mouseSpeed * 0.04;
        if (Math.random() < 0.3) erodeAt(c, amount);
      }
    }
  }

  // Natural erosion (very slow ambient)
  if (Math.random() < 0.05) {
    const c = Math.floor(Math.random() * COLS);
    erodeAt(c, 0.1);
  }

  updateParticles();
  drawParticles();
  updateAmbient();

  requestAnimationFrame(frame);
}

// Event listeners
canvas.addEventListener('mousemove', (e) => {
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (prevMouseX >= 0) {
    const dx = mouseX - prevMouseX;
    const dy = mouseY - prevMouseY;
    mouseSpeed = Math.sqrt(dx * dx + dy * dy);
  }
});

canvas.addEventListener('mouseleave', () => {
  mouseX = -1;
  mouseSpeed = 0;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  mouseX = t.clientX;
  mouseY = t.clientY;
  if (prevMouseX >= 0) {
    const dx = mouseX - prevMouseX;
    const dy = mouseY - prevMouseY;
    mouseSpeed = Math.sqrt(dx * dx + dy * dy);
  }
}, { passive: false });

canvas.addEventListener('touchend', () => {
  mouseX = -1;
  mouseSpeed = 0;
});

window.addEventListener('resize', resize);
resize();
initAmbient();
frame();
</script>
</body>
</html>
