<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泛音 / Overtone</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0a0a; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let time = 0;
let harmonics = 3;
const MAX_H = 12;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Draw horizontal strings vibrating at harmonic frequencies
// Minimal: just lines, brightness, and thickness encode information
function draw() {
  time += 0.01;

  // Very soft fade for ghosting effect
  ctx.fillStyle = 'rgba(10,10,10,0.05)';
  ctx.fillRect(0, 0, W, H);

  const marginX = W * 0.12;
  const marginY = H * 0.08;
  const stringW = W - marginX * 2;
  const availH = H - marginY * 2;

  // Each harmonic is a horizontal string
  for (let n = 1; n <= harmonics; n++) {
    const y0 = marginY + (availH / (harmonics + 1)) * n;
    const amplitude = Math.min(availH / (harmonics + 1) * 0.35, 40);

    // Standing wave: sin(n*pi*x/L) * cos(n*omega*t)
    // Amplitude decreases with harmonic number
    const amp = amplitude / Math.sqrt(n);
    const envelope = Math.cos(n * 0.7 * time);

    // Warmth increases slightly with harmonic number
    const base = 180;
    const r = base + n * 4;
    const g = base - n * 2;
    const b = base - n * 6;

    // Ghost trail — previous positions (from envelope)
    const trailAlpha = 0.04;
    ctx.beginPath();
    for (let px = 0; px <= stringW; px += 2) {
      const xNorm = px / stringW;
      const spatial = Math.sin(n * Math.PI * xNorm);
      const prevEnv = Math.cos(n * 0.7 * (time - 0.3));
      const y = y0 + spatial * amp * prevEnv;
      if (px === 0) ctx.moveTo(marginX, y);
      else ctx.lineTo(marginX + px, y);
    }
    ctx.strokeStyle = `rgba(${r},${g},${b},${trailAlpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Main string
    ctx.beginPath();
    for (let px = 0; px <= stringW; px += 1.5) {
      const xNorm = px / stringW;
      const spatial = Math.sin(n * Math.PI * xNorm);
      const y = y0 + spatial * amp * envelope;
      if (px === 0) ctx.moveTo(marginX, y);
      else ctx.lineTo(marginX + px, y);
    }

    // Brightness based on energy (amplitude of oscillation)
    const energy = Math.abs(envelope);
    const alpha = 0.15 + energy * 0.5;
    const lw = 0.8 + energy * 1.2;

    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth = lw;
    ctx.stroke();

    // Nodes — fixed points where string doesn't move
    for (let k = 0; k <= n; k++) {
      const nodeX = marginX + (k / n) * stringW;
      const pulse = 0.4 + 0.3 * Math.sin(time * 1.5 + k);

      ctx.beginPath();
      ctx.arc(nodeX, y0, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,210,195,${pulse * 0.6})`;
      ctx.fill();
    }

    // Antinodes — max amplitude points, subtle glow when energized
    for (let k = 0; k < n; k++) {
      const antiX = marginX + ((k + 0.5) / n) * stringW;
      const antiY = y0 + Math.sin(n * Math.PI * ((k + 0.5) / n)) * amp * envelope;

      if (energy > 0.3) {
        const grd = ctx.createRadialGradient(antiX, antiY, 0, antiX, antiY, 8 + energy * 6);
        grd.addColorStop(0, `rgba(${r},${g},${b},${energy * 0.15})`);
        grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.beginPath();
        ctx.arc(antiX, antiY, 8 + energy * 6, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }
    }
  }

  // Fixed endpoints — the two ends of all strings
  for (const x of [marginX, marginX + stringW]) {
    ctx.beginPath();
    ctx.moveTo(x, marginY);
    ctx.lineTo(x, marginY + availH);
    ctx.strokeStyle = 'rgba(200,190,175,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Composite waveform at bottom — sum of all harmonics
  const compY = H - marginY * 0.6;
  const compAmp = 20;
  ctx.beginPath();
  for (let px = 0; px <= stringW; px += 1.5) {
    const xNorm = px / stringW;
    let sum = 0;
    for (let n = 1; n <= harmonics; n++) {
      sum += Math.sin(n * Math.PI * xNorm) * Math.cos(n * 0.7 * time) / Math.sqrt(n);
    }
    const y = compY + sum * compAmp;
    if (px === 0) ctx.moveTo(marginX, y);
    else ctx.lineTo(marginX + px, y);
  }
  ctx.strokeStyle = 'rgba(210,195,170,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  requestAnimationFrame(draw);
}

canvas.addEventListener('click', () => {
  if (harmonics < MAX_H) harmonics++;
});

draw();
</script>
</body>
</html>
