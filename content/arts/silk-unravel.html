<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unravel 解 — Silk Series</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0D0B1A; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let threads = [];
let particles = [];
let mouseX = -1, mouseY = -1;
let mousePressed = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Colors
const BG = '#0D0B1A';
const SILVER = [232, 232, 232];
const TEAL = [0, 229, 204];
const DARK_PURPLE = [42, 27, 61];
const DEEP_TEAL = [6, 90, 79];

class Thread {
  constructor() {
    this.points = [];
    this.numPoints = 40 + Math.floor(Math.random() * 30);
    this.baseX = Math.random() * W;
    this.baseY = Math.random() * H;
    this.angle = Math.random() * Math.PI * 2;
    this.length = 80 + Math.random() * 200;
    this.tension = 1.0; // 1 = taut, 0 = fully unraveled
    this.unravelSpeed = 0.0005 + Math.random() * 0.001;
    this.phase = Math.random() * Math.PI * 2;
    this.frequency = 0.5 + Math.random() * 2;
    this.thickness = 0.5 + Math.random() * 1.5;
    this.opacity = 0.4 + Math.random() * 0.5;
    this.drift = { x: (Math.random() - 0.5) * 0.3, y: (Math.random() - 0.5) * 0.3 };
    this.init();
  }

  init() {
    this.points = [];
    for (let i = 0; i < this.numPoints; i++) {
      let t = i / (this.numPoints - 1);
      let x = this.baseX + Math.cos(this.angle) * this.length * (t - 0.5);
      let y = this.baseY + Math.sin(this.angle) * this.length * (t - 0.5);
      this.points.push({ x, y, vx: 0, vy: 0, origX: x, origY: y });
    }
  }

  update(time) {
    // Natural slow unraveling
    this.tension -= this.unravelSpeed;
    if (this.tension < 0) this.tension = 0;

    // Mouse interaction accelerates unraveling
    if (mousePressed) {
      let dx = mouseX - this.baseX;
      let dy = mouseY - this.baseY;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        this.tension -= 0.005 * (1 - dist / 200);
        if (this.tension < 0) this.tension = 0;
      }
    }

    // Drift
    this.baseX += this.drift.x;
    this.baseY += this.drift.y;

    for (let i = 0; i < this.points.length; i++) {
      let p = this.points[i];
      let t = i / (this.points.length - 1);

      // When tension is high, stay structured
      // When tension drops, points drift freely
      let freedom = 1 - this.tension;
      let wave = Math.sin(time * this.frequency + this.phase + i * 0.2) * 20 * freedom;
      let waveY = Math.cos(time * this.frequency * 0.7 + this.phase + i * 0.15) * 15 * freedom;

      // Gravity-like drift when unraveled
      p.vy += freedom * 0.02;
      p.vx += (Math.random() - 0.5) * freedom * 0.3;
      p.vy *= 0.98;
      p.vx *= 0.98;

      let targetX = p.origX + this.drift.x * time * 10 + wave + p.vx;
      let targetY = p.origY + this.drift.y * time * 10 + waveY + p.vy;

      p.x += (targetX - p.x) * 0.05;
      p.y += (targetY - p.y) * 0.05;

      // Emit particles when unraveling
      if (freedom > 0.3 && Math.random() < freedom * 0.02) {
        particles.push(new Particle(p.x, p.y));
      }
    }
  }

  draw() {
    if (this.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);

    for (let i = 1; i < this.points.length - 1; i++) {
      let xc = (this.points[i].x + this.points[i + 1].x) / 2;
      let yc = (this.points[i].y + this.points[i + 1].y) / 2;
      ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
    }

    let last = this.points[this.points.length - 1];
    ctx.lineTo(last.x, last.y);

    // Color shifts from silver to teal as it unravels
    let freedom = 1 - this.tension;
    let r = SILVER[0] + (TEAL[0] - SILVER[0]) * freedom;
    let g = SILVER[1] + (TEAL[1] - SILVER[1]) * freedom;
    let b = SILVER[2] + (TEAL[2] - SILVER[2]) * freedom;
    let alpha = this.opacity * (0.3 + this.tension * 0.7);

    ctx.strokeStyle = `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${alpha})`;
    ctx.lineWidth = this.thickness * (0.3 + this.tension * 0.7);
    ctx.lineCap = 'round';
    ctx.stroke();

    // Glow when unraveling
    if (freedom > 0.4) {
      ctx.strokeStyle = `rgba(0, 229, 204, ${freedom * 0.15})`;
      ctx.lineWidth = this.thickness * 3;
      ctx.stroke();
    }
  }
}

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2 - 0.5;
    this.life = 1.0;
    this.decay = 0.008 + Math.random() * 0.015;
    this.size = 1 + Math.random() * 2.5;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.01;
    this.vx *= 0.99;
    this.life -= this.decay;
  }

  draw() {
    if (this.life <= 0) return;
    let alpha = this.life * 0.8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 229, 204, ${alpha})`;
    ctx.fill();

    // Soft glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 229, 204, ${alpha * 0.1})`;
    ctx.fill();
  }
}

// Initialize threads
for (let i = 0; i < 60; i++) {
  threads.push(new Thread());
}

// Central knot — denser threads in center
for (let i = 0; i < 25; i++) {
  let t = new Thread();
  t.baseX = W * 0.4 + Math.random() * W * 0.2;
  t.baseY = H * 0.4 + Math.random() * H * 0.2;
  t.length = 40 + Math.random() * 100;
  t.unravelSpeed *= 0.5; // center unravels slower
  t.init();
  threads.push(t);
}

canvas.addEventListener('mousedown', () => mousePressed = true);
canvas.addEventListener('mouseup', () => mousePressed = false);
canvas.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('touchstart', (e) => { mousePressed = true; mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
canvas.addEventListener('touchmove', (e) => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
canvas.addEventListener('touchend', () => mousePressed = false);

let startTime = Date.now();

function draw() {
  let time = (Date.now() - startTime) / 1000;

  // Fade background for trails
  ctx.fillStyle = 'rgba(13, 11, 26, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Subtle vignette
  let grad = ctx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.7);
  grad.addColorStop(0, 'rgba(42, 27, 61, 0)');
  grad.addColorStop(1, 'rgba(13, 11, 26, 0.03)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Update and draw threads
  for (let t of threads) {
    t.update(time);
    t.draw();
  }

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Cap particles
  if (particles.length > 500) {
    particles.splice(0, particles.length - 500);
  }

  // Respawn fully unraveled threads as new ones (cycle)
  for (let i = 0; i < threads.length; i++) {
    if (threads[i].tension <= 0 && Math.random() < 0.001) {
      threads[i] = new Thread();
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
