<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬 / Suspend</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #1a1020; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouseX = -1000, mouseY = -1000;
let mouseVX = 0, mouseVY = 0;
let prevMX = 0, prevMY = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Colors
const BG = '#1a1020';        // deep plum-black room
const IVORY = [245, 240, 230];
const COPPER = [184, 115, 51];
const SLATE = [108, 122, 137];
const PLUM = [74, 25, 66];

// Light beam parameters
const beamCenterX = () => W * 0.55;
const beamTopWidth = () => W * 0.06;
const beamBottomWidth = () => W * 0.22;
const beamAngle = -0.08; // slight tilt

// Particles
const NUM = 800;
const particles = [];

class Particle {
  constructor() {
    this.reset(true);
  }
  reset(init) {
    // Scatter across canvas but weighted toward beam area
    const inBeam = Math.random() < 0.7;
    if (inBeam) {
      const t = Math.random();
      const bw = beamTopWidth() + t * (beamBottomWidth() - beamTopWidth());
      this.x = beamCenterX() + (Math.random() - 0.5) * bw + t * beamAngle * H;
      this.y = t * H;
    } else {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
    }
    this.z = Math.random(); // depth 0=far, 1=close
    this.size = 1 + this.z * 3 + Math.random() * 2;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -0.1 + Math.random() * 0.2; // slight upward drift (thermal)
    this.life = 1;
    this.maxLife = 300 + Math.random() * 500;
    this.age = init ? Math.random() * this.maxLife : 0;
    // Color pick
    const r = Math.random();
    if (r < 0.45) this.color = IVORY;
    else if (r < 0.75) this.color = COPPER;
    else if (r < 0.92) this.color = SLATE;
    else this.color = PLUM;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.rot = Math.random() * Math.PI * 2;
    this.aspect = 0.3 + Math.random() * 0.7; // elongation
  }
  
  inBeam() {
    const t = this.y / H;
    const bw = beamTopWidth() + t * (beamBottomWidth() - beamTopWidth());
    const cx = beamCenterX() + t * beamAngle * H;
    return Math.abs(this.x - cx) < bw * 0.5;
  }

  update() {
    this.age++;
    if (this.age > this.maxLife) {
      this.reset(false);
      return;
    }
    // Fade in/out
    const fadeIn = Math.min(this.age / 60, 1);
    const fadeOut = Math.min((this.maxLife - this.age) / 60, 1);
    this.life = fadeIn * fadeOut;
    
    // Brownian motion
    this.vx += (Math.random() - 0.5) * 0.08;
    this.vy += (Math.random() - 0.5) * 0.06;
    // Thermal updraft in beam
    if (this.inBeam()) {
      this.vy -= 0.015;
    }
    // Gravity (very slight)
    this.vy += 0.003;
    // Damping
    this.vx *= 0.98;
    this.vy *= 0.98;
    // Mouse influence
    const dx = this.x - mouseX;
    const dy = this.y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const influence = 120 * (1 + this.z);
    if (dist < influence && dist > 1) {
      const force = (1 - dist / influence) * 2;
      this.vx += (dx / dist) * force + mouseVX * 0.1;
      this.vy += (dy / dist) * force + mouseVY * 0.1;
    }
    this.x += this.vx * (0.5 + this.z * 0.5);
    this.y += this.vy * (0.5 + this.z * 0.5);
    this.rot += this.rotSpeed;
    // Wrap
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
    if (this.y < -20) this.y = H + 20;
    if (this.y > H + 20) this.y = -20;
  }

  draw() {
    const ib = this.inBeam();
    const brightness = ib ? (0.7 + this.z * 0.3) : (0.1 + this.z * 0.15);
    const alpha = this.life * brightness;
    if (alpha < 0.01) return;
    const [r, g, b] = this.color;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = alpha;
    // Glow for particles in beam
    if (ib && this.z > 0.5) {
      ctx.shadowColor = `rgba(${r},${g},${b},${alpha * 0.5})`;
      ctx.shadowBlur = this.size * 3;
    }
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * this.aspect, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < NUM; i++) {
  particles.push(new Particle());
}

// Sort by depth for proper layering
particles.sort((a, b) => a.z - b.z);

function drawBeam() {
  // Light beam - gradient from top to bottom, widening
  const cx = beamCenterX();
  const tw = beamTopWidth();
  const bw = beamBottomWidth();
  
  // Main beam shape
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - tw * 0.5, 0);
  ctx.lineTo(cx + tw * 0.5, 0);
  ctx.lineTo(cx + bw * 0.5 + beamAngle * H, H);
  ctx.lineTo(cx - bw * 0.5 + beamAngle * H, H);
  ctx.closePath();
  
  // Radial-ish gradient within beam
  const grad = ctx.createLinearGradient(cx - bw * 0.3, 0, cx + bw * 0.3, 0);
  grad.addColorStop(0, 'rgba(245,240,230,0)');
  grad.addColorStop(0.3, 'rgba(245,240,230,0.03)');
  grad.addColorStop(0.5, 'rgba(245,240,230,0.06)');
  grad.addColorStop(0.7, 'rgba(245,240,230,0.03)');
  grad.addColorStop(1, 'rgba(245,240,230,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Vertical fade - brighter at top (light source)
  const vgrad = ctx.createLinearGradient(0, 0, 0, H);
  vgrad.addColorStop(0, 'rgba(245,240,230,0.04)');
  vgrad.addColorStop(0.3, 'rgba(245,240,230,0.02)');
  vgrad.addColorStop(1, 'rgba(245,240,230,0)');
  ctx.fillStyle = vgrad;
  ctx.fill();
  ctx.restore();
}

function drawVignette() {
  const grad = ctx.createRadialGradient(W * 0.55, H * 0.4, W * 0.1, W * 0.5, H * 0.5, W * 0.8);
  grad.addColorStop(0, 'rgba(26,16,32,0)');
  grad.addColorStop(0.7, 'rgba(26,16,32,0.3)');
  grad.addColorStop(1, 'rgba(26,16,32,0.85)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

let frame = 0;
function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  
  // Draw beam behind particles
  drawBeam();
  
  // Update and draw particles
  for (const p of particles) {
    p.update();
  }
  // Re-sort occasionally
  if (frame % 120 === 0) particles.sort((a, b) => a.z - b.z);
  for (const p of particles) {
    p.draw();
  }
  
  // Vignette on top
  drawVignette();
  
  // Mouse velocity
  mouseVX = mouseX - prevMX;
  mouseVY = mouseY - prevMY;
  prevMX = mouseX;
  prevMY = mouseY;
  
  frame++;
  requestAnimationFrame(draw);
}

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => {
  mouseX = -1000;
  mouseY = -1000;
});
// Touch
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => {
  mouseX = -1000;
  mouseY = -1000;
});

draw();
</script>
</body>
</html>
