<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沉 / Settle</title>
<style>
* { margin: 0; padding: 0; }
body { background: #1a1a1a; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let mouseDown = false;
let mx = 0, my = 0;
let sedimentRows = []; // accumulated sediment height per column
const COLS = 200;
let colW;

const PALETTE = {
  hematite:  { r: 139, g: 37, b: 0 },   // #8B2500 heavy
  pyrite:    { r: 184, g: 134, b: 11 },  // #B8860B medium
  slate:     { r: 72, g: 61, b: 81 },    // #483D51 light
  quartz:    { r: 212, g: 207, b: 201 }, // #D4CFC9 ultra-light
};

const TYPES = [
  { key: 'hematite', weight: 1.0, sizeMin: 3, sizeMax: 7, fallSpeed: 0.8, drift: 0.3 },
  { key: 'pyrite',   weight: 0.6, sizeMin: 2, sizeMax: 5, fallSpeed: 0.45, drift: 0.5 },
  { key: 'slate',    weight: 0.3, sizeMin: 1.5, sizeMax: 3.5, fallSpeed: 0.2, drift: 0.8 },
  { key: 'quartz',   weight: 0.1, sizeMin: 1, sizeMax: 2, fallSpeed: 0.08, drift: 1.2 },
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  colW = W / COLS;
  if (sedimentRows.length === 0) {
    sedimentRows = new Array(COLS).fill(0);
  }
}

function createParticle(x, y) {
  const typeIdx = Math.random() < 0.3 ? 0 : Math.random() < 0.5 ? 1 : Math.random() < 0.7 ? 2 : 3;
  const type = TYPES[typeIdx];
  const col = PALETTE[type.key];
  const size = type.sizeMin + Math.random() * (type.sizeMax - type.sizeMin);
  const alpha = 0.5 + Math.random() * 0.5;
  return {
    x: x ?? Math.random() * W,
    y: y ?? -Math.random() * H * 0.5,
    vx: (Math.random() - 0.5) * type.drift,
    vy: type.fallSpeed * (0.7 + Math.random() * 0.6),
    size,
    col,
    alpha,
    type: typeIdx,
    settled: false,
    noiseOffset: Math.random() * 1000,
    life: 0,
  };
}

function init() {
  resize();
  for (let i = 0; i < 600; i++) {
    particles.push(createParticle(null, Math.random() * H * 0.8));
  }
}

function simplerNoise(t) {
  return Math.sin(t * 1.7) * 0.5 + Math.sin(t * 3.1) * 0.25 + Math.sin(t * 5.9) * 0.125;
}

function update() {
  // spawn new particles from top
  if (particles.length < 800) {
    for (let i = 0; i < 3; i++) {
      particles.push(createParticle());
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.settled) continue;

    p.life++;

    // mouse interaction: if mouseDown, push particles away from mouse
    if (mouseDown) {
      const dx = p.x - mx;
      const dy = p.y - my;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = (150 - dist) / 150 * 2;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force * 0.5;
        p.vy = Math.min(p.vy, 5);
      }
    }

    // drift with pseudo-noise
    const drift = simplerNoise(p.life * 0.01 + p.noiseOffset) * TYPES[p.type].drift * 0.3;
    p.vx += drift * 0.02;
    p.vx *= 0.98; // air resistance

    // gravity based on weight
    const gravity = TYPES[p.type].weight * 0.015;
    p.vy += gravity;
    p.vy = Math.min(p.vy, TYPES[p.type].fallSpeed * 2);

    p.x += p.vx;
    p.y += p.vy;

    // wrap horizontally
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    // check sediment collision
    const col = Math.floor(p.x / colW);
    if (col >= 0 && col < COLS) {
      const groundY = H - sedimentRows[col];
      if (p.y + p.size >= groundY) {
        // settle
        p.settled = true;
        p.y = groundY - p.size * 0.5;
        sedimentRows[col] += p.size * 0.4;
        // smooth neighbors
        if (col > 0) sedimentRows[col - 1] += p.size * 0.1;
        if (col < COLS - 1) sedimentRows[col + 1] += p.size * 0.1;
      }
    }

    // off bottom (safety)
    if (p.y > H + 20) {
      particles.splice(i, 1);
    }
  }

  // remove old settled particles that are buried deep (optimization)
  if (particles.length > 1200) {
    particles = particles.filter(p => !p.settled || p.y > H - 200);
  }
}

function drawSedimentLayer() {
  // Draw accumulated sediment as a gradient terrain
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < COLS; i++) {
    const x = i * colW + colW * 0.5;
    const y = H - sedimentRows[i];
    if (i === 0) ctx.lineTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  // gradient: hematite at bottom, pyrite middle, slate top
  const maxSed = Math.max(...sedimentRows, 1);
  const grd = ctx.createLinearGradient(0, H, 0, H - maxSed);
  grd.addColorStop(0, 'rgba(139, 37, 0, 0.9)');
  grd.addColorStop(0.35, 'rgba(184, 134, 11, 0.7)');
  grd.addColorStop(0.7, 'rgba(72, 61, 81, 0.6)');
  grd.addColorStop(1, 'rgba(212, 207, 201, 0.4)');
  ctx.fillStyle = grd;
  ctx.fill();

  // subtle strata lines
  ctx.strokeStyle = 'rgba(212, 207, 201, 0.08)';
  ctx.lineWidth = 1;
  for (let layer = 5; layer < maxSed; layer += 8) {
    ctx.beginPath();
    for (let i = 0; i < COLS; i++) {
      const x = i * colW + colW * 0.5;
      const baseY = H - layer;
      const wobble = simplerNoise(i * 0.05 + layer * 0.01) * 3;
      if (sedimentRows[i] >= layer) {
        if (i === 0) ctx.moveTo(x, baseY + wobble);
        else ctx.lineTo(x, baseY + wobble);
      }
    }
    ctx.stroke();
  }
}

function draw() {
  // fade background
  ctx.fillStyle = 'rgba(26, 26, 26, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // draw sediment
  drawSedimentLayer();

  // draw floating particles
  for (const p of particles) {
    if (p.settled) continue;
    const { r, g, b } = p.col;
    const a = p.alpha * (0.6 + 0.4 * Math.sin(p.life * 0.03));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.fill();

    // glow for heavier particles
    if (p.type <= 1 && p.size > 3) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.1})`;
      ctx.fill();
    }
  }

  // subtle vignette
  const vgrd = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.8);
  vgrd.addColorStop(0, 'rgba(26,26,26,0)');
  vgrd.addColorStop(1, 'rgba(26,26,26,0.5)');
  ctx.fillStyle = vgrd;
  ctx.fillRect(0, 0, W, H);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousedown', (e) => { mouseDown = true; mx = e.clientX; my = e.clientY; });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
canvas.addEventListener('touchstart', (e) => { mouseDown = true; mx = e.touches[0].clientX; my = e.touches[0].clientY; });
canvas.addEventListener('touchend', () => { mouseDown = false; });
canvas.addEventListener('touchmove', (e) => { mx = e.touches[0].clientX; my = e.touches[0].clientY; });

window.addEventListener('resize', resize);
init();
loop();
</script>
</body>
</html>
