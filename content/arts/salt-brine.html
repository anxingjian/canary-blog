<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brine 卤 — Salt Series</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #F5E6D3; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, mouse = { x: 0, y: 0, active: false };
let particles = [];
let crystalSeeds = [];
let time = 0;

const PALETTE = {
  bg: '#F5E6D3',
  brine: '#1B4B5A',
  mineral: '#D4A574',
  artemia: '#8B2252',
  crystal: '#E8F4E8'
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  init();
}

function init() {
  particles = [];
  crystalSeeds = [];
  
  // Brine particles — dissolved ions drifting in saturated solution
  for (let i = 0; i < 800; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: Math.random() * 3 + 1,
      type: Math.random() < 0.7 ? 'ion' : Math.random() < 0.8 ? 'mineral' : 'artemia',
      phase: Math.random() * Math.PI * 2,
      oscillation: Math.random() * 0.5 + 0.2
    });
  }
  
  // Crystal nucleation seeds — hexagonal hints
  for (let i = 0; i < 12; i++) {
    crystalSeeds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 0,
      maxSize: Math.random() * 40 + 20,
      growth: 0,
      angle: Math.random() * Math.PI,
      opacity: 0
    });
  }
}

function drawGradientLayer() {
  // Density gradient — darker at bottom (heavier brine sinks)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(245, 230, 211, 0.0)');
  grad.addColorStop(0.6, 'rgba(27, 75, 90, 0.05)');
  grad.addColorStop(1, 'rgba(27, 75, 90, 0.15)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawConvectionCurrents() {
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 5; i++) {
    const cx = W * (i + 0.5) / 5;
    const cy = H * 0.5 + Math.sin(time * 0.001 + i) * H * 0.2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 80 + Math.sin(time * 0.002 + i) * 20, 200, 
      Math.sin(time * 0.0005 + i * 0.7) * 0.3, 0, Math.PI * 2);
    ctx.strokeStyle = PALETTE.brine;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    // Brownian motion + convection
    const brownian = 0.1;
    p.vx += (Math.random() - 0.5) * brownian;
    p.vy += (Math.random() - 0.5) * brownian + 0.01; // slight downward drift
    
    // Mouse disturbance
    if (mouse.active) {
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = (150 - dist) / 150 * 0.5;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
    }
    
    // Damping
    p.vx *= 0.98;
    p.vy *= 0.98;
    
    p.x += p.vx;
    p.y += p.vy;
    
    // Wrap
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;
    
    // Oscillation (shimmer)
    const shimmer = Math.sin(time * 0.003 + p.phase) * p.oscillation;
    
    ctx.beginPath();
    if (p.type === 'ion') {
      // Cubic/orthorhombic ion shape
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(time * 0.001 + p.phase);
      const s = p.size + shimmer;
      ctx.rect(-s/2, -s/2, s, s);
      ctx.fillStyle = `rgba(27, 75, 90, ${0.3 + shimmer * 0.2})`;
      ctx.fill();
      ctx.restore();
    } else if (p.type === 'mineral') {
      // Mineral deposits — warm caramel dots
      ctx.arc(p.x, p.y, p.size * 1.5 + shimmer, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212, 165, 116, ${0.4 + shimmer * 0.3})`;
      ctx.fill();
    } else {
      // Artemia — tiny elongated shapes
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.ellipse(0, 0, p.size * 3, p.size * 0.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(139, 34, 82, ${0.5 + shimmer * 0.2})`;
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawCrystalSeeds() {
  for (const seed of crystalSeeds) {
    // Crystals try to grow, but mouse disturbance dissolves them
    if (mouse.active) {
      const dx = seed.x - mouse.x;
      const dy = seed.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        seed.growth = Math.max(0, seed.growth - 0.02);
      } else {
        seed.growth = Math.min(1, seed.growth + 0.001);
      }
    } else {
      seed.growth = Math.min(1, seed.growth + 0.002);
    }
    
    seed.opacity = seed.growth * 0.6;
    seed.size = seed.maxSize * seed.growth;
    
    if (seed.size < 1) continue;
    
    // Draw hexagonal crystal hint
    ctx.save();
    ctx.translate(seed.x, seed.y);
    ctx.rotate(seed.angle);
    ctx.globalAlpha = seed.opacity;
    
    // Halite cubic structure
    ctx.beginPath();
    const s = seed.size;
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i;
      const px = Math.cos(a) * s;
      const py = Math.sin(a) * s;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = PALETTE.crystal;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Inner facets
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * s * 0.6, Math.sin(a) * s * 0.6);
    }
    ctx.strokeStyle = `rgba(232, 244, 232, 0.3)`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    
    // Crystal fill — barely there
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i;
      const px = Math.cos(a) * s * 0.4;
      const py = Math.sin(a) * s * 0.4;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(232, 244, 232, 0.15)`;
    ctx.fill();
    
    ctx.restore();
  }
}

function drawSurfaceFilm() {
  // Evaporation surface — shimmering film at top
  ctx.save();
  const filmY = H * 0.08;
  ctx.globalAlpha = 0.08 + Math.sin(time * 0.002) * 0.03;
  ctx.beginPath();
  ctx.moveTo(0, filmY);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, filmY + Math.sin(x * 0.01 + time * 0.002) * 3);
  }
  ctx.lineTo(W, 0);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fillStyle = PALETTE.mineral;
  ctx.fill();
  ctx.restore();
}

function drawDensityRipples() {
  // Schlieren-like density striations
  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 8; i++) {
    const y = H * (0.3 + i * 0.08);
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= W; x += 10) {
      const wave = Math.sin(x * 0.005 + time * 0.001 + i) * 15 +
                   Math.sin(x * 0.012 + time * 0.0015) * 8;
      ctx.lineTo(x, y + wave);
    }
    ctx.strokeStyle = i % 2 === 0 ? PALETTE.brine : PALETTE.mineral;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function animate() {
  time++;
  
  // Semi-transparent background for trails
  ctx.fillStyle = `rgba(245, 230, 211, 0.08)`;
  ctx.fillRect(0, 0, W, H);
  
  // Every 300 frames, do a fuller clear to prevent mudding
  if (time % 300 === 0) {
    ctx.fillStyle = `rgba(245, 230, 211, 0.3)`;
    ctx.fillRect(0, 0, W, H);
  }
  
  drawGradientLayer();
  drawDensityRipples();
  drawConvectionCurrents();
  drawParticles();
  drawCrystalSeeds();
  drawSurfaceFilm();
  
  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
});

canvas.addEventListener('touchend', () => {
  mouse.active = false;
});

window.addEventListener('resize', resize);
resize();

// Initial full clear
ctx.fillStyle = PALETTE.bg;
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
