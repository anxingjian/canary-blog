<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散 / Scatter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #3d2b1f; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
let gusts = [];
const PARTICLE_COUNT = 2000;
const COLORS = ['#dfcc20', '#0047ab', '#f0f4f8', '#8b7355', '#dfcc20'];
const WEIGHTS = [0.35, 0.2, 0.25, 0.1, 0.1];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() {
    this.reset(true);
  }
  reset(initial) {
    // Particles start settled on the ground
    this.x = Math.random() * W;
    this.y = initial ? H * (0.65 + Math.random() * 0.35) : H + 10;
    this.vx = 0;
    this.vy = 0;
    this.size = 1 + Math.random() * 3;
    this.mass = this.size * (0.5 + Math.random() * 0.5);
    this.gravity = 0.02 + Math.random() * 0.03;
    this.friction = 0.98 + Math.random() * 0.015;
    this.settled = initial;
    this.life = 1;
    // Pick color
    let r = Math.random(), acc = 0;
    this.colorIdx = 0;
    for (let i = 0; i < WEIGHTS.length; i++) {
      acc += WEIGHTS[i];
      if (r < acc) { this.colorIdx = i; break; }
    }
    this.color = COLORS[this.colorIdx];
    this.alpha = 0.6 + Math.random() * 0.4;
  }
  update() {
    if (this.settled) {
      // Slight jitter for ground particles
      this.x += (Math.random() - 0.5) * 0.2;
      return;
    }
    // Apply gusts
    for (let g of gusts) {
      let dx = this.x - g.x;
      let dy = this.y - g.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < g.radius) {
        let force = (1 - dist / g.radius) * g.strength / this.mass;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force * 0.7;
      }
    }
    // Gravity
    this.vy += this.gravity;
    // Lateral wind drift
    this.vx += (Math.random() - 0.48) * 0.1;
    // Friction
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.x += this.vx;
    this.y += this.vy;
    // Fade as they rise
    if (this.y < H * 0.3) {
      this.life -= 0.005;
    }
    // Reset if offscreen or dead
    if (this.x < -50 || this.x > W + 50 || this.y < -50 || this.y > H + 50 || this.life <= 0) {
      this.reset(false);
      this.y = H * (0.7 + Math.random() * 0.3);
      this.settled = true;
    }
    // Re-settle if slow and low
    if (Math.abs(this.vx) < 0.1 && Math.abs(this.vy) < 0.3 && this.y > H * 0.7) {
      this.settled = true;
      this.vx = 0;
      this.vy = 0;
    }
  }
  draw() {
    ctx.globalAlpha = this.alpha * this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Initialize particles
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

class Gust {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 150 + Math.random() * 200;
    this.strength = 3 + Math.random() * 4;
    this.life = 1;
    this.decay = 0.015 + Math.random() * 0.01;
  }
  update() {
    this.life -= this.decay;
    this.strength *= 0.97;
    this.radius += 2;
  }
  alive() { return this.life > 0; }
}

// Click to create gust
canvas.addEventListener('click', (e) => {
  gusts.push(new Gust(e.clientX, e.clientY));
  // Unsettle nearby particles
  for (let p of particles) {
    let dx = p.x - e.clientX;
    let dy = p.y - e.clientY;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 250 && p.settled) {
      p.settled = false;
      p.vx = (dx / dist) * (3 + Math.random() * 5);
      p.vy = -(2 + Math.random() * 6);
      p.life = 1;
    }
  }
});

// Ambient wind gusts
let ambientTimer = 0;
function ambientGust() {
  if (Math.random() < 0.008) {
    let x = Math.random() * W;
    let y = H * (0.6 + Math.random() * 0.3);
    gusts.push(new Gust(x, y));
    // Unsettle some particles
    for (let p of particles) {
      let dx = p.x - x;
      let dy = p.y - y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 180 && p.settled && Math.random() < 0.3) {
        p.settled = false;
        p.vx = (dx / dist) * (1 + Math.random() * 2);
        p.vy = -(1 + Math.random() * 3);
        p.life = 1;
      }
    }
  }
}

// Draw ground texture
function drawGround() {
  let gradient = ctx.createLinearGradient(0, H * 0.65, 0, H);
  gradient.addColorStop(0, 'rgba(61, 43, 31, 0)');
  gradient.addColorStop(0.3, 'rgba(61, 43, 31, 0.3)');
  gradient.addColorStop(1, 'rgba(61, 43, 31, 0.8)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, H * 0.65, W, H * 0.35);
}

// Draw sky gradient (cobalt fading up)
function drawSky() {
  let gradient = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  gradient.addColorStop(0, '#0047ab');
  gradient.addColorStop(0.5, 'rgba(0, 71, 171, 0.3)');
  gradient.addColorStop(1, 'rgba(0, 71, 171, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H * 0.5);
}

function draw() {
  // Clear with base color
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#3d2b1f';
  ctx.fillRect(0, 0, W, H);

  drawSky();
  drawGround();

  // Update gusts
  gusts = gusts.filter(g => { g.update(); return g.alive(); });

  ambientGust();

  // Update and draw particles
  for (let p of particles) {
    p.update();
    p.draw();
  }

  // Draw gust indicators (subtle rings)
  for (let g of gusts) {
    ctx.globalAlpha = g.life * 0.15;
    ctx.strokeStyle = '#dfcc20';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius * (1 - g.life), 0, Math.PI * 2);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
