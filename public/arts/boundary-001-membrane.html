<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>膜 / Membrane</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0c; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, mx = 0.5, my = 0.5;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);
addEventListener('mousemove', e => { mx = e.clientX / W; my = e.clientY / H; });

// Membrane: a curved vertical boundary
class Particle {
  constructor(side) {
    this.side = side; // 0 = left (inside), 1 = right (outside)
    this.reset();
  }
  reset() {
    const margin = W * 0.08;
    if (this.side === 0) {
      this.x = margin + Math.random() * (W * 0.42);
    } else {
      this.x = W * 0.58 + Math.random() * (W * 0.42 - margin);
    }
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.r = 1.2 + Math.random() * 2.5;
    this.life = 1;
    this.crossing = false;
    this.crossPhase = 0;
  }
  membraneX(y) {
    // Membrane is a gentle sine curve in the center, influenced by mouse
    const base = W * 0.5;
    const wave = Math.sin(y * 0.008 + performance.now() * 0.0003) * W * 0.04;
    const mouseInfluence = (mx - 0.5) * W * 0.06;
    return base + wave + mouseInfluence;
  }
  update() {
    // Gentle drift
    this.vx += (Math.random() - 0.5) * 0.06;
    this.vy += (Math.random() - 0.5) * 0.06;
    this.vx *= 0.995;
    this.vy *= 0.995;

    const memX = this.membraneX(this.y);
    const distToMembrane = this.x - memX;

    if (this.crossing) {
      // Slowly transit through
      this.crossPhase += 0.008;
      if (this.crossPhase >= 1) {
        this.crossing = false;
        this.side = 1 - this.side;
      }
    } else {
      // Check membrane collision
      const threshold = 6;
      if (this.side === 0 && distToMembrane > -threshold && this.vx > 0) {
        // Left particle hitting membrane
        if (Math.random() < 0.008 + my * 0.005) {
          // Pass through — rare permeation
          this.crossing = true;
          this.crossPhase = 0;
        } else {
          // Bounce
          this.vx = -Math.abs(this.vx) * 0.6;
          this.x = memX - threshold;
        }
      } else if (this.side === 1 && distToMembrane < threshold && this.vx < 0) {
        if (Math.random() < 0.005 + (1 - my) * 0.004) {
          this.crossing = true;
          this.crossPhase = 0;
        } else {
          this.vx = Math.abs(this.vx) * 0.6;
          this.x = memX + threshold;
        }
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wrap vertically
    if (this.y < 0) this.y += H;
    if (this.y > H) this.y -= H;

    // Soft horizontal bounds
    if (this.x < 10) this.vx += 0.1;
    if (this.x > W - 10) this.vx -= 0.1;
  }
  draw() {
    const memX = this.membraneX(this.y);
    let alpha, r, g, b;

    if (this.crossing) {
      // Crossing particles glow white
      const t = this.crossPhase;
      alpha = 0.3 + 0.7 * Math.sin(t * Math.PI);
      r = 230; g = 230; b = 240;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * (1 + t * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
      return;
    }

    const dist = Math.abs(this.x - memX);
    const nearness = Math.max(0, 1 - dist / (W * 0.25));

    if (this.side === 0) {
      // Inside: warm tones — amber/terracotta
      r = 200 + nearness * 55;
      g = 130 + nearness * 40;
      b = 80 + nearness * 30;
      alpha = 0.25 + nearness * 0.45;
    } else {
      // Outside: cool tones — slate blue/teal
      r = 80 + nearness * 30;
      g = 140 + nearness * 50;
      b = 190 + nearness * 50;
      alpha = 0.25 + nearness * 0.45;
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
  }
}

// Create particles
const particles = [];
for (let i = 0; i < 350; i++) {
  particles.push(new Particle(0));
  particles.push(new Particle(1));
}

function drawMembrane() {
  const t = performance.now() * 0.0003;
  ctx.beginPath();
  for (let y = 0; y <= H; y += 2) {
    const x = W * 0.5 + Math.sin(y * 0.008 + t) * W * 0.04 + (mx - 0.5) * W * 0.06;
    if (y === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  // Membrane: thin luminous line with glow
  ctx.strokeStyle = 'rgba(200, 195, 185, 0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Inner glow
  ctx.strokeStyle = 'rgba(200, 195, 185, 0.04)';
  ctx.lineWidth = 12;
  ctx.stroke();

  // Outer glow
  ctx.strokeStyle = 'rgba(200, 195, 185, 0.015)';
  ctx.lineWidth = 40;
  ctx.stroke();

  // Pulsing nodes along the membrane
  const nodeCount = 8;
  for (let i = 0; i < nodeCount; i++) {
    const ny = (H / nodeCount) * (i + 0.5) + Math.sin(t * 2 + i) * 20;
    const nx = W * 0.5 + Math.sin(ny * 0.008 + t) * W * 0.04 + (mx - 0.5) * W * 0.06;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.2);
    const radius = 2 + pulse * 3;

    ctx.beginPath();
    ctx.arc(nx, ny, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 215, 200, ${0.15 + pulse * 0.2})`;
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(nx, ny, radius * 4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 215, 200, ${0.02 + pulse * 0.02})`;
    ctx.fill();
  }
}

function frame() {
  // Subtle fade trail
  ctx.fillStyle = 'rgba(10, 10, 12, 0.12)';
  ctx.fillRect(0, 0, W, H);

  drawMembrane();

  for (const p of particles) {
    p.update();
    p.draw();
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
