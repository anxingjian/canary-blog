<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collective Intelligence</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #050505; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2rem">WebGL not supported</p>'; }

let W, H;
function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, W, H);
}
resize();
window.addEventListener('resize', resize);

// Shader sources
const vsrc = `attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const fsrc = `
precision highp float;
uniform float u_time;
uniform vec2 u_res;

#define NUM_CELLS 12
#define NUM_CLUSTERS 4
#define PI 3.14159265

// Hash functions
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float hash1(float n) {
  return fract(sin(n) * 43758.5453);
}

// Smooth noise
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// Cluster center positions (slow orbits)
vec2 clusterPos(int id, float t) {
  float fi = float(id);
  float angle = fi * PI * 0.5 + t * 0.15 * (0.7 + 0.3 * hash1(fi));
  float radius = 0.2 + 0.1 * sin(t * 0.1 + fi * 2.0);
  return vec2(cos(angle), sin(angle)) * radius;
}

// Cell position within a cluster
vec2 cellPos(int clusterId, int cellId, float t) {
  float fc = float(clusterId);
  float fi = float(cellId);
  vec2 center = clusterPos(clusterId, t);
  float angle = fi * PI * 2.0 / 3.0 + t * 0.3 * (1.0 + 0.5 * hash1(fi + fc * 10.0));
  float r = 0.06 + 0.03 * sin(t * 0.5 + fi * 1.5 + fc);
  // Add jitter
  r += 0.01 * noise(vec2(fi + fc * 7.0, t * 0.8));
  return center + vec2(cos(angle), sin(angle)) * r;
}

// Bioelectric pulse — travels between cells
float pulse(vec2 uv, vec2 from, vec2 to, float t, float speed, float phase) {
  float progress = fract(t * speed + phase);
  vec2 pos = mix(from, to, progress);
  float d = length(uv - pos);
  float intensity = exp(-d * d * 8000.0) * (0.5 + 0.5 * sin(progress * PI));
  return intensity;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time;
  
  // Background: deep dark with subtle texture
  float bg_noise = noise(uv * 8.0 + t * 0.02) * 0.015;
  vec3 col = vec3(0.02, 0.025, 0.03) + bg_noise;
  
  // Subtle grid suggesting underlying structure
  float grid = smoothstep(0.005, 0.0, abs(fract(uv.x * 20.0) - 0.5) - 0.49)
             + smoothstep(0.005, 0.0, abs(fract(uv.y * 20.0) - 0.5) - 0.49);
  col += vec3(0.01, 0.015, 0.02) * grid * 0.3;
  
  // Draw clusters and cells
  float totalGlow = 0.0;
  vec3 cellColor = vec3(0.0);
  
  for (int c = 0; c < NUM_CLUSTERS; c++) {
    vec2 cCenter = clusterPos(c, t);
    float cDist = length(uv - cCenter);
    
    // Cluster aura — the "tissue level" intelligence
    float aura = exp(-cDist * cDist * 40.0) * 0.15;
    float cHue = float(c) * 0.25;
    vec3 auraCol;
    if (c == 0) auraCol = vec3(0.1, 0.2, 0.4); // deep blue
    else if (c == 1) auraCol = vec3(0.15, 0.35, 0.3); // teal
    else if (c == 2) auraCol = vec3(0.3, 0.15, 0.35); // purple
    else auraCol = vec3(0.15, 0.3, 0.2); // green
    
    col += auraCol * aura;
    
    // Draw individual cells within cluster
    for (int i = 0; i < 3; i++) {
      vec2 cp = cellPos(c, i, t);
      float d = length(uv - cp);
      
      // Cell body — small bright dot
      float cell = exp(-d * d * 15000.0);
      
      // Cell membrane glow
      float membrane = exp(-d * d * 2000.0) * 0.4;
      
      // Breathing animation (cell-level agency)
      float breath = 0.7 + 0.3 * sin(t * 1.5 + float(i) * 2.0 + float(c) * 3.0);
      
      // Color: warm core (amber/gold), cool membrane
      vec3 coreCol = vec3(0.9, 0.7, 0.3) * breath; // amber — bioelectric
      vec3 memCol = auraCol * 1.5;
      
      cellColor += coreCol * cell + memCol * membrane;
      totalGlow += cell + membrane * 0.5;
    }
    
    // Bioelectric pulses between cells in same cluster
    for (int i = 0; i < 3; i++) {
      int j = i + 1;
      if (j >= 3) j = 0;
      vec2 from = cellPos(c, i, t);
      vec2 to = cellPos(c, j, t);
      
      float p = pulse(uv, from, to, t, 0.4, float(c) * 0.25 + float(i) * 0.33);
      // Pulse color: golden bioelectric signal
      cellColor += vec3(1.0, 0.85, 0.4) * p * 0.8;
    }
  }
  
  // Inter-cluster communication (organism-level)
  for (int c1 = 0; c1 < NUM_CLUSTERS; c1++) {
    int c2 = c1 + 1;
    if (c2 >= NUM_CLUSTERS) c2 = 0;
    vec2 from = clusterPos(c1, t);
    vec2 to = clusterPos(c2, t);
    
    // Slower, dimmer pulses between clusters
    float progress = fract(t * 0.15 + float(c1) * 0.25);
    vec2 pos = mix(from, to, progress);
    float d = length(uv - pos);
    float p = exp(-d * d * 5000.0) * (0.3 + 0.7 * sin(progress * PI));
    
    // Draw faint connection line
    vec2 dir = normalize(to - from);
    float along = dot(uv - from, dir);
    float across = length(uv - from - dir * along);
    float lineLen = length(to - from);
    float line = 0.0;
    if (along > 0.0 && along < lineLen) {
      line = exp(-across * across * 50000.0) * 0.08;
    }
    
    cellColor += vec3(0.4, 0.6, 0.9) * p * 0.5;
    col += vec3(0.1, 0.15, 0.25) * line;
  }
  
  col += cellColor;
  
  // Global emergent pattern — swarm-level
  float swarm = 0.0;
  for (int c = 0; c < NUM_CLUSTERS; c++) {
    vec2 cp = clusterPos(c, t);
    swarm += exp(-length(uv - cp) * 3.0);
  }
  // When clusters align, a faint larger pattern emerges
  float emergent = smoothstep(2.5, 3.5, swarm) * 0.1;
  col += vec3(0.3, 0.5, 0.7) * emergent;
  
  // Vignette
  float vig = 1.0 - dot(uv * 0.8, uv * 0.8);
  col *= smoothstep(0.0, 0.5, vig);
  
  // Subtle film grain
  float grain = hash(uv * 1000.0 + t) * 0.02;
  col += grain;
  
  gl_FragColor = vec4(col, 1.0);
}
`;

// Compile shaders
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vs = compile(gl.VERTEX_SHADER, vsrc);
const fs = compile(gl.FRAGMENT_SHADER, fsrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

// Full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes = gl.getUniformLocation(prog, 'u_res');

function frame(ms) {
  gl.uniform1f(uTime, ms * 0.001);
  gl.uniform2f(uRes, W, H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
