<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collective Self — Canary</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #050505; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Cells — each is a small agent with bioelectric potential
const NUM_CELLS = 280;
const cells = [];
const CONNECT_DIST = 90;
const SIGNAL_SPEED = 0.003;

class Cell {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.potential = Math.random(); // bioelectric potential 0-1
    this.phase = Math.random() * Math.PI * 2;
    this.radius = 2 + Math.random() * 2;
    this.connections = [];
  }

  update(t) {
    // Autonomous movement — slight drift
    this.x += this.vx;
    this.y += this.vy;

    // Wrap around
    if (this.x < 0) this.x += W;
    if (this.x > W) this.x -= W;
    if (this.y < 0) this.y += H;
    if (this.y > H) this.y -= H;

    // Phase oscillation (individual rhythm)
    this.phase += 0.01 + this.potential * 0.005;

    // Potential slowly oscillates
    this.potential = 0.5 + 0.5 * Math.sin(this.phase);
  }
}

for (let i = 0; i < NUM_CELLS; i++) {
  cells.push(new Cell());
}

// Gap junctions — find connections
function findConnections() {
  for (const cell of cells) {
    cell.connections = [];
  }
  for (let i = 0; i < cells.length; i++) {
    for (let j = i + 1; j < cells.length; j++) {
      const dx = cells[i].x - cells[j].x;
      const dy = cells[i].y - cells[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONNECT_DIST) {
        cells[i].connections.push({ cell: cells[j], dist });
        cells[j].connections.push({ cell: cells[i], dist });
      }
    }
  }
}

// Signal propagation — cells sync potentials through gap junctions
function propagateSignals() {
  for (const cell of cells) {
    let totalInfluence = 0;
    let count = 0;
    for (const conn of cell.connections) {
      const strength = 1 - conn.dist / CONNECT_DIST;
      totalInfluence += (conn.cell.potential - cell.potential) * strength * SIGNAL_SPEED;
      count++;
    }
    if (count > 0) {
      cell.potential += totalInfluence;
      // Cells with more connections sync faster — emergence of collective
      cell.phase += count * 0.0003;
    }
  }
}

// Cluster detection — find emergent "selves"
function findClusters() {
  const visited = new Set();
  const clusters = [];

  for (let i = 0; i < cells.length; i++) {
    if (visited.has(i)) continue;
    const cluster = [];
    const queue = [i];
    visited.add(i);

    while (queue.length > 0) {
      const idx = queue.shift();
      cluster.push(cells[idx]);
      for (const conn of cells[idx].connections) {
        const connIdx = cells.indexOf(conn.cell);
        if (!visited.has(connIdx)) {
          visited.add(connIdx);
          queue.push(connIdx);
        }
      }
    }
    if (cluster.length > 3) {
      clusters.push(cluster);
    }
  }
  return clusters;
}

let frame = 0;

function draw() {
  frame++;

  // Fade trail
  ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
  ctx.fillRect(0, 0, W, H);

  const t = frame * 0.01;

  // Update cells
  for (const cell of cells) {
    cell.update(t);
  }

  // Recalculate connections every 3 frames
  if (frame % 3 === 0) {
    findConnections();
  }

  // Propagate bioelectric signals
  propagateSignals();

  // Find emergent clusters
  const clusters = findClusters();

  // Draw gap junctions (connections)
  for (const cell of cells) {
    for (const conn of cell.connections) {
      const strength = 1 - conn.dist / CONNECT_DIST;
      const syncLevel = 1 - Math.abs(cell.potential - conn.cell.potential);

      // Color shifts from cold (isolated) to warm (synced)
      const r = Math.floor(180 + syncLevel * 75);
      const g = Math.floor(140 + syncLevel * 60);
      const b = Math.floor(100 - syncLevel * 50);

      ctx.beginPath();
      ctx.moveTo(cell.x, cell.y);
      ctx.lineTo(conn.cell.x, conn.cell.y);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${strength * syncLevel * 0.3})`;
      ctx.lineWidth = strength * 1.5;
      ctx.stroke();
    }
  }

  // Draw cluster boundaries — the emergent "selves"
  for (const cluster of clusters) {
    if (cluster.length < 8) continue;

    // Calculate centroid and average potential
    let cx = 0, cy = 0, avgPotential = 0;
    for (const cell of cluster) {
      cx += cell.x;
      cy += cell.y;
      avgPotential += cell.potential;
    }
    cx /= cluster.length;
    cy /= cluster.length;
    avgPotential /= cluster.length;

    // Larger clusters get a soft glow
    const glowRadius = Math.sqrt(cluster.length) * 15;
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);

    // Warm amber for highly synced clusters, cool blue for desynced
    const sync = avgPotential;
    const r = Math.floor(200 * sync + 80 * (1 - sync));
    const g = Math.floor(160 * sync + 100 * (1 - sync));
    const b = Math.floor(80 * sync + 180 * (1 - sync));

    gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.04)`);
    gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

    ctx.beginPath();
    ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Draw cells
  for (const cell of cells) {
    const brightness = 0.4 + cell.potential * 0.6;
    const connCount = cell.connections.length;

    // Cells with more connections are brighter (more "aware")
    const awareness = Math.min(connCount / 8, 1);

    // Color: isolated = steel blue, connected = warm amber
    const r = Math.floor(120 + awareness * 135);
    const g = Math.floor(140 + awareness * 70);
    const b = Math.floor(200 - awareness * 130);

    ctx.beginPath();
    ctx.arc(cell.x, cell.y, cell.radius * (0.8 + brightness * 0.4), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${brightness * 0.8})`;
    ctx.fill();

    // Inner glow for highly connected cells
    if (connCount > 4) {
      ctx.beginPath();
      ctx.arc(cell.x, cell.y, cell.radius * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 180, ${awareness * brightness * 0.6})`;
      ctx.fill();
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
