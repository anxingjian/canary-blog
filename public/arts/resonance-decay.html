<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衰减 / Decay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Color palette - teal/terracotta/gold on deep slate
const palette = {
  bg: '#1a1a2e',
  teal: [13, 115, 119],
  terracotta: [196, 90, 60],
  gold: [184, 134, 11],
  slate: [40, 40, 70]
};

class WaveSource {
  constructor(x, y, birth) {
    this.x = x;
    this.y = y;
    this.birth = birth;
    this.maxRadius = Math.max(W, H) * 0.8;
    this.speed = 1.2 + Math.random() * 0.5;
    this.segments = 60 + Math.floor(Math.random() * 40);
  }
}

let sources = [];
let time = 0;
let frameCount = 0;

// Start with center source
sources.push(new WaveSource(W / 2, H / 2, 0));

canvas.addEventListener('click', (e) => {
  if (sources.length < 7) {
    sources.push(new WaveSource(e.clientX, e.clientY, time));
  }
});

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpColor(c1, c2, t) {
  return [
    Math.round(lerp(c1[0], c2[0], t)),
    Math.round(lerp(c1[1], c2[1], t)),
    Math.round(lerp(c1[2], c2[2], t))
  ];
}

function draw() {
  // Slow fade — trails create depth
  ctx.fillStyle = 'rgba(26, 26, 46, 0.04)';
  ctx.fillRect(0, 0, W, H);

  time += 0.016;
  frameCount++;

  for (let src of sources) {
    const age = time - src.birth;
    const numRings = Math.min(Math.floor(age * 3), 18);

    for (let r = 0; r < numRings; r++) {
      const radius = (r + 1) * 40 * src.speed + age * 20;
      if (radius > src.maxRadius) continue;

      // Decay: opacity and completeness decrease with radius
      const decay = 1 - (radius / src.maxRadius);
      const decaySq = decay * decay;

      // Color shifts from teal (center) → gold (mid) → terracotta (edge)
      let color;
      const colorT = radius / src.maxRadius;
      if (colorT < 0.4) {
        color = lerpColor(palette.teal, palette.gold, colorT / 0.4);
      } else {
        color = lerpColor(palette.gold, palette.terracotta, (colorT - 0.4) / 0.6);
      }

      // Draw fragmented ring
      const segments = src.segments;
      const gapProbability = 1 - decaySq; // more gaps as wave decays
      const lineWidth = Math.max(0.5, 3 * decaySq);

      ctx.strokeStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${decaySq * 0.7})`;
      ctx.lineWidth = lineWidth;

      for (let s = 0; s < segments; s++) {
        // Skip segments based on decay (fragmentation)
        if (Math.random() < gapProbability * 0.7) continue;

        const startAngle = (s / segments) * Math.PI * 2;
        const endAngle = ((s + 0.8) / segments) * Math.PI * 2;

        // Wobble increases with radius (instability)
        const wobble = (1 - decay) * 8;
        const noise1 = Math.sin(startAngle * 3 + time * 2 + r) * wobble;
        const noise2 = Math.cos(startAngle * 5 + time * 1.5 + r * 2) * wobble;

        const r1 = radius + noise1;
        const r2 = radius + noise2;

        ctx.beginPath();
        const x1 = src.x + Math.cos(startAngle) * r1;
        const y1 = src.y + Math.sin(startAngle) * r1;
        const x2 = src.x + Math.cos(endAngle) * r2;
        const y2 = src.y + Math.sin(endAngle) * r2;

        // Quadratic curve for organic feel
        const midAngle = (startAngle + endAngle) / 2;
        const midR = (r1 + r2) / 2 + Math.sin(time + r + s) * wobble * 0.5;
        const cx = src.x + Math.cos(midAngle) * midR;
        const cy = src.y + Math.sin(midAngle) * midR;

        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cx, cy, x2, y2);
        ctx.stroke();
      }

      // Sparse glowing nodes at decay points
      if (r % 3 === 0 && decaySq > 0.1 && frameCount % 2 === 0) {
        const nodeAngle = time * 0.5 + r;
        const nx = src.x + Math.cos(nodeAngle) * radius;
        const ny = src.y + Math.sin(nodeAngle) * radius;
        const nodeSize = 2 * decaySq;

        ctx.beginPath();
        ctx.arc(nx, ny, nodeSize, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${palette.gold[0]}, ${palette.gold[1]}, ${palette.gold[2]}, ${decaySq * 0.8})`;
        ctx.fill();
      }
    }
  }

  // Central glow for newest source
  if (sources.length > 0) {
    const latest = sources[sources.length - 1];
    const latestAge = time - latest.birth;
    const glowIntensity = Math.max(0, 1 - latestAge * 0.1);
    if (glowIntensity > 0) {
      const grad = ctx.createRadialGradient(latest.x, latest.y, 0, latest.x, latest.y, 60);
      grad.addColorStop(0, `rgba(${palette.teal[0]}, ${palette.teal[1]}, ${palette.teal[2]}, ${glowIntensity * 0.3})`);
      grad.addColorStop(1, 'rgba(26, 26, 46, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(latest.x - 60, latest.y - 60, 120, 120);
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
