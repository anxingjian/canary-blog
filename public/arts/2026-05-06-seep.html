<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渗 / Seep</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f0e8; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouseX = 0.5, mouseY = 0.5;
let cracks = [];
let seepParticles = [];
let time = 0;

const COLORS = {
  substrate: '#f5f0e8',
  liquid: '#1b3a4b',
  rust: '#a0522d',
  salt: '#b8c4a8',
  crack: '#3d3d3d'
};

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  generateCracks();
}

function generateCracks() {
  cracks = [];
  const numCracks = 40 + Math.floor(Math.random() * 20);
  for (let i = 0; i < numCracks; i++) {
    const crack = {
      points: [],
      width: 0.5 + Math.random() * 2.5,
      filled: 0, // 0-1 how much liquid has seeped
      fillSpeed: 0.0005 + Math.random() * 0.002,
      branches: []
    };
    // Start from random edges or center
    let x = Math.random() * W;
    let y = Math.random() * H;
    let angle = Math.random() * Math.PI * 2;
    const segments = 8 + Math.floor(Math.random() * 20);
    crack.points.push({ x, y });
    for (let j = 0; j < segments; j++) {
      angle += (Math.random() - 0.5) * 0.8;
      const len = 10 + Math.random() * 40;
      x += Math.cos(angle) * len;
      y += Math.sin(angle) * len;
      crack.points.push({ x, y });
    }
    // Sub-branches
    const numBranches = Math.floor(Math.random() * 3);
    for (let b = 0; b < numBranches; b++) {
      const startIdx = Math.floor(Math.random() * crack.points.length);
      const branch = [];
      let bx = crack.points[startIdx].x;
      let by = crack.points[startIdx].y;
      let bAngle = Math.random() * Math.PI * 2;
      branch.push({ x: bx, y: by });
      const bSegs = 3 + Math.floor(Math.random() * 8);
      for (let s = 0; s < bSegs; s++) {
        bAngle += (Math.random() - 0.5) * 1.0;
        const bLen = 5 + Math.random() * 25;
        bx += Math.cos(bAngle) * bLen;
        by += Math.sin(bAngle) * bLen;
        branch.push({ x: bx, y: by });
      }
      crack.branches.push(branch);
    }
    cracks.push(crack);
  }
}

function drawCrackPath(points, width, filled) {
  if (points.length < 2) return;
  // Draw crack structure
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.strokeStyle = COLORS.crack;
  ctx.lineWidth = width * 0.6;
  ctx.globalAlpha = 0.3;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Draw filled portion (liquid seeping)
  if (filled > 0) {
    const fillIdx = Math.floor(filled * (points.length - 1));
    const fillFrac = (filled * (points.length - 1)) - fillIdx;
    
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i <= fillIdx && i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    if (fillIdx < points.length - 1) {
      const p1 = points[fillIdx];
      const p2 = points[fillIdx + 1];
      ctx.lineTo(p1.x + (p2.x - p1.x) * fillFrac, p1.y + (p2.y - p1.y) * fillFrac);
    }
    ctx.strokeStyle = COLORS.liquid;
    ctx.lineWidth = width;
    ctx.globalAlpha = 0.85;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Rust stains along filled portions (wider, faded)
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i <= Math.min(fillIdx, points.length - 1); i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = COLORS.rust;
    ctx.lineWidth = width * 3;
    ctx.globalAlpha = 0.12;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Salt deposits at the front
    if (filled > 0.1 && filled < 0.95) {
      const frontIdx = Math.min(fillIdx + 1, points.length - 1);
      const fp = points[frontIdx];
      ctx.beginPath();
      ctx.arc(fp.x, fp.y, width * 2 + Math.sin(time * 2) * 1, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.salt;
      ctx.globalAlpha = 0.4 + Math.sin(time * 3) * 0.1;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function spawnSeepParticle() {
  if (seepParticles.length > 200) return;
  const crack = cracks[Math.floor(Math.random() * cracks.length)];
  if (crack.filled < 0.1) return;
  const idx = Math.floor(Math.random() * Math.min(crack.filled * crack.points.length, crack.points.length - 1));
  const p = crack.points[idx];
  seepParticles.push({
    x: p.x + (Math.random() - 0.5) * 10,
    y: p.y + (Math.random() - 0.5) * 10,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    life: 1,
    decay: 0.002 + Math.random() * 0.005,
    size: 1 + Math.random() * 3,
    color: Math.random() > 0.6 ? COLORS.rust : COLORS.liquid
  });
}

function updateParticles() {
  for (let i = seepParticles.length - 1; i >= 0; i--) {
    const p = seepParticles[i];
    p.x += p.vx;
    p.y += p.vy + 0.05; // slight gravity
    p.life -= p.decay;
    if (p.life <= 0) {
      seepParticles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (const p of seepParticles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life * 0.5;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Porous texture overlay
function drawTexture() {
  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4 * 8) { // sparse for perf
    if (Math.random() > 0.97) {
      const noise = Math.floor((Math.random() - 0.5) * 15);
      data[i] = Math.max(0, Math.min(255, data[i] + noise));
      data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise));
      data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise));
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function getPressureGradient(crack) {
  // Mouse position affects seep speed — closer = more pressure
  const mid = crack.points[Math.floor(crack.points.length / 2)];
  const dx = (mouseX * W - mid.x) / W;
  const dy = (mouseY * H - mid.y) / H;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return 1 + (1 - Math.min(dist * 2, 1)) * 3; // 1x to 4x speed near mouse
}

function draw() {
  time += 0.016;
  
  // Clear with substrate color
  ctx.fillStyle = COLORS.substrate;
  ctx.fillRect(0, 0, W, H);

  // Draw subtle pore marks
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 300; i++) {
    const px = (Math.sin(i * 7.3 + time * 0.1) * 0.5 + 0.5) * W;
    const py = (Math.cos(i * 11.1 + time * 0.05) * 0.5 + 0.5) * H;
    ctx.beginPath();
    ctx.arc(px, py, 1 + Math.sin(i) * 2, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.crack;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Update and draw cracks
  for (const crack of cracks) {
    const pressure = getPressureGradient(crack);
    crack.filled = Math.min(1, crack.filled + crack.fillSpeed * pressure);
    drawCrackPath(crack.points, crack.width, crack.filled);
    
    // Draw branches (fill follows main)
    for (const branch of crack.branches) {
      const branchFill = Math.max(0, crack.filled - 0.3) / 0.7;
      drawCrackPath(branch, crack.width * 0.6, branchFill);
    }
  }

  // Particles
  if (Math.random() > 0.7) spawnSeepParticle();
  updateParticles();
  drawParticles();

  // Vignette — subtle warm edges
  const grad = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.7);
  grad.addColorStop(0, 'rgba(245,240,232,0)');
  grad.addColorStop(1, 'rgba(160,82,45,0.06)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => {
  mouseX = e.clientX / window.innerWidth;
  mouseY = e.clientY / window.innerHeight;
});
window.addEventListener('touchmove', e => {
  mouseX = e.touches[0].clientX / window.innerWidth;
  mouseY = e.touches[0].clientY / window.innerHeight;
});

resize();
draw();
</script>
</body>
</html>
