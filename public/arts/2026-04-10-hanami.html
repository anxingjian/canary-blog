<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花見 / Hanami</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
// 花見 / Hanami — Canary 2026-04-10
// Poisson-scattered rounded rectangles like petals on water
// Spring palette, semi-transparent layers, pollen particles

const PALETTE = [
  { hex: '#FFB7C5', w: 3 },  // 樱粉
  { hex: '#F7A8B8', w: 2 },  // 深樱粉
  { hex: '#A8D8B9', w: 3 },  // 嫩绿
  { hex: '#87CEEB', w: 2 },  // 天蓝
  { hex: '#FFDEAD', w: 2 },  // 杏黄
  { hex: '#C8A2C8', w: 1 },  // 薰衣草
  { hex: '#FFE4E1', w: 1 },  // 浅粉
  { hex: '#B5EAD7', w: 1 },  // 薄荷
];

const BG = '#FFF8F0';

function weightedRandom(palette) {
  let total = 0;
  for (let p of palette) total += p.w;
  let r = Math.random() * total;
  for (let p of palette) {
    r -= p.w;
    if (r <= 0) return p.hex;
  }
  return palette[0].hex;
}

// Poisson disk sampling
function poissonDisk(w, h, minDist, maxAttempts) {
  let cellSize = minDist / Math.SQRT2;
  let cols = Math.ceil(w / cellSize);
  let rows = Math.ceil(h / cellSize);
  let grid = new Array(cols * rows).fill(-1);
  let points = [];
  let active = [];

  function gridIdx(x, y) {
    return Math.floor(y / cellSize) * cols + Math.floor(x / cellSize);
  }

  let x0 = w / 2, y0 = h / 2;
  points.push({ x: x0, y: y0 });
  active.push(0);
  grid[gridIdx(x0, y0)] = 0;

  while (active.length > 0) {
    let ri = Math.floor(Math.random() * active.length);
    let pi = active[ri];
    let p = points[pi];
    let found = false;

    for (let n = 0; n < maxAttempts; n++) {
      let angle = Math.random() * Math.PI * 2;
      let dist = minDist + Math.random() * minDist;
      let nx = p.x + Math.cos(angle) * dist;
      let ny = p.y + Math.sin(angle) * dist;

      if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;

      let ci = Math.floor(nx / cellSize);
      let cj = Math.floor(ny / cellSize);
      let ok = true;

      for (let di = -2; di <= 2; di++) {
        for (let dj = -2; dj <= 2; dj++) {
          let ni = ci + di, nj = cj + dj;
          if (ni < 0 || ni >= cols || nj < 0 || nj >= rows) continue;
          let gi = grid[nj * cols + ni];
          if (gi >= 0) {
            let op = points[gi];
            let dx = op.x - nx, dy = op.y - ny;
            if (dx * dx + dy * dy < minDist * minDist) { ok = false; break; }
          }
        }
        if (!ok) break;
      }

      if (ok) {
        let idx = points.length;
        points.push({ x: nx, y: ny });
        active.push(idx);
        grid[cj * cols + ci] = idx;
        found = true;
        break;
      }
    }

    if (!found) active.splice(ri, 1);
  }

  return points;
}

function setup() {
  let sz = min(windowWidth, windowHeight);
  createCanvas(sz, sz);
  pixelDensity(2);
  noLoop();

  background(BG);

  // Subtle warm gradient
  noStroke();
  for (let y = 0; y < height; y += 2) {
    let a = map(y, 0, height, 0, 12);
    fill(255, 235, 210, a);
    rect(0, y, width, 2);
  }

  // Generate petal positions via Poisson disk
  let minDist = sz * 0.04;
  let pts = poissonDisk(width, height, minDist, 30);

  // Draw petals as rounded rectangles with noise rotation
  rectMode(CENTER);
  for (let p of pts) {
    let col = color(weightedRandom(PALETTE));
    let alpha = random(80, 200);
    col.setAlpha(alpha);

    let angle = noise(p.x * 0.005, p.y * 0.005) * TWO_PI;
    let w = random(sz * 0.02, sz * 0.07);
    let h = random(sz * 0.008, sz * 0.025);
    let r = min(w, h) * 0.4;

    push();
    translate(p.x, p.y);
    rotate(angle);
    noStroke();
    fill(col);
    rect(0, 0, w, h, r);

    // Light highlight
    let hc = color(255, 255, 255, alpha * 0.25);
    fill(hc);
    rect(0, -h * 0.15, w * 0.8, h * 0.3, r * 0.5);
    pop();
  }

  // Floating pollen particles
  let numPollen = floor(random(300, 500));
  for (let i = 0; i < numPollen; i++) {
    let px = random(width);
    let py = random(height);
    let ps = random(1, 3);
    let pc = color(weightedRandom(PALETTE));
    pc.setAlpha(random(25, 90));
    noStroke();
    fill(pc);
    ellipse(px, py, ps, ps);
  }

  // White sparkle dots
  for (let i = 0; i < 100; i++) {
    fill(255, 255, 255, random(30, 100));
    ellipse(random(width), random(height), random(1, 2.5));
  }
}
</script>
</body>
</html>
