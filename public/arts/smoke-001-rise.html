<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Rise 升 — Smoke 001</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A0A0A; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
canvas { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
</head>
<body>
<script>
// Rise 升 — turbulent convection smoke simulation
// Palette: void black, hot magenta, vivid violet, deep blue-purple, electric cyan

const COLORS = {
  hot: [247, 37, 133],      // #F72585 magenta
  mid: [114, 9, 183],       // #7209B7 violet
  cool: [58, 12, 163],      // #3A0CA3 deep blue-purple
  cold: [76, 201, 240],     // #4CC9F0 electric cyan
};

let particles = [];
let sources = [];
let noiseZ = 0;
let pg; // off-screen buffer for trail effect

const MAX_PARTICLES = 2000;
const EMIT_RATE = 8;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pg = createGraphics(width, height);
  pg.background(10);
  colorMode(RGB, 255, 255, 1);
  
  // Default source at center-bottom
  sources.push({ x: width / 2, y: height * 0.85, strength: 1 });
}

function draw() {
  // Fade trail buffer
  pg.noStroke();
  pg.fill(10, 10, 10, 0.04);
  pg.rect(0, 0, width, height);
  
  // Emit particles from sources
  for (let src of sources) {
    for (let i = 0; i < EMIT_RATE; i++) {
      if (particles.length < MAX_PARTICLES) {
        particles.push(new Particle(
          src.x + random(-8, 8),
          src.y + random(-4, 4),
          src.strength
        ));
      }
    }
  }
  
  // Mouse disturbance — add wind force
  let mx = mouseX;
  let my = mouseY;
  
  // Update and draw particles
  pg.noStroke();
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.update(mx, my);
    p.display(pg);
    if (p.isDead()) {
      particles.splice(i, 1);
    }
  }
  
  // Draw buffer to canvas
  image(pg, 0, 0);
  
  // Draw source glow
  for (let src of sources) {
    drawSourceGlow(src);
  }
  
  noiseZ += 0.003;
}

function drawSourceGlow(src) {
  noStroke();
  let pulse = 0.5 + 0.5 * sin(frameCount * 0.05);
  for (let r = 60; r > 0; r -= 4) {
    let alpha = map(r, 0, 60, 0.15 + pulse * 0.1, 0);
    let col = lerpColor(
      color(COLORS.hot[0], COLORS.hot[1], COLORS.hot[2], alpha),
      color(COLORS.mid[0], COLORS.mid[1], COLORS.mid[2], alpha * 0.5),
      map(r, 0, 60, 0, 1)
    );
    fill(col);
    ellipse(src.x, src.y, r, r * 0.6);
  }
}

class Particle {
  constructor(x, y, strength) {
    this.x = x;
    this.y = y;
    this.vx = random(-0.3, 0.3);
    this.vy = random(-1.5, -0.5) * strength;
    this.life = 1.0;
    this.decay = random(0.002, 0.006);
    this.size = random(2, 6);
    this.noiseOffset = random(1000);
    this.turbulenceStart = random(0.3, 0.6); // when turbulence kicks in
  }
  
  update(mx, my) {
    // Age determines behavior
    let age = 1 - this.life; // 0 = born, 1 = dead
    
    // Buoyancy (upward force, decreasing with age)
    let buoyancy = -0.04 * this.life;
    this.vy += buoyancy;
    
    // Turbulence increases with height/age
    let turbStrength = 0;
    if (age > this.turbulenceStart) {
      let t = map(age, this.turbulenceStart, 1, 0, 1);
      turbStrength = t * t * 2.5;
    }
    
    // Perlin noise turbulence
    let nScale = 0.005;
    let nx = noise(this.x * nScale, this.y * nScale, noiseZ + this.noiseOffset) - 0.5;
    let ny = noise(this.x * nScale + 100, this.y * nScale + 100, noiseZ + this.noiseOffset) - 0.5;
    
    this.vx += nx * turbStrength;
    this.vy += ny * turbStrength * 0.5;
    
    // Mouse wind disturbance
    let dx = this.x - mx;
    let dy = this.y - my;
    let dist = sqrt(dx * dx + dy * dy);
    if (dist < 150 && dist > 0) {
      let force = map(dist, 0, 150, 0.3, 0);
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force * 0.3;
    }
    
    // Damping
    this.vx *= 0.98;
    this.vy *= 0.98;
    
    // Move
    this.x += this.vx;
    this.y += this.vy;
    
    // Age
    this.life -= this.decay;
    
    // Grow as it rises
    this.size += 0.02;
  }
  
  display(g) {
    let age = 1 - this.life;
    
    // Color transitions: hot → mid → cool → cold based on age
    let col;
    if (age < 0.25) {
      let t = age / 0.25;
      col = lerpArr(COLORS.hot, COLORS.mid, t);
    } else if (age < 0.55) {
      let t = (age - 0.25) / 0.3;
      col = lerpArr(COLORS.mid, COLORS.cool, t);
    } else {
      let t = (age - 0.55) / 0.45;
      col = lerpArr(COLORS.cool, COLORS.cold, t);
    }
    
    let alpha = this.life * 0.6;
    // Fade in at birth
    if (age < 0.05) alpha *= age / 0.05;
    
    g.noStroke();
    g.fill(col[0], col[1], col[2], alpha);
    g.ellipse(this.x, this.y, this.size, this.size);
    
    // Inner glow for young particles
    if (age < 0.3) {
      let ga = alpha * 0.4 * (1 - age / 0.3);
      g.fill(255, 255, 255, ga);
      g.ellipse(this.x, this.y, this.size * 0.4, this.size * 0.4);
    }
  }
  
  isDead() {
    return this.life <= 0 || this.y < -50 || this.x < -50 || this.x > width + 50;
  }
}

function lerpArr(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t,
  ];
}

function mousePressed() {
  // Add new heat source
  sources.push({ x: mouseX, y: mouseY, strength: random(0.7, 1.2) });
  // Remove old extra sources after 5
  if (sources.length > 5) sources.splice(1, 1);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  let oldPg = pg;
  pg = createGraphics(width, height);
  pg.image(oldPg, 0, 0);
}
</script>
</body>
</html>
