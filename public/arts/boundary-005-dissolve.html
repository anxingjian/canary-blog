<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消融 / Dissolve</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// --- Colors ---
const WARM = ['#FFB7C5', '#FFDEAD', '#F4A460', '#FFD0B0', '#FFC4B0'];
const COOL = ['#87CEEB', '#A8D8B9', '#C8A2C8', '#9DC8E8', '#B8C8D8'];

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}
const warmRgb = WARM.map(hexToRgb);
const coolRgb = COOL.map(hexToRgb);

// --- Long press detection ---
let pressing = false;
let pressStart = 0;

canvas.addEventListener('mousedown', () => { pressing = true; pressStart = Date.now(); });
canvas.addEventListener('mouseup', () => { pressing = false; });
canvas.addEventListener('mouseleave', () => { pressing = false; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); pressing = true; pressStart = Date.now(); }, { passive: false });
canvas.addEventListener('touchend', () => { pressing = false; });

// --- Membrane (circular, with cracks) ---
const NODE_COUNT = 120;
const BASE_RADIUS = Math.min(window.innerWidth, window.innerHeight) * 0.3 * dpr;
const nodes = [];

for (let i = 0; i < NODE_COUNT; i++) {
  const angle = (i / NODE_COUNT) * Math.PI * 2;
  nodes.push({
    angle,
    r: BASE_RADIUS,
    integrity: 1.0, // 1 = solid, 0 = dissolved
    crackSeed: Math.random(),
    x: 0, y: 0
  });
}

// Dissolution state
let dissolveProgress = 0; // 0..1
let crackPoints = [];

// Seed initial crack points (3-5 spots)
const numCracks = 3 + Math.floor(Math.random() * 3);
for (let i = 0; i < numCracks; i++) {
  crackPoints.push({
    nodeIdx: Math.floor(Math.random() * NODE_COUNT),
    spread: 0,
    speed: 0.0003 + Math.random() * 0.0005
  });
}

// --- Particles ---
const COUNT = 300;
const particles = [];

class Particle {
  constructor(type) {
    this.type = type;
    const c = type === 'inner'
      ? warmRgb[Math.floor(Math.random() * warmRgb.length)]
      : coolRgb[Math.floor(Math.random() * coolRgb.length)];
    this.r = c.r; this.g = c.g; this.b = c.b;
    this.size = 1.5 + Math.random() * 2.5;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.006 + Math.random() * 0.018;

    const angle = Math.random() * Math.PI * 2;
    if (type === 'inner') {
      const dist = Math.random() * BASE_RADIUS * 0.85;
      this.x = cx + Math.cos(angle) * dist;
      this.y = cy + Math.sin(angle) * dist;
    } else {
      const dist = BASE_RADIUS * 1.2 + Math.random() * BASE_RADIUS * 0.7;
      this.x = cx + Math.cos(angle) * dist;
      this.y = cy + Math.sin(angle) * dist;
    }
    this.vx = 0;
    this.vy = 0;
    this.freed = false;
  }
}

for (let i = 0; i < COUNT / 2; i++) particles.push(new Particle('inner'));
for (let i = 0; i < COUNT / 2; i++) particles.push(new Particle('outer'));

let time = 0;

function draw() {
  ctx.fillStyle = 'rgba(255, 248, 240, 0.06)';
  ctx.fillRect(0, 0, W, H);
  time++;

  // --- Dissolve progression ---
  const pressBoost = pressing ? 0.003 : 0;
  const baseSpeed = 0.0002;
  dissolveProgress = Math.min(1, dissolveProgress + baseSpeed + pressBoost);

  // Spread cracks
  for (const crack of crackPoints) {
    crack.spread += crack.speed + (pressing ? crack.speed * 4 : 0);
    crack.spread = Math.min(crack.spread, 0.5);

    // Apply to nodes
    for (let i = 0; i < NODE_COUNT; i++) {
      let di = Math.abs(i - crack.nodeIdx);
      if (di > NODE_COUNT / 2) di = NODE_COUNT - di;
      const normalDi = di / NODE_COUNT;
      if (normalDi < crack.spread) {
        const dissolveAmount = (1 - normalDi / crack.spread) * dissolveProgress;
        nodes[i].integrity = Math.max(0, nodes[i].integrity - dissolveAmount * 0.01);
      }
    }
  }

  // Natural overall decay
  for (const n of nodes) {
    n.integrity -= dissolveProgress * 0.0003;
    n.integrity = Math.max(0, n.integrity);

    // Breathing + tremor
    const tremor = n.integrity < 0.5 ? (0.5 - n.integrity) * 8 : 0;
    n.r = BASE_RADIUS + Math.sin(time * 0.015 + n.angle * 3) * (2 + tremor);
    n.x = cx + Math.cos(n.angle) * n.r;
    n.y = cy + Math.sin(n.angle) * n.r;
  }

  // --- Draw membrane ---
  for (let i = 0; i < NODE_COUNT; i++) {
    const n = nodes[i];
    const next = nodes[(i + 1) % NODE_COUNT];
    if (n.integrity < 0.05 && next.integrity < 0.05) continue;

    const alpha = Math.min(n.integrity, next.integrity) * 0.35;
    if (alpha < 0.01) continue;

    ctx.beginPath();
    ctx.moveTo(n.x, n.y);
    ctx.lineTo(next.x, next.y);
    ctx.strokeStyle = `rgba(180, 160, 150, ${alpha})`;
    ctx.lineWidth = 1.5 + n.integrity;
    ctx.stroke();

    // Crack glow at edges of dissolution
    if (n.integrity > 0.05 && n.integrity < 0.6) {
      const glowA = (0.6 - n.integrity) * 0.08;
      const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 15);
      grd.addColorStop(0, `rgba(255, 220, 200, ${glowA})`);
      grd.addColorStop(1, 'rgba(255, 220, 200, 0)');
      ctx.fillStyle = grd;
      ctx.fillRect(n.x - 15, n.y - 15, 30, 30);
    }
  }

  // --- Update particles ---
  for (const p of particles) {
    p.wobble += p.wobbleSpeed;
    const wx = Math.sin(p.wobble) * 0.25;
    const wy = Math.cos(p.wobble * 0.8) * 0.25;

    const dx = p.x - cx, dy = p.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx);

    // Find local membrane integrity
    let nodeIdx = Math.round((((angle + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2)) * NODE_COUNT) % NODE_COUNT;
    const localIntegrity = nodes[nodeIdx].integrity;
    const memR = nodes[nodeIdx].r;

    if (localIntegrity > 0.3 && !p.freed) {
      // Membrane still holds — bounce
      if (p.type === 'inner' && dist > memR - 8) {
        p.vx -= dx / dist * 0.1;
        p.vy -= dy / dist * 0.1;
      }
      if (p.type === 'outer' && dist < memR + 8) {
        p.vx += dx / dist * 0.08;
        p.vy += dy / dist * 0.08;
      }
    } else {
      // Membrane broken here — particles drift through
      p.freed = true;
    }

    if (p.freed) {
      // Gentle attraction toward center of canvas (mixing)
      const toCenterX = cx - p.x;
      const toCenterY = cy - p.y;
      const toCenterD = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
      if (toCenterD > 1) {
        // Gentle orbital drift
        const tangentX = -toCenterY / toCenterD;
        const tangentY = toCenterX / toCenterD;
        p.vx += tangentX * 0.01 + toCenterX / toCenterD * 0.003;
        p.vy += tangentY * 0.01 + toCenterY / toCenterD * 0.003;
      }
    } else {
      // Pre-freed: gentle wander
      if (p.type === 'inner') {
        // Slight outward push
        if (dist > 1) {
          p.vx += dx / dist * 0.008;
          p.vy += dy / dist * 0.008;
        }
      } else {
        // Slight inward pull
        if (dist > 1) {
          p.vx -= dx / dist * 0.006;
          p.vy -= dy / dist * 0.006;
        }
      }
    }

    // Random motion
    p.vx += (Math.random() - 0.5) * 0.04 + wx * 0.04;
    p.vy += (Math.random() - 0.5) * 0.04 + wy * 0.04;

    p.vx *= 0.975;
    p.vy *= 0.975;

    p.x += p.vx;
    p.y += p.vy;

    // Keep in bounds
    if (p.x < 20) p.vx += 0.1;
    if (p.x > W - 20) p.vx -= 0.1;
    if (p.y < 20) p.vy += 0.1;
    if (p.y > H - 20) p.vy -= 0.1;

    // --- Draw ---
    const alpha = 0.4 + (p.freed ? 0.25 : 0);

    // Soft glow when crossing boundary area
    if (p.freed && Math.abs(dist - BASE_RADIUS) < 40) {
      const glowR = p.size * 5;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
      glow.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, 0.12)`);
      glow.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);
      ctx.fillStyle = glow;
      ctx.fillRect(p.x - glowR, p.y - glowR, glowR * 2, glowR * 2);
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
