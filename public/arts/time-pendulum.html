<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钟摆 / Pendulum</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let trails = [];
const TRAIL_COUNT = 7;
const MAX_POINTS = 600;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
  cx = W / 2;
  cy = H * 0.12;
  ctx.scale(1, 1);
}
resize();
window.addEventListener('resize', () => { resize(); trails = initTrails(); });

// Each pendulum has slightly different length & phase drift
function initTrails() {
  const arr = [];
  for (let i = 0; i < TRAIL_COUNT; i++) {
    const ratio = (i - (TRAIL_COUNT - 1) / 2) / TRAIL_COUNT;
    arr.push({
      length: H * 0.38 + ratio * H * 0.18,
      drift: 0.0003 * (i - 3),
      phase: i * 0.15,
      damping: 1 - i * 0.00002,
      points: [],
      hue: 35 + i * 8, // warm amber to golden
    });
  }
  return arr;
}
trails = initTrails();

// Mouse interaction: gentle gravity pull
let mx = 0, my = 0, mouseActive = false;
document.addEventListener('mousemove', e => {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mx = e.clientX * dpr;
  my = e.clientY * dpr;
  mouseActive = true;
});
document.addEventListener('mouseleave', () => { mouseActive = false; });

function draw() {
  // Fade background
  ctx.fillStyle = 'rgba(10, 10, 15, 0.03)';
  ctx.fillRect(0, 0, W, H);

  time += 0.008;

  // Draw pivot point
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(180, 160, 130, 0.6)';
  ctx.fill();

  for (let i = 0; i < TRAIL_COUNT; i++) {
    const t = trails[i];
    // Period depends on length: T ∝ √L
    const period = Math.sqrt(t.length / (H * 0.38)) * 2.8;
    const angle = Math.sin(time / period + t.phase + t.drift * time * time) * 
                  (0.8 - i * 0.03) * t.damping;
    
    // Mouse influence
    let extraAngle = 0;
    if (mouseActive) {
      const dx = mx - cx;
      extraAngle = dx / W * 0.15 * Math.exp(-Math.abs(my - cy - t.length) / (H * 0.3));
    }

    const totalAngle = angle + extraAngle;
    const bx = cx + Math.sin(totalAngle) * t.length;
    const by = cy + Math.cos(totalAngle) * t.length;

    // Store trail
    t.points.push({ x: bx, y: by, age: 0 });
    if (t.points.length > MAX_POINTS) t.points.shift();

    // Draw trail
    if (t.points.length > 2) {
      ctx.beginPath();
      ctx.moveTo(t.points[0].x, t.points[0].y);
      for (let j = 1; j < t.points.length; j++) {
        const p = t.points[j];
        const progress = j / t.points.length;
        ctx.lineTo(p.x, p.y);
      }
      const alpha = 0.12 + i * 0.02;
      ctx.strokeStyle = `hsla(${t.hue}, 50%, ${55 + i * 3}%, ${alpha})`;
      ctx.lineWidth = 1.2 - i * 0.08;
      ctx.stroke();
    }

    // Draw pendulum bob (current position)
    const bobAlpha = 0.5 + 0.3 * Math.cos(time * 0.5);
    ctx.beginPath();
    ctx.arc(bx, by, 4 - i * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${t.hue}, 45%, 70%, ${bobAlpha})`;
    ctx.fill();

    // Draw string (faint)
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = `rgba(180, 160, 130, ${0.06 - i * 0.005})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Subtle time indicator: a slow pulse at the pivot
  const pulse = Math.sin(time * 0.3) * 0.5 + 0.5;
  ctx.beginPath();
  ctx.arc(cx, cy, 8 + pulse * 4, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(180, 160, 130, ${0.08 * pulse})`;
  ctx.lineWidth = 1;
  ctx.stroke();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
