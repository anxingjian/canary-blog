<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>清明 / Qingming</title>
<style>body{margin:0;overflow:hidden;background:#e8e4df}canvas{display:block;width:100vw;height:100vh}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Qingming palette — rain-washed spring
const palette=[
  [120,138,122,0.06], // 苔绿
  [145,156,140,0.05], // 青灰
  [168,152,132,0.04], // 土黄
  [130,148,158,0.05], // 雨蓝
  [156,140,128,0.04], // 暖灰
  [108,126,108,0.06], // 深苔
  [178,168,155,0.03], // 宣纸
];

class Drop{
  constructor(){this.reset(true);}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:-10-Math.random()*100;
    this.vy=1.5+Math.random()*2.5;
    this.vx=(Math.random()-0.5)*0.3;
    this.len=12+Math.random()*20;
    this.alpha=0.08+Math.random()*0.12;
    this.landed=false;
    this.life=1;
  }
}

class Bloom{
  constructor(x,y){
    this.x=x;this.y=y;
    this.r=0;this.maxR=15+Math.random()*45;
    this.speed=0.3+Math.random()*0.5;
    const c=palette[Math.floor(Math.random()*palette.length)];
    this.color=c;
    this.alpha=c[3]*(0.6+Math.random()*0.4);
    this.done=false;
    // slight drift
    this.dx=(Math.random()-0.5)*0.2;
    this.dy=(Math.random()-0.5)*0.1;
  }
  update(){
    this.r+=this.speed*(1-this.r/this.maxR);
    this.x+=this.dx;this.y+=this.dy;
    if(this.r>=this.maxR*0.98)this.done=true;
  }
  draw(){
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    const [r,gc,b]=this.color;
    g.addColorStop(0,`rgba(${r},${gc},${b},${this.alpha})`);
    g.addColorStop(0.5,`rgba(${r},${gc},${b},${this.alpha*0.5})`);
    g.addColorStop(1,`rgba(${r},${gc},${b},0)`);
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
  }
}

const drops=[];
const blooms=[];
const NUM_DROPS=80;
for(let i=0;i<NUM_DROPS;i++)drops.push(new Drop());

// Persistent layer — blooms accumulate on an offscreen canvas
const persist=document.createElement('canvas');
persist.width=W;persist.height=H;
const pctx=persist.getContext('2d');
pctx.fillStyle='#e8e4df';pctx.fillRect(0,0,W,H);

window.addEventListener('resize',()=>{
  const old=persist.toDataURL();
  persist.width=W;persist.height=H;
  const img=new Image();img.onload=()=>{pctx.drawImage(img,0,0);};img.src=old;
});

let frame=0;
const startTime=performance.now();

function animate(){
  const t=(performance.now()-startTime)/1000;
  frame++;

  // Every ~120 frames, very slightly fade the persistent layer toward paper color
  // This creates a slow memory-loss effect
  if(frame%180===0){
    pctx.fillStyle='rgba(232,228,223,0.008)';
    pctx.fillRect(0,0,W,H);
  }

  // Update drops
  const windPhase=Math.sin(t*0.15)*0.5;
  for(const d of drops){
    if(!d.landed){
      d.y+=d.vy;
      d.x+=d.vx+windPhase;
      if(d.y>H+10){
        // land — create bloom
        blooms.push(new Bloom(d.x,H*0.3+Math.random()*H*0.65));
        d.reset(false);
      }
    }
  }

  // Update and bake blooms
  for(let i=blooms.length-1;i>=0;i--){
    blooms[i].update();
    blooms[i].draw.call(blooms[i]); // draw to main first for preview
    if(blooms[i].done){
      // bake to persistent
      blooms[i].draw=blooms[i].draw; // just remove
      const b=blooms[i];
      const g=pctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      const [r,gc,bl]=b.color;
      g.addColorStop(0,`rgba(${r},${gc},${bl},${b.alpha})`);
      g.addColorStop(0.5,`rgba(${r},${gc},${bl},${b.alpha*0.5})`);
      g.addColorStop(1,`rgba(${r},${gc},${bl},0)`);
      pctx.fillStyle=g;
      pctx.beginPath();pctx.arc(b.x,b.y,b.r,0,Math.PI*2);pctx.fill();
      blooms.splice(i,1);
    }
  }

  // Draw
  ctx.clearRect(0,0,W,H);
  // Paper base
  ctx.fillStyle='#e8e4df';ctx.fillRect(0,0,W,H);
  // Persistent blooms
  ctx.drawImage(persist,0,0);
  // Active blooms
  for(const b of blooms)b.draw();

  // Rain streaks
  ctx.strokeStyle='rgba(160,168,172,0.15)';
  ctx.lineWidth=0.5;
  for(const d of drops){
    if(!d.landed){
      ctx.beginPath();
      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x-d.vx*2-windPhase*2,d.y-d.len);
      ctx.stroke();
    }
  }

  // Subtle paper grain noise (sparse, not every frame)
  if(frame%3===0){
    for(let i=0;i<15;i++){
      const gx=Math.random()*W,gy=Math.random()*H;
      const gs=Math.random()*2;
      ctx.fillStyle=`rgba(${140+Math.random()*40},${135+Math.random()*40},${125+Math.random()*40},0.02)`;
      ctx.fillRect(gx,gy,gs,gs);
    }
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script></body></html>
