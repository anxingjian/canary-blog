<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消散 / Dissipation</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #060609; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false });
const W = 800, H = 800;

const vsrc = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const fsrc = `
precision highp float;
varying vec2 v_uv;
uniform float u_time;
uniform vec2 u_res;
uniform sampler2D u_prev;

#define PI 3.14159265
#define CX 400.0
#define CY 400.0

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float hash1(float n) { return fract(sin(n) * 43758.5453123); }

// HSL to RGB
vec3 hsl(float h, float s, float l) {
  vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
}

void main() {
  vec2 px = v_uv * u_res;
  float t = u_time;
  vec2 center = vec2(CX, CY);

  // Previous frame with fade
  vec3 prev = texture2D(u_prev, v_uv).rgb;
  vec3 bg = vec3(6.0/255.0, 6.0/255.0, 9.0/255.0);
  vec3 col = mix(prev, bg, 0.06);

  // Dust particles (ambient)
  for (int i = 0; i < 80; i++) {
    float fi = float(i);
    float dx = hash1(fi * 1.1) * 800.0 + hash1(fi * 0.7) * 0.1 * t * 60.0;
    dx = mod(dx, 820.0) - 10.0;
    float dy = hash1(fi * 2.3) * 800.0 + sin(t * 0.3 + hash1(fi * 3.1) * PI * 2.0) * 3.0;
    float d = length(px - vec2(dx, dy));
    float sz = 0.3 + hash1(fi * 4.5) * 0.8;
    float a = (0.02 + hash1(fi * 5.7) * 0.04) * smoothstep(sz + 0.5, sz - 0.5, d);
    col += vec3(0.55, 0.55, 0.63) * a;
  }

  // Ghost rings — memory of original wave structure, dissolving
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    float dissolution = min(1.0, t * 0.008 + fi * 0.12);
    float opacity = max(0.0, 0.12 - dissolution * 0.12);
    if (opacity < 0.003) continue;

    float r = 60.0 + fi * 70.0 + t * 0.5 + sin(t * 0.3 + fi * 0.8) * 8.0;
    float d = length(px - center);
    // Ring with noise and gaps
    float angle = atan(px.y - CY, px.x - CX);
    float noise = sin(angle * 5.0 + t * 0.7 + fi * 0.8) * (15.0 + dissolution * 40.0);
    float ringD = abs(d - r - noise);
    float ringAlpha = smoothstep(1.5, 0.0, ringD) * opacity;
    // Gaps
    float gap = step(0.3 - dissolution * 0.8, sin(angle * 3.0 + t * 0.4 + fi));
    ringAlpha *= gap;

    vec3 ringCol = mod(fi, 2.0) < 0.5 ? hsl(215.0/360.0, 0.25, 0.45) : hsl(38.0/360.0, 0.25, 0.45);
    col += ringCol * ringAlpha;
  }

  // Center glow (fading origin)
  float fade = max(0.0, 1.0 - t * 0.005);
  float pulse = 1.0 + 0.2 * sin(t * 2.0);
  float cd = length(px - center);
  float coreGlow = smoothstep(30.0 * pulse * fade, 0.0, cd);
  col += mix(hsl(220.0/360.0, 0.4, 0.6), hsl(35.0/360.0, 0.3, 0.5), smoothstep(0.0, 30.0 * pulse * fade * 0.4, cd)) * coreGlow * 0.15 * fade;
  // Tiny core
  col += hsl(220.0/360.0, 0.3, 0.65) * smoothstep(2.0, 0.5, cd) * 0.3 * fade;

  // Fragments — 6 rings of particles spiraling outward
  for (int ring = 0; ring < 6; ring++) {
    float fr = float(ring);
    int count = 25 + ring * 12;
    for (int j = 0; j < 97; j++) { // max iterations
      if (j >= count) break;
      float fj = float(j);
      float seed = hash(vec2(fr * 100.0 + fj, fr * 7.0 + fj * 3.0));
      float seed2 = hash(vec2(fj * 2.0 + fr, fr * 13.0));

      // Fragment position — spiral outward
      float baseAngle = seed * PI * 2.0;
      float baseR = 30.0 + fr * 55.0;
      float radSpeed = 0.08 + seed * 0.15 + fr * 0.04;
      float tanSpeed = (seed2 - 0.5) * 0.3;
      float freq = 0.5 + seed * 1.5;
      float phase = seed2 * PI * 2.0;
      float life = fract(seed * 3.0 + t * (0.001 + seed2 * 0.003 + fr * 0.0005));
      life = 1.0 - life;

      // Compute position at current life
      float elapsed = (1.0 - life) * 300.0; // frames equivalent
      float ang = baseAngle + tanSpeed * sin(t * freq + phase) * elapsed * 0.01;
      float dist = baseR + radSpeed * elapsed * (1.0 + elapsed / 400.0);
      float wobX = cos(ang + PI / 2.0) * tanSpeed * sin(t * freq + phase) * 3.0;
      float wobY = sin(ang + PI / 2.0) * tanSpeed * sin(t * freq + phase) * 3.0;
      // Wave memory pull
      float wavePull = sin(dist * 0.02 - t * 1.5) * 0.15 * max(0.0, 1.0 - dist / 350.0);

      vec2 fp = center + vec2(cos(ang), sin(ang)) * dist + vec2(wobX, wobY) + vec2(cos(ang), sin(ang)) * wavePull * 10.0;

      float fd = length(px - fp);
      float satFade = max(0.0, 1.0 - length(fp - center) / 400.0);
      float sat = (15.0 + satFade * 45.0) / 100.0;
      float light = (35.0 + satFade * 30.0) / 100.0;
      float hue = seed < 0.5 ? 215.0 : 38.0;
      hue += (1.0 - satFade) * (hue > 100.0 ? -20.0 : 20.0);
      float alpha = life * max(0.05, satFade * 0.7);
      float flicker = 0.7 + 0.3 * sin(t * 4.0 + phase);
      float sz = (1.2 + seed * 2.5 - fr * 0.2) * flicker * (0.3 + life * 0.7);

      float pointAlpha = smoothstep(sz + 0.5, max(0.0, sz - 0.5), fd) * alpha;
      vec3 fragCol = hsl(hue / 360.0, sat, light);
      col += fragCol * pointAlpha;

      // Trail
      float trailAlpha = smoothstep(sz * 2.0, 0.0, fd) * alpha * 0.08;
      col += fragCol * 0.7 * trailAlpha;
    }
  }

  // Vignette
  float vd = length(px - center);
  float vig = smoothstep(150.0, 500.0, vd) * 0.7;
  col = mix(col, bg, vig);

  gl_FragColor = vec4(col, 1.0);
}`;

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes = gl.getUniformLocation(prog, 'u_res');
const uPrev = gl.getUniformLocation(prog, 'u_prev');
gl.uniform2f(uRes, W, H);

function createFBO() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb };
}
const fbo0 = createFBO(), fbo1 = createFBO();
let ping = 0, time = 0;

function frame() {
  time += 0.016;
  const src = ping === 0 ? fbo0 : fbo1;
  const dst = ping === 0 ? fbo1 : fbo0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, W, H);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(uPrev, 0);
  gl.uniform1f(uTime, time);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ping = 1 - ping;
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
