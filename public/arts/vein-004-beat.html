<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搏 / Beat — Vein 004</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1A0F0A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Palette: espresso, raw sienna, wheat, mahogany, honey
const ESPRESSO = '#1A0F0A';
const SIENNA = '#C4956A';
const WHEAT = '#F5DEB3';
const MAHOGANY = '#6B3A2A';
const HONEY = '#E8C07A';

// Vessel network — pre-built tree
class Vessel {
  constructor(x, y, angle, radius, depth) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.radius = radius;
    this.depth = depth;
    this.length = 40 + Math.random() * 60 * (1 - depth * 0.1);
    this.endX = x + Math.cos(angle) * this.length;
    this.endY = y + Math.sin(angle) * this.length;
    this.children = [];
    this.pulsePhase = 0;
    this.pulseAmp = 0;
  }
}

let vessels = [];
let pulses = [];
let heartPhase = 0;
let lastBeat = 0;
const BPM = 72;
const beatInterval = 60000 / BPM;

function buildTree(x, y, angle, radius, depth, maxDepth) {
  if (depth > maxDepth || radius < 0.5) return null;
  const v = new Vessel(x, y, angle, radius, depth);
  vessels.push(v);
  
  if (depth < maxDepth) {
    const branches = depth < 3 ? 2 : (Math.random() < 0.3 ? 2 : 1);
    for (let i = 0; i < branches; i++) {
      const spread = 0.3 + Math.random() * 0.4;
      const childAngle = angle + (i === 0 ? -spread : spread);
      const childRadius = radius * (0.65 + Math.random() * 0.15);
      const child = buildTree(v.endX, v.endY, childAngle, childRadius, depth + 1, maxDepth);
      if (child) v.children.push(child);
    }
  }
  return v;
}

function initTree() {
  vessels = [];
  // Main trunk from bottom center
  const startX = W * 0.5;
  const startY = H * 0.95;
  buildTree(startX, startY, -Math.PI / 2 + (Math.random() - 0.5) * 0.2, 8, 0, 9);
  // Second trunk slightly offset
  buildTree(W * 0.35, H * 0.9, -Math.PI / 2 + 0.3, 5, 0, 7);
  buildTree(W * 0.65, H * 0.9, -Math.PI / 2 - 0.2, 5, 0, 7);
}
initTree();

// Pulse wave
class Pulse {
  constructor(vessel, time) {
    this.vessel = vessel;
    this.progress = 0;
    this.speed = 0.015 + Math.random() * 0.005;
    this.alive = true;
    this.spawned = false;
  }
  
  update() {
    this.progress += this.speed;
    if (this.progress >= 1) {
      if (!this.spawned) {
        this.spawned = true;
        for (const child of this.vessel.children) {
          pulses.push(new Pulse(child, 0));
        }
      }
      if (this.progress > 1.5) this.alive = false;
    }
  }
}

// Mouse interaction
let mouseX = W / 2, mouseY = H / 2;
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('click', () => {
  triggerBeat();
});

function triggerBeat() {
  // Find root vessels (depth 0) and pulse them
  for (const v of vessels) {
    if (v.depth === 0) {
      pulses.push(new Pulse(v, 0));
    }
  }
}

let time = 0;
let lastTime = performance.now();

function draw(now) {
  const dt = now - lastTime;
  lastTime = now;
  time += dt;
  
  // Auto heartbeat
  heartPhase += dt;
  if (heartPhase - lastBeat > beatInterval) {
    lastBeat = heartPhase;
    triggerBeat();
  }
  
  // Fade trail
  ctx.fillStyle = 'rgba(26, 15, 10, 0.08)';
  ctx.fillRect(0, 0, W, H);
  
  // Update pulses
  for (const p of pulses) p.update();
  pulses = pulses.filter(p => p.alive);
  
  // Calculate pulse amplitude per vessel
  for (const v of vessels) v.pulseAmp = 0;
  for (const p of pulses) {
    if (p.progress >= 0 && p.progress <= 1) {
      p.vessel.pulseAmp = Math.max(p.vessel.pulseAmp, Math.sin(p.progress * Math.PI));
    }
  }
  
  // Draw vessels
  for (const v of vessels) {
    const baseAlpha = 0.3 + (1 - v.depth / 10) * 0.4;
    const pulseBoost = v.pulseAmp;
    const alpha = Math.min(1, baseAlpha + pulseBoost * 0.6);
    
    // Base vessel
    const baseWidth = v.radius * 2 * (1 + pulseBoost * 0.4);
    
    ctx.beginPath();
    ctx.moveTo(v.x, v.y);
    ctx.lineTo(v.endX, v.endY);
    ctx.strokeStyle = pulseBoost > 0.1 
      ? lerpColor(MAHOGANY, HONEY, pulseBoost)
      : lerpColor(ESPRESSO, MAHOGANY, baseAlpha);
    ctx.lineWidth = baseWidth;
    ctx.lineCap = 'round';
    ctx.globalAlpha = alpha;
    ctx.stroke();
    
    // Glow when pulsing
    if (pulseBoost > 0.2) {
      ctx.beginPath();
      ctx.moveTo(v.x, v.y);
      ctx.lineTo(v.endX, v.endY);
      ctx.strokeStyle = WHEAT;
      ctx.lineWidth = baseWidth * 0.4;
      ctx.globalAlpha = pulseBoost * 0.5;
      ctx.stroke();
    }
  }
  
  // Draw pulse particles
  ctx.globalAlpha = 1;
  for (const p of pulses) {
    if (p.progress < 0 || p.progress > 1) continue;
    const v = p.vessel;
    const px = v.x + (v.endX - v.x) * p.progress;
    const py = v.y + (v.endY - v.y) * p.progress;
    const size = v.radius * (1 + Math.sin(p.progress * Math.PI) * 0.8);
    
    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fillStyle = HONEY;
    ctx.globalAlpha = 0.8 * Math.sin(p.progress * Math.PI);
    ctx.fill();
    
    // Outer glow
    const grad = ctx.createRadialGradient(px, py, 0, px, py, size * 3);
    grad.addColorStop(0, WHEAT + '80');
    grad.addColorStop(1, WHEAT + '00');
    ctx.beginPath();
    ctx.arc(px, py, size * 3, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.4 * Math.sin(p.progress * Math.PI);
    ctx.fill();
  }
  
  // Heartbeat indicator bottom-left
  ctx.globalAlpha = 1;
  const beatProgress = (heartPhase - lastBeat) / beatInterval;
  const beatSize = beatProgress < 0.1 ? 12 + (1 - beatProgress / 0.1) * 8 : 12;
  const beatAlpha = beatProgress < 0.2 ? 1 : 0.4;
  ctx.beginPath();
  ctx.arc(40, H - 40, beatSize, 0, Math.PI * 2);
  ctx.fillStyle = SIENNA;
  ctx.globalAlpha = beatAlpha;
  ctx.fill();
  
  // Mouse proximity warmth
  ctx.globalAlpha = 0.15;
  const mouseGrad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 150);
  mouseGrad.addColorStop(0, HONEY);
  mouseGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = mouseGrad;
  ctx.fillRect(mouseX - 150, mouseY - 150, 300, 300);
  
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3), 16), g1 = parseInt(c1.slice(3,5), 16), b1 = parseInt(c1.slice(5,7), 16);
  const r2 = parseInt(c2.slice(1,3), 16), g2 = parseInt(c2.slice(3,5), 16), b2 = parseInt(c2.slice(5,7), 16);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${b})`;
}

requestAnimationFrame(draw);
</script>
</body>
</html>
