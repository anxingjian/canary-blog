<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张力 / Tension</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// --- Colors ---
const WARM = ['#FFB7C5', '#FFDEAD', '#F4A460', '#FFD0B0', '#FFC4B0'];
const COOL = ['#87CEEB', '#A8D8B9', '#C8A2C8', '#9DC8E8', '#B8C8D8'];

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}
const warmRgb = WARM.map(hexToRgb);
const coolRgb = COOL.map(hexToRgb);

// --- Membrane (spring nodes in a circle) ---
const NODE_COUNT = 80;
const BASE_RADIUS = Math.min(window.innerWidth, window.innerHeight) * 0.28 * dpr;
const nodes = [];

for (let i = 0; i < NODE_COUNT; i++) {
  const angle = (i / NODE_COUNT) * Math.PI * 2;
  nodes.push({
    angle,
    r: BASE_RADIUS,
    targetR: BASE_RADIUS,
    vr: 0,
    x: 0, y: 0
  });
}

// --- Mouse / drag ---
let dragging = false;
let dragIdx = -1;
let mx = 0, my = 0;

function getMouseIdx(x, y) {
  let best = -1, bestD = 40 * dpr;
  for (let i = 0; i < nodes.length; i++) {
    const dx = nodes[i].x - x, dy = nodes[i].y - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

canvas.addEventListener('mousedown', e => {
  mx = e.clientX * dpr; my = e.clientY * dpr;
  dragIdx = getMouseIdx(mx, my);
  if (dragIdx >= 0) dragging = true;
});
canvas.addEventListener('mousemove', e => {
  mx = e.clientX * dpr; my = e.clientY * dpr;
});
canvas.addEventListener('mouseup', () => { dragging = false; dragIdx = -1; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  mx = e.touches[0].clientX * dpr; my = e.touches[0].clientY * dpr;
  dragIdx = getMouseIdx(mx, my);
  if (dragIdx >= 0) dragging = true;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mx = e.touches[0].clientX * dpr; my = e.touches[0].clientY * dpr;
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; dragIdx = -1; });

// --- Particles ---
const INNER_COUNT = 150;
const OUTER_COUNT = 150;
const particles = [];

class Particle {
  constructor(type) {
    this.type = type; // 'inner' or 'outer'
    const c = type === 'inner'
      ? warmRgb[Math.floor(Math.random() * warmRgb.length)]
      : coolRgb[Math.floor(Math.random() * coolRgb.length)];
    this.r = c.r; this.g = c.g; this.b = c.b;
    this.size = 1.5 + Math.random() * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.008 + Math.random() * 0.02;
    this.spawn();
  }

  spawn() {
    const angle = Math.random() * Math.PI * 2;
    if (this.type === 'inner') {
      const dist = Math.random() * BASE_RADIUS * 0.8;
      this.x = cx + Math.cos(angle) * dist;
      this.y = cy + Math.sin(angle) * dist;
    } else {
      const dist = BASE_RADIUS * 1.3 + Math.random() * BASE_RADIUS * 0.8;
      this.x = cx + Math.cos(angle) * dist;
      this.y = cy + Math.sin(angle) * dist;
    }
    this.vx = 0;
    this.vy = 0;
  }
}

for (let i = 0; i < INNER_COUNT; i++) particles.push(new Particle('inner'));
for (let i = 0; i < OUTER_COUNT; i++) particles.push(new Particle('outer'));

// Point-in-membrane test
function isInside(px, py) {
  let inside = false;
  for (let i = 0, j = nodes.length - 1; i < nodes.length; j = i++) {
    const xi = nodes[i].x, yi = nodes[i].y;
    const xj = nodes[j].x, yj = nodes[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

let time = 0;

function draw() {
  ctx.fillStyle = 'rgba(255, 248, 240, 0.07)';
  ctx.fillRect(0, 0, W, H);
  time++;

  // --- Update membrane nodes ---
  // Calculate pressure from particles
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    let force = 0;

    // Inner particles push out
    for (const p of particles) {
      if (p.type !== 'inner') continue;
      const dx = p.x - cx, dy = p.y - cy;
      const pAngle = Math.atan2(dy, dx);
      let angleDiff = pAngle - n.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      if (Math.abs(angleDiff) < 0.3) {
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > n.r - 40) {
          force += 0.15 / (1 + Math.abs(angleDiff) * 5);
        }
      }
    }

    // Outer particles push in
    for (const p of particles) {
      if (p.type !== 'outer') continue;
      const dx = p.x - cx, dy = p.y - cy;
      const pAngle = Math.atan2(dy, dx);
      let angleDiff = pAngle - n.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      if (Math.abs(angleDiff) < 0.3) {
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < n.r + 40) {
          force -= 0.12 / (1 + Math.abs(angleDiff) * 5);
        }
      }
    }

    n.targetR = BASE_RADIUS + force * 15;

    // Drag deformation
    if (dragging && dragIdx >= 0) {
      let di = Math.abs(i - dragIdx);
      if (di > NODE_COUNT / 2) di = NODE_COUNT - di;
      if (di < 8) {
        const influence = 1 - di / 8;
        const dx = mx - cx, dy = my - cy;
        const dragR = Math.sqrt(dx * dx + dy * dy);
        n.targetR = BASE_RADIUS + (dragR - BASE_RADIUS) * influence * 0.6;
      }
    }

    // Spring physics
    const springK = 0.04;
    const damping = 0.92;
    n.vr += (n.targetR - n.r) * springK;
    // Neighbor coupling (smooth shape)
    const prev = nodes[(i - 1 + NODE_COUNT) % NODE_COUNT];
    const next = nodes[(i + 1) % NODE_COUNT];
    n.vr += (prev.r + next.r - 2 * n.r) * 0.02;
    // Restore to base
    n.vr += (BASE_RADIUS - n.r) * 0.005;
    n.vr *= damping;
    n.r += n.vr;

    // Breathing
    n.r += Math.sin(time * 0.012 + n.angle * 2) * 1.5;

    n.x = cx + Math.cos(n.angle) * n.r;
    n.y = cy + Math.sin(n.angle) * n.r;
  }

  // --- Draw membrane ---
  ctx.beginPath();
  // Smooth curve through nodes
  ctx.moveTo(nodes[0].x, nodes[0].y);
  for (let i = 0; i < NODE_COUNT; i++) {
    const curr = nodes[i];
    const next = nodes[(i + 1) % NODE_COUNT];
    const cpx = (curr.x + next.x) / 2;
    const cpy = (curr.y + next.y) / 2;
    ctx.quadraticCurveTo(curr.x, curr.y, cpx, cpy);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(180, 160, 150, 0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Membrane glow
  for (let i = 0; i < NODE_COUNT; i++) {
    const n = nodes[i];
    const stress = Math.abs(n.r - BASE_RADIUS) / 30;
    const glowA = 0.02 + stress * 0.06;
    const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 20);
    grd.addColorStop(0, `rgba(200, 180, 170, ${glowA})`);
    grd.addColorStop(1, 'rgba(200, 180, 170, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(n.x - 20, n.y - 20, 40, 40);
  }

  // --- Update particles ---
  for (const p of particles) {
    p.wobble += p.wobbleSpeed;
    const wx = Math.sin(p.wobble) * 0.3;
    const wy = Math.cos(p.wobble * 0.7) * 0.3;

    const dx = p.x - cx, dy = p.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx);

    // Find local membrane radius
    let nodeIdx = Math.round((((angle + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2)) * NODE_COUNT) % NODE_COUNT;
    const memR = nodes[nodeIdx].r;

    if (p.type === 'inner') {
      // Push outward toward membrane
      if (dist < memR - 10) {
        p.vx += dx / dist * 0.02;
        p.vy += dy / dist * 0.02;
      }
      // Bounce off membrane
      if (dist > memR - 5) {
        p.vx -= dx / dist * 0.15;
        p.vy -= dy / dist * 0.15;
      }
    } else {
      // Push inward toward membrane
      if (dist > memR + 10) {
        p.vx -= dx / dist * 0.015;
        p.vy -= dy / dist * 0.015;
      }
      // Bounce off membrane from outside
      if (dist < memR + 5) {
        p.vx += dx / dist * 0.12;
        p.vy += dy / dist * 0.12;
      }
      // Keep from drifting too far
      if (dist > BASE_RADIUS * 2.2) {
        p.vx -= dx / dist * 0.05;
        p.vy -= dy / dist * 0.05;
      }
    }

    // Random motion
    p.vx += (Math.random() - 0.5) * 0.06 + wx * 0.05;
    p.vy += (Math.random() - 0.5) * 0.06 + wy * 0.05;

    // Damping
    p.vx *= 0.97;
    p.vy *= 0.97;

    p.x += p.vx;
    p.y += p.vy;

    // --- Draw particle ---
    const nearMem = Math.abs(dist - memR);
    const alpha = 0.45 + (nearMem < 30 ? (1 - nearMem / 30) * 0.35 : 0);

    // Glow when near membrane
    if (nearMem < 25) {
      const glowR = p.size * 6;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
      glow.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, 0.1)`);
      glow.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);
      ctx.fillStyle = glow;
      ctx.fillRect(p.x - glowR, p.y - glowR, glowR * 2, glowR * 2);
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
