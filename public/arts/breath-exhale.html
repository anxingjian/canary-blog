<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼 / Exhale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF8F0; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let mouseX = -1, mouseY = -1;

const palette = [
  [255, 183, 197],  // 樱粉
  [168, 216, 185],  // 嫩绿
  [135, 206, 235],  // 天蓝
  [200, 162, 200],  // 薰衣草
  [255, 222, 173],  // 杏黄
];

// Exhale: threads of breath drifting outward then dissolving
// Unlike Inhale's tight pulsing, Exhale is about dispersal and release

class BreathThread {
  constructor(i, total) {
    this.i = i;
    this.baseAngle = (i / total) * Math.PI * 2;
    this.color = palette[i % palette.length];
    this.segments = [];
    this.speed = 0.3 + Math.random() * 0.4;
    this.wobble = Math.random() * 0.5 + 0.3;
    this.wobbleFreq = Math.random() * 0.8 + 0.4;
    this.phaseOffset = Math.random() * Math.PI * 2;
    this.thickness = Math.random() * 2 + 1.5;
    this.maxLen = Math.floor(Math.random() * 30 + 40);
    this.life = 0;
    this.lifeSpeed = 0.003 + Math.random() * 0.004;
    this.born = time;
    this.drift = (Math.random() - 0.5) * 0.3;
  }

  reset() {
    this.life = 0;
    this.born = time;
    this.segments = [];
    this.drift = (Math.random() - 0.5) * 0.3;
  }

  update(t) {
    this.life += this.lifeSpeed;
    if (this.life > 1) this.reset();

    // exhale curve: fast start, slow end (ease-out)
    const progress = 1 - Math.pow(1 - this.life, 3);
    const maxRadius = Math.min(W, H) * 0.42;
    const r = 20 + progress * maxRadius;

    const angle = this.baseAngle + this.drift * this.life +
      Math.sin(t * this.wobbleFreq + this.phaseOffset) * this.wobble * 0.1;

    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;

    this.segments.push({ x, y, age: 0 });
    if (this.segments.length > this.maxLen) this.segments.shift();

    for (const s of this.segments) s.age += 0.02;
  }

  draw(ctx) {
    if (this.segments.length < 2) return;
    const [cr, cg, cb] = this.color;

    for (let i = 1; i < this.segments.length; i++) {
      const s = this.segments[i];
      const prev = this.segments[i - 1];
      const fade = 1 - (i / this.segments.length);
      const lifeFade = this.life > 0.7 ? 1 - ((this.life - 0.7) / 0.3) : 1;
      const alpha = fade * lifeFade * 0.4;

      if (alpha < 0.01) continue;

      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(s.x, s.y);
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},${alpha})`;
      ctx.lineWidth = this.thickness * fade * lifeFade;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // tip glow
    const tip = this.segments[this.segments.length - 1];
    const lifeFade = this.life > 0.7 ? 1 - ((this.life - 0.7) / 0.3) : 1;
    const glowR = 8 + (1 - lifeFade) * 12;
    const grad = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, glowR);
    grad.addColorStop(0, `rgba(${cr},${cg},${cb},${0.3 * lifeFade})`);
    grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// Settling particles — drift downward gently like exhaled mist
class MistParticle {
  constructor() { this.reset(true); }

  reset(init) {
    this.x = cx + (Math.random() - 0.5) * Math.min(W, H) * 0.6;
    this.y = init ? cy + (Math.random() - 0.5) * H * 0.4 : cy - Math.random() * 30;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = Math.random() * 0.3 + 0.1;
    this.size = Math.random() * 3 + 1;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.life = 0;
    this.maxLife = Math.random() * 300 + 200;
    this.wobblePhase = Math.random() * Math.PI * 2;
  }

  update(t) {
    this.life++;
    if (this.life > this.maxLife) this.reset(false);
    this.x += this.vx + Math.sin(t * 0.5 + this.wobblePhase) * 0.15;
    this.y += this.vy;

    // mouse breath: gently push particles away
    if (mouseX > 0) {
      const dx = this.x - mouseX;
      const dy = this.y - mouseY;
      const d = Math.hypot(dx, dy);
      if (d < 120 && d > 0) {
        const force = (1 - d / 120) * 0.8;
        this.x += (dx / d) * force;
        this.y += (dy / d) * force;
      }
    }
  }

  draw(ctx) {
    const [r, g, b] = this.color;
    const lifePct = this.life / this.maxLife;
    // fade in and out
    let alpha = lifePct < 0.1 ? lifePct / 0.1 : lifePct > 0.7 ? (1 - lifePct) / 0.3 : 1;
    alpha *= 0.25;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
  }
}

const threadCount = 24;
const mistCount = 80;
let threads = [];
let mist = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  threads = [];
  mist = [];
  for (let i = 0; i < threadCount; i++) {
    const t = new BreathThread(i, threadCount);
    t.life = Math.random(); // stagger
    threads.push(t);
  }
  for (let i = 0; i < mistCount; i++) mist.push(new MistParticle());
}

function drawCenter(t) {
  // pulsing core — slower, calmer than Inhale. Contracting.
  const pulse = Math.sin(t * 0.8) * 0.3 + 0.7; // stays mostly contracted
  const r = 15 + pulse * 15;

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 20);
  grad.addColorStop(0, `rgba(255, 255, 255, ${0.4 + pulse * 0.15})`);
  grad.addColorStop(0.4, `rgba(255, 230, 220, ${0.15 + pulse * 0.08})`);
  grad.addColorStop(1, 'rgba(255, 248, 240, 0)');
  ctx.beginPath();
  ctx.arc(cx, cy, r + 20, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // subtle contracting rings
  for (let i = 0; i < 3; i++) {
    const ringR = r + 30 + i * 20 - pulse * 10;
    const ringAlpha = 0.03 + (1 - pulse) * 0.04;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200, 162, 200, ${ringAlpha})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

function draw() {
  ctx.fillStyle = 'rgba(255, 248, 240, 0.08)';
  ctx.fillRect(0, 0, W, H);

  time += 0.016;

  drawCenter(time);

  for (const m of mist) {
    m.update(time);
    m.draw(ctx);
  }

  for (const t of threads) {
    t.update(time);
    t.draw(ctx);
  }

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; });

resize();
draw();
</script>
</body>
</html>
