<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吸 / Inhale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF8F0; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let mouseX = -1, mouseY = -1;
let breathPhase = 0; // 0~1 inhale cycle

const palette = [
  [255, 183, 197, 0.3],  // 樱粉
  [168, 216, 185, 0.25], // 嫩绿
  [135, 206, 235, 0.2],  // 天蓝
  [200, 162, 200, 0.2],  // 薰衣草
  [255, 222, 173, 0.25], // 杏黄
];

class Petal {
  constructor(i, total) {
    this.i = i;
    this.total = total;
    this.angle = (i / total) * Math.PI * 2;
    this.baseRadius = 0;
    this.color = palette[i % palette.length];
    this.freqOffset = Math.random() * 0.3 + 0.8;
    this.phaseOffset = Math.random() * Math.PI * 2;
    this.sizeBase = Math.random() * 20 + 15;
  }

  update(breath, t) {
    // breath: 0~1 where 0.5 is peak inhale
    const inhale = Math.sin(breath * Math.PI); // 0→1→0
    this.baseRadius = 40 + inhale * Math.min(W, H) * 0.28;
    this.currentAngle = this.angle + Math.sin(t * 0.3 * this.freqOffset + this.phaseOffset) * 0.15;
    this.size = this.sizeBase * (0.6 + inhale * 0.8);
    this.opacity = 0.1 + inhale * 0.5;
  }

  draw(ctx) {
    const x = cx + Math.cos(this.currentAngle) * this.baseRadius;
    const y = cy + Math.sin(this.currentAngle) * this.baseRadius;
    const [r, g, b] = this.color;

    // soft radial glow
    const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
    grad.addColorStop(0, `rgba(${r},${g},${b},${this.opacity})`);
    grad.addColorStop(0.5, `rgba(${r},${g},${b},${this.opacity * 0.4})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

    ctx.beginPath();
    ctx.arc(x, y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// inner ring particles — smaller, denser
class InnerMote {
  constructor(i, total) {
    this.angle = (i / total) * Math.PI * 2 + Math.random() * 0.3;
    this.speed = Math.random() * 0.4 + 0.2;
    this.dist = Math.random() * 0.4 + 0.1; // fraction of main radius
    this.size = Math.random() * 3 + 1.5;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.phase = Math.random() * Math.PI * 2;
  }

  draw(ctx, breath, t) {
    const inhale = Math.sin(breath * Math.PI);
    const mainR = 40 + inhale * Math.min(W, H) * 0.28;
    const r = mainR * this.dist;
    const a = this.angle + t * this.speed * 0.1 + Math.sin(t * 0.5 + this.phase) * 0.2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    const [cr, cg, cb] = this.color;
    const op = 0.15 + inhale * 0.4;

    ctx.beginPath();
    ctx.arc(x, y, this.size * (0.5 + inhale * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${cr},${cg},${cb},${op})`;
    ctx.fill();
  }
}

const petalCount = 36;
const moteCount = 60;
let petals = [];
let motes = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  petals = [];
  motes = [];
  for (let i = 0; i < petalCount; i++) petals.push(new Petal(i, petalCount));
  for (let i = 0; i < moteCount; i++) motes.push(new InnerMote(i, moteCount));
}

function getBreathSpeed() {
  // mouse proximity to center speeds up breath (like excitement)
  if (mouseX < 0) return 0.008;
  const d = Math.hypot(mouseX - cx, mouseY - cy);
  const maxD = Math.hypot(W, H) / 2;
  const proximity = 1 - Math.min(d / maxD, 1);
  return 0.006 + proximity * 0.012;
}

function draw() {
  // semi-transparent clear for trailing effect
  ctx.fillStyle = 'rgba(255, 248, 240, 0.15)';
  ctx.fillRect(0, 0, W, H);

  breathPhase += getBreathSpeed();
  if (breathPhase > 1) breathPhase -= 1;
  time += 0.016;

  // center glow
  const inhale = Math.sin(breathPhase * Math.PI);
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30 + inhale * 50);
  coreGrad.addColorStop(0, `rgba(255, 255, 255, ${0.5 + inhale * 0.3})`);
  coreGrad.addColorStop(0.5, `rgba(255, 230, 220, ${0.2 + inhale * 0.15})`);
  coreGrad.addColorStop(1, 'rgba(255, 248, 240, 0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 30 + inhale * 50, 0, Math.PI * 2);
  ctx.fillStyle = coreGrad;
  ctx.fill();

  // draw motes behind petals
  for (const m of motes) m.draw(ctx, breathPhase, time);

  // draw petals
  for (const p of petals) {
    p.update(breathPhase, time);
    p.draw(ctx);
  }

  // outer halo ring
  ctx.beginPath();
  ctx.arc(cx, cy, 40 + inhale * Math.min(W, H) * 0.3, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(200, 162, 200, ${0.05 + inhale * 0.08})`;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; });

resize();
draw();
</script>
</body>
</html>
