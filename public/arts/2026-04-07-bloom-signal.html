<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花信 / Bloom Signal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF6EE; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
</style>
<script src="p5.min.js"></script>
</head>
<body>
<script>
// 花信 / Bloom Signal
// Fidenza-inspired: flow field + thick color blocks + collision detection
// Spring palette: sakura pink, tender green, sky blue, apricot yellow
// Warm light background, translucent layering for depth

const PALETTES = [
  // sakura pink — more saturated
  { color: [255, 150, 175], weight: 4 },
  { color: [255, 120, 155], weight: 3 },
  { color: [245, 180, 200], weight: 2 },
  // tender green — more vivid
  { color: [120, 200, 150], weight: 4 },
  { color: [100, 185, 135], weight: 3 },
  { color: [160, 215, 175], weight: 2 },
  // sky blue — clearer
  { color: [100, 185, 235], weight: 3 },
  { color: [130, 200, 240], weight: 3 },
  { color: [80, 165, 220], weight: 2 },
  // apricot yellow — warmer
  { color: [255, 195, 120], weight: 3 },
  { color: [255, 175, 100], weight: 2 },
  { color: [255, 215, 155], weight: 2 },
  // lavender accent
  { color: [180, 140, 200], weight: 2 },
  // warm cream highlight
  { color: [255, 248, 235], weight: 1 },
];

// Build weighted array
let weightedColors = [];
for (let p of PALETTES) {
  for (let i = 0; i < p.weight; i++) weightedColors.push(p.color);
}

function pickColor() {
  return weightedColors[Math.floor(Math.random() * weightedColors.length)];
}

let field;
let cols, rows;
const scl = 20;
let placed = []; // collision boxes
let seed;

function setup() {
  const dim = Math.min(windowWidth, windowHeight);
  createCanvas(dim, dim);
  pixelDensity(2);
  noLoop();

  seed = Math.random() * 10000;
  cols = Math.floor(width / scl) + 1;
  rows = Math.floor(height / scl) + 1;

  // Generate flow field with Perlin noise
  field = new Array(cols * rows);
  noiseSeed(seed);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let n = noise(x * 0.06, y * 0.06, seed * 0.01);
      field[y * cols + x] = n * TWO_PI * 2.5;
    }
  }

  background(255, 246, 238); // warm cream

  // Draw subtle texture on background
  drawBackgroundTexture();

  // Place color blocks along flow field
  placeBlocks();

  // Add light scatter / highlight particles
  drawHighlights();
}

function drawBackgroundTexture() {
  // Subtle warm grain
  loadPixels();
  for (let i = 0; i < pixels.length; i += 4) {
    let n = random(-6, 6);
    pixels[i] += n;
    pixels[i+1] += n;
    pixels[i+2] += n * 0.8;
  }
  updatePixels();
}

function getAngle(x, y) {
  let col = Math.floor(x / scl);
  let row = Math.floor(y / scl);
  col = constrain(col, 0, cols - 1);
  row = constrain(row, 0, rows - 1);
  return field[row * cols + col];
}

function checkCollision(rect) {
  for (let p of placed) {
    // Simple AABB with margin
    let margin = 2;
    if (rect.x < p.x + p.w + margin &&
        rect.x + rect.w > p.x - margin &&
        rect.y < p.y + p.h + margin &&
        rect.y + rect.h > p.y - margin) {
      return true;
    }
  }
  return false;
}

function placeBlocks() {
  // Seven size tiers like Fidenza
  const sizes = [
    { w: [80, 140], h: [14, 24], count: 40 },    // large
    { w: [45, 80], h: [10, 18], count: 90 },     // medium
    { w: [22, 45], h: [6, 14], count: 160 },     // small
    { w: [10, 24], h: [5, 10], count: 200 },     // tiny
  ];

  for (let tier of sizes) {
    let attempts = 0;
    let count = 0;
    while (count < tier.count && attempts < tier.count * 20) {
      attempts++;
      let x = random(30, width - 30);
      let y = random(30, height - 30);
      let angle = getAngle(x, y);
      let w = random(tier.w[0], tier.w[1]);
      let h = random(tier.h[0], tier.h[1]);

      // Calculate bounding box for rotated rect (approx)
      let bw = abs(w * cos(angle)) + abs(h * sin(angle));
      let bh = abs(w * sin(angle)) + abs(h * cos(angle));
      let bbox = { x: x - bw/2, y: y - bh/2, w: bw, h: bh };

      if (checkCollision(bbox)) continue;
      if (bbox.x < 5 || bbox.y < 5 || bbox.x + bbox.w > width - 5 || bbox.y + bbox.h > height - 5) continue;

      placed.push(bbox);

      // Draw the block
      let col = pickColor();
      let alpha = random(170, 250);

      push();
      translate(x, y);
      rotate(angle);
      noStroke();

      // Main block
      fill(col[0], col[1], col[2], alpha);
      rect(-w/2, -h/2, w, h, random(1, 3));

      // Soft glow layer (larger, more transparent)
      fill(col[0], col[1], col[2], alpha * 0.2);
      rect(-w/2 - 2, -h/2 - 1, w + 4, h + 2, random(2, 4));

      // Highlight edge (light side)
      fill(255, 255, 250, random(30, 80));
      rect(-w/2, -h/2, w, h * 0.3, 2);

      pop();
      count++;
    }
  }

  // Super blocks: occasional filled rectangles with inner pattern
  for (let i = 0; i < 15; i++) {
    let attempts = 0;
    while (attempts < 200) {
      attempts++;
      let x = random(60, width - 60);
      let y = random(60, height - 60);
      let angle = getAngle(x, y);
      let w = random(40, 80);
      let h = random(30, 60);

      let bw = abs(w * cos(angle)) + abs(h * sin(angle));
      let bh = abs(w * sin(angle)) + abs(h * cos(angle));
      let bbox = { x: x - bw/2, y: y - bh/2, w: bw, h: bh };

      if (checkCollision(bbox)) continue;
      placed.push(bbox);

      let col = pickColor();
      push();
      translate(x, y);
      rotate(angle);

      // Fill with tiny squares (Fidenza super block style)
      let step = random(4, 7);
      for (let sx = -w/2; sx < w/2; sx += step) {
        for (let sy = -h/2; sy < h/2; sy += step) {
          let subcol = random() > 0.3 ? col : pickColor();
          fill(subcol[0], subcol[1], subcol[2], random(120, 200));
          noStroke();
          rect(sx, sy, step - 1, step - 1, 0.5);
        }
      }

      // Border
      noFill();
      stroke(col[0], col[1], col[2], 60);
      strokeWeight(0.5);
      rect(-w/2, -h/2, w, h, 2);

      pop();
      break;
    }
  }
}

function drawHighlights() {
  // Scatter white/pale highlights for "light through petals" feeling
  for (let i = 0; i < 300; i++) {
    let x = random(width);
    let y = random(height);
    let s = random(1, 4);
    fill(255, 252, 245, random(20, 80));
    noStroke();
    ellipse(x, y, s, s);
  }

  // Larger soft bokeh circles
  for (let i = 0; i < 20; i++) {
    let x = random(width);
    let y = random(height);
    let s = random(15, 50);
    let col = pickColor();
    fill(col[0], col[1], col[2], random(8, 25));
    noStroke();
    ellipse(x, y, s, s);
  }
}

function windowResized() {
  // Static piece, no resize
}
</script>
</body>
</html>
