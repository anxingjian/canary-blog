<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泛音 / Overtone</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0a12; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let time = 0;
let harmonics = 3;
const MAX_H = 12;

const palette = [
  { r: 199, g: 135, b: 84 },   // copper
  { r: 160, g: 90, b: 50 },    // sienna
  { r: 240, g: 220, b: 185 },  // warm ivory
  { r: 170, g: 140, b: 100 },  // muted gold
  { r: 130, g: 100, b: 70 },   // dark bronze
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initParticles();
}

// Particles that orbit along string vibrations
let particles = [];
function initParticles() {
  particles = [];
  const count = Math.min(350, Math.floor(W * H / 4000));
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      size: 0.8 + Math.random() * 1.5,
      life: 0.3 + Math.random() * 0.7,
      harmonic: Math.floor(Math.random() * harmonics) + 1,
    });
  }
}

function draw() {
  time += 0.012;

  ctx.fillStyle = 'rgba(10,10,18,0.06)';
  ctx.fillRect(0, 0, W, H);

  const marginX = W * 0.1;
  const marginY = H * 0.06;
  const stringW = W - marginX * 2;
  const availH = H - marginY * 2;
  const spacing = availH / (harmonics + 1.5);

  // Draw strings
  for (let n = 1; n <= harmonics; n++) {
    const y0 = marginY + spacing * n;
    const amp = Math.min(spacing * 0.38, 45) / Math.pow(n, 0.4);
    const envelope = Math.cos(n * 0.6 * time);
    const energy = Math.abs(envelope);

    const colIdx = (n - 1) % palette.length;
    const col = palette[colIdx];

    // Ghost trails — multiple past positions
    for (let ghost = 3; ghost >= 1; ghost--) {
      const pastEnv = Math.cos(n * 0.6 * (time - ghost * 0.12));
      ctx.beginPath();
      for (let px = 0; px <= stringW; px += 2) {
        const xNorm = px / stringW;
        const spatial = Math.sin(n * Math.PI * xNorm);
        // Add subtle noise to make it organic
        const noise = Math.sin(xNorm * 20 + time * 0.5 + n) * 0.8;
        const y = y0 + (spatial * amp * pastEnv) + noise;
        if (px === 0) ctx.moveTo(marginX, y);
        else ctx.lineTo(marginX + px, y);
      }
      ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},${0.02 * (4 - ghost)})`;
      ctx.lineWidth = 1.5 + ghost * 0.3;
      ctx.stroke();
    }

    // Main string — organic, not perfect sine
    ctx.beginPath();
    for (let px = 0; px <= stringW; px += 1.5) {
      const xNorm = px / stringW;
      const spatial = Math.sin(n * Math.PI * xNorm);
      const noise = Math.sin(xNorm * 20 + time * 0.5 + n) * 0.8;
      const microNoise = Math.sin(xNorm * 80 + time * 2) * 0.3 * energy;
      const y = y0 + spatial * amp * envelope + noise + microNoise;
      if (px === 0) ctx.moveTo(marginX, y);
      else ctx.lineTo(marginX + px, y);
    }
    const alpha = 0.15 + energy * 0.45;
    ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},${alpha})`;
    ctx.lineWidth = 1 + energy * 1.5;
    ctx.stroke();

    // Glow along the string where amplitude is highest
    if (energy > 0.3) {
      ctx.beginPath();
      for (let px = 0; px <= stringW; px += 2) {
        const xNorm = px / stringW;
        const spatial = Math.sin(n * Math.PI * xNorm);
        const y = y0 + spatial * amp * envelope;
        if (px === 0) ctx.moveTo(marginX, y);
        else ctx.lineTo(marginX + px, y);
      }
      ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},${energy * 0.08})`;
      ctx.lineWidth = 6 + energy * 4;
      ctx.stroke();
    }

    // Nodes — glowing fixed points
    for (let k = 0; k <= n; k++) {
      const nodeX = marginX + (k / n) * stringW;
      const pulse = 0.4 + 0.4 * Math.sin(time * 1.5 + k * 1.3 + n * 0.7);

      const grad = ctx.createRadialGradient(nodeX, y0, 0, nodeX, y0, 5 + pulse * 3);
      grad.addColorStop(0, `rgba(240,225,200,${pulse * 0.5})`);
      grad.addColorStop(1, 'rgba(240,225,200,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(nodeX, y0, 5 + pulse * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(240,225,200,${0.3 + pulse * 0.3})`;
      ctx.beginPath();
      ctx.arc(nodeX, y0, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Fixed endpoints
  for (const x of [marginX, marginX + stringW]) {
    ctx.beginPath();
    ctx.moveTo(x, marginY + spacing * 0.5);
    ctx.lineTo(x, marginY + spacing * (harmonics + 0.5));
    ctx.strokeStyle = 'rgba(200,185,160,0.06)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // End caps
    const grad = ctx.createRadialGradient(x, H / 2, 0, x, H / 2, 8);
    grad.addColorStop(0, 'rgba(200,185,160,0.15)');
    grad.addColorStop(1, 'rgba(200,185,160,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, H / 2, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles — drift along wave energy
  for (const p of particles) {
    const n = Math.min(p.harmonic, harmonics);
    const y0 = marginY + spacing * n;
    const amp = Math.min(spacing * 0.38, 45) / Math.pow(n, 0.4);
    const envelope = Math.cos(n * 0.6 * time);

    // Find nearest position on the string
    const xNorm = Math.max(0, Math.min(1, (p.x - marginX) / stringW));
    const spatial = Math.sin(n * Math.PI * xNorm);
    const targetY = y0 + spatial * amp * envelope;

    // Attract to string with some lag
    const dy = targetY - p.y;
    p.vy += dy * 0.02;
    p.vx += (Math.random() - 0.5) * 0.1 + Math.abs(envelope) * 0.3; // drift rightward with energy

    p.vx *= 0.96;
    p.vy *= 0.94;
    p.x += p.vx;
    p.y += p.vy;

    // Wrap horizontally
    if (p.x > marginX + stringW + 10) { p.x = marginX - 5; p.harmonic = Math.floor(Math.random() * harmonics) + 1; }
    if (p.x < marginX - 10) p.x = marginX + stringW + 5;

    const distFromString = Math.abs(p.y - targetY);
    const energy = Math.abs(envelope);
    const colIdx = (n - 1) % palette.length;
    const col = palette[colIdx];
    const alpha = Math.max(0.05, (0.3 - distFromString * 0.005) * energy) * p.life;

    ctx.fillStyle = `rgba(${col.r},${col.g},${col.b},${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Connection lines between close particles on same harmonic
  for (let i = 0; i < particles.length; i += 3) {
    const a = particles[i];
    for (let j = i + 3; j < particles.length; j += 3) {
      const b = particles[j];
      if (a.harmonic !== b.harmonic) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = dx * dx + dy * dy;
      if (d < 2500 && d > 100) {
        const alpha = (1 - d / 2500) * 0.06;
        const col = palette[(a.harmonic - 1) % palette.length];
        ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},${alpha})`;
        ctx.lineWidth = 0.4;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }

  // Composite waveform — bottom area
  const compY = H - marginY * 1.5;
  const compAmp = 18;
  ctx.beginPath();
  for (let px = 0; px <= stringW; px += 1.5) {
    const xNorm = px / stringW;
    let sum = 0;
    for (let n = 1; n <= harmonics; n++) {
      sum += Math.sin(n * Math.PI * xNorm) * Math.cos(n * 0.6 * time) / Math.pow(n, 0.4);
    }
    const y = compY + sum * compAmp;
    if (px === 0) ctx.moveTo(marginX, y);
    else ctx.lineTo(marginX + px, y);
  }
  ctx.strokeStyle = 'rgba(220,200,170,0.25)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Composite glow
  ctx.beginPath();
  for (let px = 0; px <= stringW; px += 2) {
    const xNorm = px / stringW;
    let sum = 0;
    for (let n = 1; n <= harmonics; n++) {
      sum += Math.sin(n * Math.PI * xNorm) * Math.cos(n * 0.6 * time) / Math.pow(n, 0.4);
    }
    const y = compY + sum * compAmp;
    if (px === 0) ctx.moveTo(marginX, y);
    else ctx.lineTo(marginX + px, y);
  }
  ctx.strokeStyle = 'rgba(220,200,170,0.06)';
  ctx.lineWidth = 8;
  ctx.stroke();

  requestAnimationFrame(draw);
}

resize();
window.addEventListener('resize', resize);

canvas.addEventListener('click', () => {
  if (harmonics < MAX_H) {
    harmonics++;
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: Math.random() * (W - W * 0.2) + W * 0.1,
        y: Math.random() * H,
        vx: 0, vy: 0,
        size: 0.8 + Math.random() * 1.5,
        life: 0.3 + Math.random() * 0.7,
        harmonic: harmonics,
      });
    }
  }
});

draw();
</script>
</body>
</html>
