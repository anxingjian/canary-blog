<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏息 / Hold</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF8F0; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let mouseX = -1, mouseY = -1;

const palette = [
  [255, 183, 197],  // 樱粉
  [168, 216, 185],  // 嫩绿
  [135, 206, 235],  // 天蓝
  [200, 162, 200],  // 薰衣草
  [255, 222, 173],  // 杏黄
];

// Hold: the suspended moment. Everything vibrates in place,
// caught between expansion and contraction. Tension without movement.

class SuspendedParticle {
  constructor() {
    this.reset(true);
  }

  reset(initial) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * Math.min(W, H) * 0.32;
    this.homeX = cx + Math.cos(angle) * dist;
    this.homeY = cy + Math.sin(angle) * dist;
    this.x = this.homeX;
    this.y = this.homeY;
    this.size = Math.random() * 4 + 1.5;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.trembleAmp = Math.random() * 2.5 + 0.5;
    this.trembleFreqX = Math.random() * 3 + 2;
    this.trembleFreqY = Math.random() * 3 + 2;
    this.phaseX = Math.random() * Math.PI * 2;
    this.phaseY = Math.random() * Math.PI * 2;
    this.alpha = 0.3 + Math.random() * 0.5;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.dist = dist;
  }

  update(t) {
    // Tremble in place — held energy wanting to release
    const trembleScale = 1 + 0.3 * Math.sin(t * 0.5); // global tension wave
    this.x = this.homeX + Math.sin(t * this.trembleFreqX + this.phaseX) * this.trembleAmp * trembleScale;
    this.y = this.homeY + Math.cos(t * this.trembleFreqY + this.phaseY) * this.trembleAmp * trembleScale;

    // Mouse proximity: particles freeze harder (become still, glow brighter)
    if (mouseX > 0) {
      const dx = this.x - mouseX;
      const dy = this.y - mouseY;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 120) {
        const influence = 1 - d / 120;
        // Freeze: reduce trembling, increase glow
        this.x = this.homeX + (this.x - this.homeX) * (1 - influence * 0.8);
        this.y = this.homeY + (this.y - this.homeY) * (1 - influence * 0.8);
        this.drawAlpha = Math.min(1, this.alpha + influence * 0.4);
        this.drawSize = this.size * (1 + influence * 0.5);
        return;
      }
    }
    this.drawAlpha = this.alpha + 0.1 * Math.sin(t * 1.5 + this.pulsePhase);
    this.drawSize = this.size;
  }

  draw() {
    const [r, g, b] = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.drawSize, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${this.drawAlpha})`;
    ctx.fill();

    // Soft glow
    if (this.drawSize > 2) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.drawSize * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.drawAlpha * 0.1})`;
      ctx.fill();
    }
  }
}

// Concentric rings that pulse subtly — the pressure of held breath
class TensionRing {
  constructor(i, total) {
    this.i = i;
    this.baseRadius = (i + 1) / total;
    this.color = palette[i % palette.length];
    this.phaseOffset = i * 0.7;
  }

  draw(t) {
    const maxR = Math.min(W, H) * 0.38;
    // Subtle pulsing — almost still but not quite
    const pulse = Math.sin(t * 0.8 + this.phaseOffset) * 0.02;
    const r = this.baseRadius * maxR * (1 + pulse);

    const [cr, cg, cb] = this.color;
    // Opacity breathes very gently
    const alpha = 0.08 + 0.04 * Math.sin(t * 0.6 + this.phaseOffset * 1.3);

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    ctx.lineWidth = 1.2 + 0.3 * Math.sin(t * 0.4 + this.phaseOffset);
    ctx.stroke();
  }
}

// Center: a dense core holding everything together
function drawCore(t) {
  const breathHold = Math.sin(t * 0.5);
  const coreR = 12 + breathHold * 2; // barely moves

  // Layered glow
  for (let layer = 4; layer >= 0; layer--) {
    const lr = coreR + layer * 8;
    const alpha = 0.03 * (5 - layer);
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, lr);
    gradient.addColorStop(0, `rgba(255, 183, 197, ${alpha * 1.5})`);
    gradient.addColorStop(0.5, `rgba(200, 162, 200, ${alpha})`);
    gradient.addColorStop(1, `rgba(135, 206, 235, 0)`);
    ctx.beginPath();
    ctx.arc(cx, cy, lr, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Core dot
  const coreAlpha = 0.6 + 0.15 * breathHold;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255, 183, 197, ${coreAlpha})`;
  ctx.fill();
}

// Tension lines: faint radial lines that quiver
function drawTensionLines(t) {
  const count = 36;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const wobble = Math.sin(t * 2.5 + i * 0.8) * 0.015;
    const a = angle + wobble;

    const innerR = 25 + Math.sin(t * 0.7 + i) * 3;
    const outerR = Math.min(W, H) * (0.15 + 0.12 * ((i % 3) / 2));
    const alpha = 0.04 + 0.02 * Math.sin(t * 1.2 + i * 0.5);

    const [cr, cg, cb] = palette[i % palette.length];
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * innerR, cy + Math.sin(a) * innerR);
    ctx.lineTo(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

let particles = [];
let rings = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}

function init() {
  resize();
  particles = [];
  rings = [];

  for (let i = 0; i < 150; i++) {
    particles.push(new SuspendedParticle());
  }
  for (let i = 0; i < 7; i++) {
    rings.push(new TensionRing(i, 7));
  }
}

function animate() {
  time += 0.008; // Very slow — this is stillness

  // Soft fade instead of full clear — creates lingering afterimage
  ctx.fillStyle = 'rgba(255, 248, 240, 0.15)';
  ctx.fillRect(0, 0, W, H);

  drawTensionLines(time);
  rings.forEach(r => r.draw(time));
  drawCore(time);

  particles.forEach(p => {
    p.update(time);
    p.draw();
  });

  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => {
  mouseX = mouseY = -1;
});
window.addEventListener('resize', () => {
  resize();
  particles.forEach(p => p.reset(true));
});

init();
animate();
</script>
</body>
</html>
