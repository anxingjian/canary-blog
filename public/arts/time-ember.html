<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>余烬 / Ember</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080808; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
}
resize();
window.addEventListener('resize', resize);

// --- Ember particles ---
const EMBER_COUNT = 280;
const embers = [];
let globalTime = 0;
// The "fire" gradually cools over a long cycle
const CYCLE = 120; // seconds for full warm→cold→warm

class Ember {
  constructor() { this.reset(true); }
  reset(init) {
    // Born near center-bottom, like a dying hearth
    this.x = W * (0.3 + Math.random() * 0.4);
    this.y = H * (0.55 + Math.random() * 0.35);
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = -(0.15 + Math.random() * 0.6);
    this.life = 0;
    this.maxLife = 200 + Math.random() * 400;
    this.size = 1 + Math.random() * 2.5;
    this.drift = (Math.random() - 0.5) * 0.002;
    this.flicker = Math.random() * Math.PI * 2;
    this.flickerSpeed = 0.02 + Math.random() * 0.05;
    // Birth time determines color temperature
    this.birthTime = globalTime;
    if (init) this.life = Math.random() * this.maxLife;
  }
}

for (let i = 0; i < EMBER_COUNT; i++) embers.push(new Ember());

// Ash layer: settled, dead embers on the ground
const ASH_COUNT = 120;
const ashes = [];
for (let i = 0; i < ASH_COUNT; i++) {
  ashes.push({
    x: Math.random() * W * 1.2 - W * 0.1,
    y: H * (0.78 + Math.random() * 0.2),
    size: 0.5 + Math.random() * 1.5,
    alpha: 0.02 + Math.random() * 0.06,
    pulse: Math.random() * Math.PI * 2,
  });
}

// Mouse: breathing on embers — proximity warms them up
let mx = -1, my = -1, mouseActive = false;
document.addEventListener('mousemove', e => {
  mx = e.clientX * dpr; my = e.clientY * dpr; mouseActive = true;
});
document.addEventListener('mouseleave', () => { mouseActive = false; });

function colorForEmber(e) {
  const progress = e.life / e.maxLife; // 0=born, 1=dead
  // Global cooling: cycle between warm and cool
  const cooling = (Math.sin(globalTime / CYCLE * Math.PI * 2 - Math.PI / 2) + 1) / 2;
  // 0=hottest, 1=coldest
  const temp = progress * 0.7 + cooling * 0.3;

  // Mouse proximity warms
  let warmBoost = 0;
  if (mouseActive) {
    const d = Math.hypot(e.x - mx, e.y - my);
    warmBoost = Math.max(0, 1 - d / (W * 0.15)) * 0.4;
  }
  const t = Math.max(0, temp - warmBoost);

  // Color journey: white-hot → orange → deep red → ash grey → dark
  let h, s, l;
  if (t < 0.2) {
    h = 40 + t * 50; s = 90; l = 85 - t * 100;
  } else if (t < 0.5) {
    const p = (t - 0.2) / 0.3;
    h = 30 - p * 20; s = 85 - p * 20; l = 65 - p * 25;
  } else if (t < 0.8) {
    const p = (t - 0.5) / 0.3;
    h = 10 - p * 10; s = 65 - p * 45; l = 40 - p * 20;
  } else {
    const p = (t - 0.8) / 0.2;
    h = 0; s = 20 - p * 18; l = 20 - p * 12;
  }

  // Flicker
  const flick = Math.sin(e.flicker + e.life * e.flickerSpeed);
  const alphaBase = progress < 0.1 ? progress / 0.1
    : progress > 0.85 ? (1 - progress) / 0.15
    : 1;
  const alpha = alphaBase * (0.5 + 0.5 * flick) * (0.3 + (1 - t) * 0.7);

  return { h, s, l, alpha: Math.max(0, Math.min(1, alpha)) };
}

function draw() {
  // Very slow fade — embers leave ghost trails
  ctx.fillStyle = 'rgba(8, 8, 8, 0.04)';
  ctx.fillRect(0, 0, W, H);

  globalTime += 1 / 60;

  // Draw ash bed
  for (const a of ashes) {
    const pulse = Math.sin(a.pulse + globalTime * 0.3) * 0.02;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(60, 50, 45, ${a.alpha + pulse})`;
    ctx.fill();
  }

  // Subtle ground glow
  const glowAlpha = 0.015 + 0.01 * Math.sin(globalTime * 0.2);
  const grd = ctx.createRadialGradient(W / 2, H * 0.82, 0, W / 2, H * 0.82, W * 0.35);
  grd.addColorStop(0, `rgba(120, 50, 20, ${glowAlpha})`);
  grd.addColorStop(1, 'rgba(120, 50, 20, 0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  // Update and draw embers
  for (const e of embers) {
    e.life++;
    if (e.life > e.maxLife) e.reset(false);

    // Physics: slow rise, gentle drift
    e.x += e.vx + Math.sin(e.life * 0.008 + e.drift * 100) * 0.3;
    e.y += e.vy;
    e.vy *= 0.999; // slow deceleration
    e.vx += e.drift;

    // Mouse: breathing pushes embers upward
    if (mouseActive) {
      const dx = e.x - mx, dy = e.y - my;
      const d = Math.hypot(dx, dy);
      if (d < W * 0.12 && d > 1) {
        e.vy -= 0.02 * (1 - d / (W * 0.12));
        e.vx += dx / d * 0.01;
      }
    }

    const c = colorForEmber(e);
    if (c.alpha < 0.01) continue;

    const sz = e.size * (1 - e.life / e.maxLife * 0.6);

    // Glow
    if (c.l > 30 && c.alpha > 0.1) {
      const glowR = sz * 4;
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, glowR);
      g.addColorStop(0, `hsla(${c.h}, ${c.s}%, ${c.l}%, ${c.alpha * 0.15})`);
      g.addColorStop(1, `hsla(${c.h}, ${c.s}%, ${c.l}%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(e.x - glowR, e.y - glowR, glowR * 2, glowR * 2);
    }

    // Core
    ctx.beginPath();
    ctx.arc(e.x, e.y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${c.h}, ${c.s}%, ${c.l}%, ${c.alpha})`;
    ctx.fill();
  }

  // Occasional spark: a bright flash that dies fast
  if (Math.random() < 0.02) {
    const sx = W * (0.35 + Math.random() * 0.3);
    const sy = H * (0.6 + Math.random() * 0.2);
    const sparkG = ctx.createRadialGradient(sx, sy, 0, sx, sy, 8);
    sparkG.addColorStop(0, 'rgba(255, 220, 150, 0.6)');
    sparkG.addColorStop(1, 'rgba(255, 180, 80, 0)');
    ctx.fillStyle = sparkG;
    ctx.fillRect(sx - 8, sy - 8, 16, 16);
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
