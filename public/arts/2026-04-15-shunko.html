<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春光 / Shunkō</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
// 春光 / Shunkō — Canary 2026-04-15
// Flow field curved ribbons — spring palette, translucent layers
// Fidenza-inspired: thick color blocks following flow, collision detection

let seed, sz;
const CELL = 8;
let grid, gridCols;

const PALETTE_W = [
  ['#FFB7C5', 20], ['#FFA0B3', 8],
  ['#A8D8B9', 16], ['#8CC9A1', 6],
  ['#87CEEB', 14], ['#72B8DD', 5],
  ['#FFDEAD', 12], ['#FFCF8A', 7],
  ['#C8A2C8', 7],  ['#E8D5E8', 5],
  ['#FFFFFF', 8],
];
const PT = PALETTE_W.reduce((s, p) => s + p[1], 0);

function wPick() {
  let r = random(PT);
  for (let p of PALETTE_W) { r -= p[1]; if (r <= 0) return p[0]; }
  return PALETTE_W[0][0];
}

function htr(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function gIdx(x, y) {
  let gx = floor(x / CELL), gy = floor(y / CELL);
  if (gx < 0 || gy < 0 || gx >= gridCols || gy >= gridCols) return -1;
  return gy * gridCols + gx;
}

function gridOcc(x, y) {
  let i = gIdx(x, y);
  return i < 0 ? false : grid[i] === 1;
}

function gridSet(x, y) {
  let i = gIdx(x, y);
  if (i >= 0) grid[i] = 1;
}

function markRect(cx, cy, hw) {
  for (let dx = -hw; dx <= hw; dx += CELL * 0.7) {
    gridSet(cx + dx, cy);
  }
}

function setup() {
  seed = Math.floor(Math.random() * 999999);
  randomSeed(seed);
  noiseSeed(seed);

  sz = min(windowWidth, windowHeight);
  createCanvas(sz, sz);
  pixelDensity(2);

  // Warm gradient BG
  noStroke();
  for (let y = 0; y < height; y++) {
    let t = y / height;
    fill(lerp(255,253,t), lerp(250,243,t), lerp(242,228,t));
    rect(0, y, width, 1);
  }

  gridCols = ceil(sz / CELL);
  grid = new Uint8Array(gridCols * gridCols);

  let nScale = random(0.002, 0.004);
  let turb = random(1.0, 2.0);

  // Width tiers
  const WT = [[3,7,35],[7,16,28],[14,30,18],[28,55,10],[50,85,4]];
  const WTT = WT.reduce((s,w)=>s+w[2],0);
  function pickW() {
    let r = random(WTT);
    for (let w of WT) { r -= w[2]; if (r <= 0) return random(w[0],w[1]); }
    return 10;
  }

  let placed = 0, attempts = 0;
  noStroke();

  while (attempts < 30000 && placed < 700) {
    attempts++;

    let sx = random(sz * 0.02, sz * 0.98);
    let sy = random(sz * 0.02, sz * 0.98);

    // Only check start point
    if (gridOcc(sx, sy)) continue;

    let bw = pickW();
    let hw = bw / 2;
    let [cr,cg,cb] = htr(wPick());
    let alpha = random(110, 220);
    let stepLen = random(2.5, 5);
    let maxSteps = floor(random(15, 140));

    let cx = sx, cy = sy;
    let drawn = 0;

    for (let s = 0; s < maxSteps; s++) {
      let angle = noise(cx * nScale, cy * nScale) * TWO_PI * turb;
      let nx = cx + cos(angle) * stepLen;
      let ny = cy + sin(angle) * stepLen;

      // Out of canvas?
      if (nx < -10 || nx > sz + 10 || ny < -10 || ny > sz + 10) break;

      // Check collision at edges of the ribbon
      let perpX = -sin(angle) * hw;
      let perpY = cos(angle) * hw;
      if (gridOcc(nx + perpX, ny + perpY) || gridOcc(nx - perpX, ny - perpY)) break;

      let sa = constrain(alpha + random(-15, 15), 60, 240);
      fill(cr, cg, cb, sa);

      quad(
        cx + perpX, cy + perpY,
        cx - perpX, cy - perpY,
        nx - perpX, ny - perpY,
        nx + perpX, ny + perpY
      );

      markRect(nx, ny, hw + 1);
      cx = nx; cy = ny;
      drawn++;
    }

    if (drawn > 2) placed++;
  }

  // Highlight wisps
  for (let i = 0; i < random(80, 150); i++) {
    let hx = random(sz), hy = random(sz);
    stroke(255, 255, 250, random(15, 45));
    strokeWeight(random(0.4, 1.2));
    noFill();
    beginShape();
    for (let s = 0; s < random(10, 50); s++) {
      curveVertex(hx, hy);
      let a = noise(hx * nScale, hy * nScale) * TWO_PI * turb;
      hx += cos(a) * 3; hy += sin(a) * 3;
    }
    endShape();
  }

  // Light pools
  noStroke();
  for (let i = 0; i < random(30, 55); i++) {
    let lx = random(sz), ly = random(sz), lr = random(40, 120);
    for (let d = lr; d > 0; d -= 3) {
      fill(255, 255, 248, map(d, 0, lr, 12, 0));
      ellipse(lx, ly, d, d);
    }
  }

  // Pollen
  noStroke();
  for (let i = 0; i < random(300, 600); i++) {
    let pc = htr(wPick());
    fill(pc[0], pc[1], pc[2], random(25, 65));
    ellipse(random(sz), random(sz), random(1, 3.5));
  }

  // Grain
  loadPixels();
  for (let i = 0; i < pixels.length; i += 4) {
    let g = random(-5, 5);
    pixels[i] += g; pixels[i+1] += g; pixels[i+2] += g;
  }
  updatePixels();

  noLoop();
  console.log('春光 / Shunkō — seed:', seed, '— ribbons:', placed, '/', attempts);
}
</script>
</body>
</html>
