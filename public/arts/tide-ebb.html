<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ebb — 退</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; overflow: hidden; cursor: pointer; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let time = 0;
let speed = 1;
let waterLevel = 0.35; // starts high, recedes
let ripples = [];
let creatures = [];
let sandRidges = [];

// Palette: completely different from recent 5
const MOONSILVER = [192, 200, 208];
const CORAL = [232, 100, 74];
const DEEPMOSS = [42, 61, 46];
const WETSAND = [139, 129, 120];
const BG = [48, 52, 44]; // mossy ground, brighter

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateSandRidges();
  generateCreatures();
}

function generateSandRidges() {
  sandRidges = [];
  const count = Math.floor(H / 6);
  for (let i = 0; i < count; i++) {
    const y = (i / count) * H;
    const segments = [];
    const segCount = Math.floor(W / 3);
    for (let j = 0; j < segCount; j++) {
      segments.push({
        x: (j / segCount) * W,
        baseOffset: (Math.random() - 0.5) * 4,
        freq: 0.5 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2
      });
    }
    sandRidges.push({ y, segments, depth: Math.random() * 0.3 + 0.1 });
  }
}

function generateCreatures() {
  creatures = [];
  for (let i = 0; i < 40; i++) {
    creatures.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 1.5 + Math.random() * 3,
      speed: 0.2 + Math.random() * 0.8,
      angle: Math.random() * Math.PI * 2,
      pulse: Math.random() * Math.PI * 2,
      revealed: false
    });
  }
}

function lerpColor(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

function rgba(c, a) {
  return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
}

function draw() {
  time += 0.008 * speed;

  // Water recedes slowly, oscillates slightly
  const baseRecede = Math.max(0.05, 0.35 - time * 0.008);
  waterLevel = baseRecede + Math.sin(time * 0.3) * 0.03;
  const waterY = H * (1 - waterLevel);

  // Clear with dark moss background
  ctx.fillStyle = rgba(BG, 1);
  ctx.fillRect(0, 0, W, H);

  // Draw sand ridges (exposed seabed)
  for (const ridge of sandRidges) {
    if (ridge.y < waterY - 30) continue; // still underwater, skip some

    const exposedT = Math.min(1, Math.max(0, (ridge.y - waterY + 30) / 60));
    const ridgeColor = lerpColor(DEEPMOSS, WETSAND, exposedT * ridge.depth * 3);

    ctx.beginPath();
    ctx.strokeStyle = rgba(ridgeColor, 0.3 + exposedT * 0.5);
    ctx.lineWidth = 1.2;

    let started = false;
    for (const seg of ridge.segments) {
      const waveOffset = Math.sin(seg.x * 0.008 + time * seg.freq + seg.phase) * (2 + exposedT * 3);
      const fractalOffset = Math.sin(seg.x * 0.025 + time * 0.5) * 1.5;
      const py = ridge.y + seg.baseOffset + waveOffset + fractalOffset;

      if (!started) { ctx.moveTo(seg.x, py); started = true; }
      else ctx.lineTo(seg.x, py);
    }
    ctx.stroke();
  }

  // Water film with moonlight shimmer
  const waterGrad = ctx.createLinearGradient(0, waterY - 40, 0, waterY + 20);
  waterGrad.addColorStop(0, rgba(MOONSILVER, 0.02));
  waterGrad.addColorStop(0.4, rgba(MOONSILVER, 0.12));
  waterGrad.addColorStop(0.7, rgba(MOONSILVER, 0.08));
  waterGrad.addColorStop(1, rgba(MOONSILVER, 0.01));

  // Draw water surface with wave edge
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, waterY);
  for (let x = 0; x <= W; x += 4) {
    const wave = Math.sin(x * 0.012 + time * 1.5) * 6
              + Math.sin(x * 0.005 + time * 0.7) * 10
              + Math.sin(x * 0.03 + time * 2.5) * 2;
    ctx.lineTo(x, waterY + wave);
  }
  ctx.lineTo(W, 0);
  ctx.closePath();

  // Deep water fill
  const deepGrad = ctx.createLinearGradient(0, 0, 0, waterY);
  deepGrad.addColorStop(0, rgba(DEEPMOSS, 0.9));
  deepGrad.addColorStop(0.5, rgba(lerpColor(DEEPMOSS, MOONSILVER, 0.25), 0.8));
  deepGrad.addColorStop(1, rgba(MOONSILVER, 0.45));
  ctx.fillStyle = deepGrad;
  ctx.fill();

  // Waterline shimmer
  ctx.beginPath();
  for (let x = 0; x <= W; x += 3) {
    const wave = Math.sin(x * 0.012 + time * 1.5) * 6
              + Math.sin(x * 0.005 + time * 0.7) * 10
              + Math.sin(x * 0.03 + time * 2.5) * 2;
    const shimmer = Math.sin(x * 0.05 + time * 4) * 0.3 + 0.5;
    if (x === 0) ctx.moveTo(x, waterY + wave);
    else ctx.lineTo(x, waterY + wave);
  }
  ctx.strokeStyle = rgba(MOONSILVER, 0.6 + Math.sin(time * 2) * 0.2);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Thin water film on recently exposed area
  const filmDepth = 100;
  for (let y = waterY; y < Math.min(H, waterY + filmDepth); y += 2) {
    const filmT = (y - waterY) / filmDepth;
    const alpha = (1 - filmT) * 0.12;
    ctx.fillStyle = rgba(MOONSILVER, alpha);
    ctx.fillRect(0, y, W, 2);
  }

  // Creatures in tidal pools (only visible in exposed area)
  for (const c of creatures) {
    const isExposed = c.y > waterY + 15;
    if (!isExposed) {
      c.revealed = false;
      continue;
    }

    if (!c.revealed) {
      c.revealed = true;
      c.pulse = time;
    }

    const revealT = Math.min(1, (time - c.pulse) * 0.5);
    c.angle += 0.02 * c.speed;
    const cx = c.x + Math.cos(c.angle) * 8;
    const cy = c.y + Math.sin(c.angle * 1.3) * 4;

    // Coral-colored dot
    const pulseAlpha = 0.6 + Math.sin(time * 3 + c.pulse) * 0.25;
    ctx.beginPath();
    ctx.arc(cx, cy, c.size * revealT, 0, Math.PI * 2);
    ctx.fillStyle = rgba(CORAL, pulseAlpha * revealT);
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(cx, cy, c.size * 2.5 * revealT, 0, Math.PI * 2);
    ctx.fillStyle = rgba(CORAL, pulseAlpha * 0.3 * revealT);
    ctx.fill();
  }

  // Retreating water ripple marks on exposed sand
  const rippleZoneStart = waterY + 20;
  const rippleZoneEnd = Math.min(H, waterY + filmDepth + 200);
  if (rippleZoneEnd > rippleZoneStart) {
    for (let y = rippleZoneStart; y < rippleZoneEnd; y += 12) {
      const distFromWater = (y - waterY) / H;
      const dryness = Math.min(1, distFromWater * 5);
      ctx.beginPath();
      ctx.strokeStyle = rgba(WETSAND, 0.18 + dryness * 0.25);
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= W; x += 3) {
        const ripple = Math.sin(x * 0.02 + y * 0.1 + time * 0.3) * 3 * dryness;
        if (x === 0) ctx.moveTo(x, y + ripple);
        else ctx.lineTo(x, y + ripple);
      }
      ctx.stroke();
    }
  }

  // Moonlight reflection on water
  const moonX = W * 0.65 + Math.sin(time * 0.2) * 30;
  for (let i = 0; i < 15; i++) {
    const reflY = waterY * 0.3 + i * (waterY * 0.04);
    const reflW = 20 + Math.sin(time * 1.5 + i) * 15 + i * 3;
    const alpha = 0.12 - i * 0.005;
    ctx.beginPath();
    ctx.ellipse(moonX + Math.sin(time + i) * 5, reflY, reflW, 1, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgba(MOONSILVER, Math.max(0.01, alpha));
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('click', () => {
  speed = speed === 1 ? 3 : speed === 3 ? 0.3 : 1;
});

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>
