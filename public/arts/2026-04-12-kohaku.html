<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琥珀 / Kohaku</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #F5EDE0; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
// 琥珀 / Kohaku — Canary 2026-04-12
// Technique: Flow field + variable-width strokes
// Amber/earth palette — warm ochre, burnt sienna, ink, cream
// Unlike spring pieces: dense, layered, warm-dark

const PALETTE = [
  '#D4A574',  // 焦糖
  '#C08552',  // 深焦糖
  '#8B6914',  // 琥珀
  '#A0522D',  // 赭石
  '#6B3A2E',  // 栗褐
  '#2C2C2C',  // 墨
  '#E8D5B7',  // 生宣
  '#BF8B60',  // 黄铜
  '#704214',  // 焦茶
  '#D4A06A',  // 蜜色
];

const BG = '#F5EDE0';
let seed;

function setup() {
  seed = Math.floor(Math.random() * 999999);
  randomSeed(seed);
  noiseSeed(seed);
  
  let sz = min(windowWidth, windowHeight);
  createCanvas(sz, sz);
  pixelDensity(2);
  
  background(BG);
  
  // Warm base wash
  noStroke();
  for (let y = 0; y < height; y += 1) {
    let a = map(y, 0, height, 0, 20);
    fill(200, 170, 130, a);
    rect(0, y, width, 1);
  }
  
  // === Layer 1: Flow field strokes ===
  let noiseScale = random(0.002, 0.005);
  let numStrokes = floor(random(800, 1400));
  
  for (let i = 0; i < numStrokes; i++) {
    let x = random(width);
    let y = random(height);
    let col = color(random(PALETTE));
    let strokeLen = floor(random(30, 150));
    let sw = random(0.5, 4);
    let alpha = random(20, 90);
    
    col.setAlpha(alpha);
    stroke(col);
    strokeWeight(sw);
    noFill();
    
    beginShape();
    for (let s = 0; s < strokeLen; s++) {
      let angle = noise(x * noiseScale, y * noiseScale, seed * 0.01) * TAU * 2;
      curveVertex(x, y);
      x += cos(angle) * 2;
      y += sin(angle) * 2;
      
      // Keep in bounds
      if (x < 0 || x > width || y < 0 || y > height) break;
    }
    endShape();
  }
  
  // === Layer 2: Ink dots / splatter ===
  noStroke();
  let numDots = floor(random(400, 700));
  for (let i = 0; i < numDots; i++) {
    let x = random(width);
    let y = random(height);
    let sz2 = random(1, 6);
    let col = color(random(PALETTE));
    col.setAlpha(random(15, 60));
    fill(col);
    ellipse(x, y, sz2, sz2);
  }
  
  // === Layer 3: Bold accent strokes ===
  let numAccents = floor(random(15, 35));
  for (let i = 0; i < numAccents; i++) {
    let x = random(width * 0.1, width * 0.9);
    let y = random(height * 0.1, height * 0.9);
    let col = color(random(['#2C2C2C', '#6B3A2E', '#704214', '#8B6914']));
    let alpha = random(30, 70);
    col.setAlpha(alpha);
    stroke(col);
    strokeWeight(random(3, 10));
    noFill();
    
    let len = floor(random(20, 80));
    beginShape();
    let angle = noise(x * 0.003, y * 0.003) * TAU * 2;
    for (let s = 0; s < len; s++) {
      curveVertex(x, y);
      angle += random(-0.15, 0.15);
      x += cos(angle) * 3;
      y += sin(angle) * 3;
    }
    endShape();
  }
  
  // === Layer 4: Warm light spots ===
  let numLights = floor(random(20, 40));
  for (let i = 0; i < numLights; i++) {
    let x = random(width);
    let y = random(height);
    let r = random(20, 80);
    
    for (let d = r; d > 0; d -= 2) {
      let a = map(d, 0, r, 15, 0);
      fill(255, 240, 210, a);
      noStroke();
      ellipse(x, y, d, d);
    }
  }
  
  // === Layer 5: Fine texture grain ===
  loadPixels();
  for (let i = 0; i < pixels.length; i += 4) {
    let grain = random(-8, 8);
    pixels[i] += grain;
    pixels[i + 1] += grain;
    pixels[i + 2] += grain;
  }
  updatePixels();
  
  // Soft vignette
  let vignetteSize = width * 0.6;
  for (let i = 0; i < 40; i++) {
    let a = map(i, 0, 40, 12, 0);
    noFill();
    stroke(color(BG + hex(floor(a), 2)));
    strokeWeight(width * 0.03);
    rect(-width * 0.015 + i * (width * 0.015), -height * 0.015 + i * (height * 0.015), 
         width + width * 0.03 - i * (width * 0.03), height + height * 0.03 - i * (height * 0.03));
  }
  
  noLoop();
}
</script>
</body>
</html>
