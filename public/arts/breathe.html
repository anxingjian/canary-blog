<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>喘息 / Breathe</title>
<style>body{margin:0;overflow:hidden;background:#080a0f}</style>
</head><body>
<script>
const W=window.innerWidth,H=window.innerHeight;
const c=document.createElement('canvas');c.width=W;c.height=H;
document.body.appendChild(c);const gl=c.getContext('webgl',{alpha:false,antialias:true});

// Shaders
const vs=`attribute vec2 a_pos;attribute float a_phase;attribute float a_dist;attribute vec3 a_color;
uniform float u_time;uniform float u_breath;uniform vec2 u_res;
varying float v_alpha;varying vec3 v_color;
void main(){
  float angle=a_phase+u_time*0.08;
  float breathCycle=u_breath;
  float r=a_dist*(0.6+0.4*breathCycle);
  // gentle drift
  float drift=sin(a_phase*3.0+u_time*0.15)*0.02;
  vec2 p=vec2(cos(angle)*r+drift,sin(angle)*r+drift*0.7);
  // pause at peak — particles briefly still
  float pauseZone=smoothstep(0.92,1.0,breathCycle)*smoothstep(0.92,1.0,breathCycle);
  p+=vec2(sin(a_phase*7.0),cos(a_phase*5.0))*pauseZone*0.01;
  gl_Position=vec4(p,0.0,1.0);
  float distFade=1.0-smoothstep(0.0,0.85,a_dist);
  float breathAlpha=0.3+0.7*breathCycle;
  v_alpha=distFade*breathAlpha*(0.5+0.5*sin(a_phase*2.0+u_time*0.3));
  v_color=a_color;
  gl_PointSize=mix(1.0,3.5,breathCycle*distFade)*(u_res.y/800.0);
}`;

const fs=`precision mediump float;
varying float v_alpha;varying vec3 v_color;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=dot(d,d)*4.0;
  float soft=exp(-r*2.0);
  gl_FragColor=vec4(v_color,v_alpha*soft*0.8);
}`;

function mkShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const prog=gl.createProgram();
gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);gl.useProgram(prog);

// Particles
const N=2400;
const pos=new Float32Array(N*2);
const phase=new Float32Array(N);
const dist=new Float32Array(N);
const color=new Float32Array(N*3);

// Palette: cool mist — pale blue, warm cream, soft lavender
const palette=[
  [0.82,0.88,0.95], // ice blue
  [0.95,0.92,0.85], // warm cream
  [0.78,0.75,0.90], // lavender
  [0.70,0.85,0.88], // teal mist
  [0.90,0.82,0.78], // blush
];

for(let i=0;i<N;i++){
  const a=Math.random()*Math.PI*2;
  const d=Math.pow(Math.random(),0.6);
  pos[i*2]=Math.cos(a)*d;
  pos[i*2+1]=Math.sin(a)*d;
  phase[i]=a;
  dist[i]=d;
  const c=palette[Math.floor(Math.random()*palette.length)];
  const vary=0.06;
  color[i*3]=c[0]+(Math.random()-0.5)*vary;
  color[i*3+1]=c[1]+(Math.random()-0.5)*vary;
  color[i*3+2]=c[2]+(Math.random()-0.5)*vary;
}

function mkBuf(data){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);return b;}
function attr(name,buf,size){const loc=gl.getAttribLocation(prog,name);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);}

const bPos=mkBuf(pos),bPhase=mkBuf(phase),bDist=mkBuf(dist),bColor=mkBuf(color);
attr('a_pos',bPos,2);attr('a_phase',bPhase,1);attr('a_dist',bDist,1);attr('a_color',bColor,3);

const uTime=gl.getUniformLocation(prog,'u_time');
const uBreath=gl.getUniformLocation(prog,'u_breath');
const uRes=gl.getUniformLocation(prog,'u_res');

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
gl.clearColor(0.031,0.039,0.059,1);

// Breath cycle: inhale 4s, hold 1s, exhale 5s, rest 2s = 12s
function breathValue(t){
  const cycle=12.0;
  const phase=((t%cycle)+cycle)%cycle;
  if(phase<4.0) return smoothstep(0,4,phase); // inhale
  if(phase<5.0) return 1.0; // hold — the pause, the relief
  if(phase<10.0) return 1.0-smoothstep(5,10,phase); // exhale
  return 0.0; // rest
}

function smoothstep(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}

let start=performance.now();
function draw(){
  const t=(performance.now()-start)*0.001;
  gl.viewport(0,0,W,H);
  // Very subtle fade instead of full clear — ghostly trails
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(uTime,t);
  gl.uniform1f(uBreath,breathValue(t));
  gl.uniform2f(uRes,W,H);
  gl.drawArrays(gl.POINTS,0,N);
  requestAnimationFrame(draw);
}
draw();

window.addEventListener('resize',()=>{
  c.width=window.innerWidth;c.height=window.innerHeight;
  gl.viewport(0,0,c.width,c.height);
});
</script>
</body></html>
