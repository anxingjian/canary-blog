<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 100 — From Seed to Tree</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
</head>
<body>
<script>
var GROWTH_DURATION = 18000;
var MAX_DEPTH_BRANCH = 10;
var MAX_DEPTH_ROOT = 8;
var branches = [];
var particles = [];
var startTime;
var growthComplete = false;
var noiseOff;

function setup() {
  createCanvas(windowWidth, windowHeight);
  noiseOff = random(1000);
  startTime = millis();
  buildTree();
}

function buildTree() {
  branches = [];
  particles = [];
  var cx = width / 2;
  var cy = height * 0.52;
  genBranch(cx, cy, -HALF_PI, height * 0.16, 0, MAX_DEPTH_BRANCH, true);
  genBranch(cx, cy, HALF_PI, height * 0.1, 0, MAX_DEPTH_ROOT, false);
}

function genBranch(x, y, angle, len, depth, maxD, up) {
  if (depth >= maxD || len < 1.5) return;
  
  var n = noise(x * 0.003 + noiseOff, y * 0.003, depth * 0.4);
  var aOff = map(n, 0, 1, -0.35, 0.35) * map(depth, 0, maxD, 0.6, 1.4);
  angle += aOff;
  
  var midAngle = angle + noise(x * 0.01, depth) * 0.2 - 0.1;
  var mx = x + cos(midAngle) * len * 0.5;
  var my = y + sin(midAngle) * len * 0.5;
  var x2 = mx + cos(angle) * len * 0.5;
  var y2 = my + sin(angle) * len * 0.5;
  
  var w = map(depth, 0, maxD, up ? 7 : 5.5, 0.4);
  var growOrder = depth + random(0.4);
  
  branches.push({x1:x, y1:y, x2:mx, y2:my, weight:w*1.02, depth:depth, maxD:maxD, isBranch:up, growOrder:growOrder, totalOrders:maxD});
  branches.push({x1:mx, y1:my, x2:x2, y2:y2, weight:w, depth:depth, maxD:maxD, isBranch:up, growOrder:growOrder, totalOrders:maxD});
  
  if (depth >= maxD - 2 && random() < 0.5) {
    particles.push({ox:x2, oy:y2, x:x2, y:y2, vx:random(-0.2,0.2), vy:up?random(-0.6,-0.1):random(0.1,0.4), life:random(150,255), maxLife:255, size:random(1.5,4), isBranch:up, phase:random(TWO_PI)});
  }
  
  var nKids = depth < 2 ? floor(random(2,4)) : (random() < 0.7 ? 2 : floor(random(1,4)));
  var shrink = up ? random(0.58,0.72) : random(0.5,0.68);
  
  for (var i = 0; i < nKids; i++) {
    var spread = up ? random(0.25,0.65) : random(0.3,0.75);
    var cAngle = angle + (i-(nKids-1)/2)*spread + random(-0.1,0.1);
    genBranch(x2, y2, cAngle, len*shrink, depth+1, maxD, up);
  }
}

function draw() {
  background(0);
  
  var elapsed = millis() - startTime;
  var progress = min(elapsed / GROWTH_DURATION, 1.0);
  if (progress >= 1.0) growthComplete = true;
  
  var breathe = growthComplete ? map(sin(millis()*0.0008), -1, 1, 0.7, 1.0) : 1.0;
  
  for (var i = 0; i < branches.length; i++) {
    var b = branches[i];
    var bp = map(b.growOrder, 0, b.totalOrders, 0, 0.82);
    var vis = constrain(map(progress, bp, bp+0.18, 0, 1), 0, 1);
    if (vis <= 0) continue;
    
    var a = vis * breathe;
    var t = b.depth / b.maxD;
    
    var r, g, bl;
    if (b.isBranch) {
      if (t < 0.5) {
        r = lerp(212,242,t*2); g = lerp(168,216,t*2); bl = lerp(67,168,t*2);
      } else {
        var bt = (t-0.5)*2*0.7;
        r = lerp(242,74,bt); g = lerp(216,156,bt); bl = lerp(168,219,bt);
      }
    } else {
      r = lerp(212,199,t); g = lerp(168,90,t); bl = lerp(67,90,t);
    }
    
    // Outer glow
    stroke(r, g, bl, a*40);
    strokeWeight(b.weight*vis*3);
    line(b.x1, b.y1, b.x2, b.y2);
    // Mid
    stroke(r, g, bl, a*100);
    strokeWeight(b.weight*vis*1.6);
    line(b.x1, b.y1, b.x2, b.y2);
    // Core
    stroke(r, g, bl, a*230);
    strokeWeight(b.weight*vis);
    line(b.x1, b.y1, b.x2, b.y2);
    // Hot center
    if (b.weight > 3) {
      stroke(lerp(r,255,0.5), lerp(g,245,0.5), lerp(bl,220,0.5), a*120);
      strokeWeight(b.weight*vis*0.25);
      line(b.x1, b.y1, b.x2, b.y2);
    }
  }
  
  // Particles
  if (elapsed > GROWTH_DURATION * 0.65) {
    noStroke();
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx + sin(millis()*0.002 + p.phase)*0.3;
      p.y += p.vy;
      p.life -= 0.4;
      if (p.life <= 0) { p.x = p.ox+random(-5,5); p.y = p.oy+random(-5,5); p.life = random(150,255); }
      var pa = (p.life/p.maxLife)*breathe;
      var ps = p.size*pa;
      if (p.isBranch) {
        fill(74,156,219, pa*50); circle(p.x, p.y, ps*3);
        fill(200,220,255, pa*180); circle(p.x, p.y, ps);
      } else {
        fill(199,90,90, pa*50); circle(p.x, p.y, ps*3);
        fill(255,200,150, pa*180); circle(p.x, p.y, ps);
      }
    }
  }
  
  // Seed
  var cx = width/2, cy = height*0.52;
  var sg = (sin(millis()*0.0015)*0.3+0.7)*breathe;
  noStroke();
  fill(242,216,168, sg*25); circle(cx, cy, 28);
  fill(242,216,168, sg*70); circle(cx, cy, 10);
  fill(255,250,240, sg*200); circle(cx, cy, 4);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  noiseOff = random(1000);
  buildTree();
}
</script>
</body>
</html>
