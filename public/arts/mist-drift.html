<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂 / Drift</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #F2EDE8; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, mouseX = 0, mouseY = 0;
const palette = {
  base: '#F2EDE8',
  teal: '#4A6670',
  plum: '#8B4D6E',
  dark: '#2C3E3E',
  sand: '#D4A574'
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// Mist layers — each layer is a set of large soft blobs drifting
class MistLayer {
  constructor(count, color, alpha, speed, yBase, yRange, sizeRange) {
    this.blobs = [];
    this.speed = speed;
    this.color = color;
    this.alpha = alpha;
    for (let i = 0; i < count; i++) {
      this.blobs.push({
        x: Math.random() * W * 1.5 - W * 0.25,
        y: yBase + (Math.random() - 0.5) * yRange,
        r: sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]),
        vx: (0.2 + Math.random() * 0.5) * speed,
        phase: Math.random() * Math.PI * 2,
        freq: 0.001 + Math.random() * 0.002
      });
    }
  }
  update(t) {
    const mx = (mouseX / W - 0.5) * 30;
    const my = (mouseY / H - 0.5) * 15;
    for (const b of this.blobs) {
      b.x += b.vx + mx * 0.02 * this.speed;
      b.y += Math.sin(t * b.freq + b.phase) * 0.3 + my * 0.01;
      if (b.x > W + b.r * 2) b.x = -b.r * 2;
      if (b.x < -b.r * 2) b.x = W + b.r * 2;
    }
  }
  draw() {
    for (const b of this.blobs) {
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      grad.addColorStop(0, this.color + alphaHex(this.alpha));
      grad.addColorStop(0.6, this.color + alphaHex(this.alpha * 0.4));
      grad.addColorStop(1, this.color + '00');
      ctx.fillStyle = grad;
      ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
  }
}

function alphaHex(a) {
  return Math.round(Math.min(1, Math.max(0, a)) * 255).toString(16).padStart(2, '0');
}

// Create layers — back to front
const layers = [
  // Deep dark layer — slow, large, barely visible
  new MistLayer(8, palette.dark, 0.15, 0.3, H * 0.55, H * 0.4, [200, 400]),
  // Mid teal layer — primary mist
  new MistLayer(12, palette.teal, 0.2, 0.5, H * 0.5, H * 0.5, [150, 350]),
  // Plum warm shadows — fewer, concentrated
  new MistLayer(6, palette.plum, 0.18, 0.4, H * 0.6, H * 0.3, [180, 320]),
  // Sand light — bright warm patches breaking through
  new MistLayer(5, palette.sand, 0.25, 0.6, H * 0.35, H * 0.4, [120, 280]),
  // Front veil — lightest, fastest
  new MistLayer(10, '#FFFFFF', 0.12, 0.7, H * 0.45, H * 0.6, [100, 300]),
];

// Subtle light rays from top-right
function drawLightRays(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 4; i++) {
    const angle = -0.3 + i * 0.15 + Math.sin(t * 0.0005 + i) * 0.05;
    const originX = W * 0.85;
    const originY = -50;
    const len = H * 1.5;
    const width = 40 + i * 20;
    ctx.beginPath();
    ctx.moveTo(originX, originY);
    ctx.lineTo(originX + Math.cos(angle) * len - width, originY + Math.sin(angle + Math.PI/2) * len);
    ctx.lineTo(originX + Math.cos(angle) * len + width, originY + Math.sin(angle + Math.PI/2) * len);
    ctx.closePath();
    const grad = ctx.createLinearGradient(originX, originY, originX + Math.cos(angle) * len, originY + Math.sin(angle + Math.PI/2) * len);
    grad.addColorStop(0, palette.sand + '18');
    grad.addColorStop(1, palette.sand + '00');
    ctx.fillStyle = grad;
    ctx.fill();
  }
  ctx.restore();
}

let t = 0;
function frame() {
  t++;
  // Clear with base color
  ctx.fillStyle = palette.base;
  ctx.fillRect(0, 0, W, H);
  
  // Light rays beneath mist
  drawLightRays(t);
  
  // Update and draw layers
  for (const layer of layers) {
    layer.update(t);
    layer.draw();
  }
  
  // Vignette
  const vgrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vgrad.addColorStop(0, 'transparent');
  vgrad.addColorStop(1, palette.dark + '30');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, W, H);
  
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
