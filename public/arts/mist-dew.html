<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凝 / Dew</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0F0F23; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
let mouse = { x: -1000, y: -1000, active: false };
let drops = [];
let breathTrail = [];
const MAX_DROPS = 600;

const PALETTE = {
  night: '#0F0F23',
  silver: '#C8CED3',
  red: '#FF4757',
  frost: '#DFE6E9',
  violet: '#7158E2'
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

class Drop {
  constructor(x, y, fromBreath) {
    this.x = x;
    this.y = y;
    this.r = 0.3 + Math.random() * 0.5;
    this.maxR = 2 + Math.random() * 6;
    this.growRate = 0.01 + Math.random() * 0.03;
    this.fromBreath = fromBreath;
    this.age = 0;
    this.opacity = 0;
    this.merged = false;
    // slight wobble
    this.phase = Math.random() * Math.PI * 2;
    this.freq = 0.5 + Math.random() * 1.5;
  }

  grow(dt) {
    this.age += dt;
    if (this.r < this.maxR) {
      this.r += this.growRate * dt * 60;
    }
    this.opacity = Math.min(1, this.age * 0.02);
  }

  draw() {
    if (this.merged) return;
    const r = this.r;
    const x = this.x;
    const y = this.y;
    const a = this.opacity;

    // main droplet body - silver/frost
    const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
    if (this.fromBreath) {
      grad.addColorStop(0, `rgba(255, 71, 87, ${a * 0.15})`);
      grad.addColorStop(0.4, `rgba(200, 206, 211, ${a * 0.25})`);
      grad.addColorStop(1, `rgba(200, 206, 211, ${a * 0.05})`);
    } else {
      grad.addColorStop(0, `rgba(223, 230, 233, ${a * 0.35})`);
      grad.addColorStop(0.5, `rgba(200, 206, 211, ${a * 0.2})`);
      grad.addColorStop(1, `rgba(200, 206, 211, ${a * 0.02})`);
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // highlight - top left
    if (r > 1.5) {
      ctx.beginPath();
      ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${a * 0.6})`;
      ctx.fill();
    }

    // violet refraction at bottom
    if (r > 3) {
      const shimmer = Math.sin(this.age * this.freq + this.phase) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(x + r * 0.15, y + r * 0.3, r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(113, 88, 226, ${a * 0.3 * shimmer})`;
      ctx.fill();
    }

    // ring/edge
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200, 206, 211, ${a * 0.15})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

// surface texture - cold metal grid
function drawSurface() {
  // subtle grid lines suggesting a metal surface
  ctx.strokeStyle = 'rgba(200, 206, 211, 0.03)';
  ctx.lineWidth = 0.5;
  const spacing = 40;
  for (let x = 0; x < W; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// ambient condensation - drops appear naturally
function ambientCondensation() {
  if (drops.length < MAX_DROPS && Math.random() < 0.15) {
    drops.push(new Drop(
      Math.random() * W,
      Math.random() * H,
      false
    ));
  }
}

// breath condensation near mouse
function breathCondensation() {
  if (!mouse.active) return;
  const count = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 80;
    const x = mouse.x + Math.cos(angle) * dist;
    const y = mouse.y + Math.sin(angle) * dist;
    if (x > 0 && x < W && y > 0 && y < H && drops.length < MAX_DROPS) {
      const d = new Drop(x, y, true);
      d.growRate *= 2; // breath drops grow faster
      drops.push(d);
    }
  }

  // breath trail
  breathTrail.push({ x: mouse.x, y: mouse.y, age: 0, opacity: 0.4 });
}

// merge nearby drops
function mergeDrops() {
  for (let i = 0; i < drops.length; i++) {
    if (drops[i].merged) continue;
    for (let j = i + 1; j < drops.length; j++) {
      if (drops[j].merged) continue;
      const dx = drops[i].x - drops[j].x;
      const dy = drops[i].y - drops[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const touchDist = drops[i].r + drops[j].r;
      if (dist < touchDist * 0.8) {
        // merge into the bigger one
        const a = drops[i], b = drops[j];
        if (a.r >= b.r) {
          a.r = Math.min(a.maxR * 1.5, Math.sqrt(a.r * a.r + b.r * b.r));
          a.maxR = Math.max(a.maxR, a.r + 1);
          b.merged = true;
        } else {
          b.r = Math.min(b.maxR * 1.5, Math.sqrt(a.r * a.r + b.r * b.r));
          b.maxR = Math.max(b.maxR, b.r + 1);
          a.merged = true;
        }
      }
    }
  }
  drops = drops.filter(d => !d.merged);
}

// gravity slide for large drops
function gravitySlide(dt) {
  for (const d of drops) {
    if (d.r > 5) {
      d.y += (d.r - 5) * 0.02 * dt * 60;
      // leave trail drops
      if (Math.random() < 0.02) {
        drops.push(new Drop(d.x + (Math.random() - 0.5) * 2, d.y - d.r, false));
      }
    }
    // remove if off screen
    if (d.y > H + 20) d.merged = true;
  }
}

function drawBreathTrail() {
  for (let i = breathTrail.length - 1; i >= 0; i--) {
    const t = breathTrail[i];
    t.age += 1;
    t.opacity -= 0.005;
    if (t.opacity <= 0) {
      breathTrail.splice(i, 1);
      continue;
    }
    ctx.beginPath();
    ctx.arc(t.x, t.y, 30 + t.age * 0.5, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 30 + t.age * 0.5);
    g.addColorStop(0, `rgba(255, 71, 87, ${t.opacity * 0.15})`);
    g.addColorStop(1, `rgba(255, 71, 87, 0)`);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

let lastTime = 0;
let frame = 0;

function render(time) {
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;
  frame++;

  // dark background with subtle gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0F0F23');
  bg.addColorStop(0.7, '#0F0F23');
  bg.addColorStop(1, '#141428');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawSurface();

  // ambient dawn glow at top - violet
  const dawn = ctx.createRadialGradient(W * 0.7, 0, 0, W * 0.7, 0, H * 0.5);
  const dawnPulse = Math.sin(time * 0.0003) * 0.02 + 0.04;
  dawn.addColorStop(0, `rgba(113, 88, 226, ${dawnPulse})`);
  dawn.addColorStop(1, 'rgba(113, 88, 226, 0)');
  ctx.fillStyle = dawn;
  ctx.fillRect(0, 0, W, H);

  ambientCondensation();
  if (frame % 3 === 0) breathCondensation();
  if (frame % 30 === 0) mergeDrops();
  gravitySlide(dt);

  drawBreathTrail();

  // draw drops sorted by size (small on top)
  drops.sort((a, b) => b.r - a.r);
  for (const d of drops) {
    d.grow(dt);
    d.draw();
  }

  drops = drops.filter(d => !d.merged);

  requestAnimationFrame(render);
}

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

requestAnimationFrame(render);
</script>
</body>
</html>
