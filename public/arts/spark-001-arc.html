<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>弧 / Arc — 电 / Spark 001</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0612; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<script>
// 弧 / Arc — 电弧在两极之间的暴力跳跃
// 模拟介质击穿：电弧不走直线，而是沿着电离空气的随机路径传播

let arcs = [];
let electrodeTop, electrodeBot;
let lastDischarge = 0;
let dischargeInterval;
let glowParticles = [];
let ambientField = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  
  electrodeTop = createVector(width / 2, height * 0.12);
  electrodeBot = createVector(width / 2, height * 0.88);
  dischargeInterval = random(800, 2000);
  
  // 环境电场粒子
  for (let i = 0; i < 120; i++) {
    ambientField.push({
      x: random(width),
      y: random(height),
      vx: random(-0.3, 0.3),
      vy: random(-0.5, 0.5),
      size: random(0.5, 2),
      alpha: random(5, 20),
      hue: random(220, 280)
    });
  }
}

function draw() {
  // 深紫黑背景，带微弱余辉
  background(268, 70, 5, 12);
  
  drawAmbientField();
  drawElectrodes();
  
  // 周期性放电
  if (millis() - lastDischarge > dischargeInterval) {
    triggerDischarge();
    lastDischarge = millis();
    dischargeInterval = random(600, 2500);
  }
  
  // 更新和绘制电弧
  for (let i = arcs.length - 1; i >= 0; i--) {
    arcs[i].life -= 1;
    drawArc(arcs[i]);
    if (arcs[i].life <= 0) arcs.splice(i, 1);
  }
  
  // 辉光粒子
  updateGlowParticles();
  
  // 电极间的预击穿微光
  drawPreBreakdown();
}

function triggerDischarge() {
  // 主电弧
  let mainArc = generateArcPath(electrodeTop, electrodeBot, 12);
  arcs.push({ path: mainArc, life: 18, maxLife: 18, type: 'main' });
  
  // 分叉支弧
  let branchCount = floor(random(2, 5));
  for (let b = 0; b < branchCount; b++) {
    let startIdx = floor(random(mainArc.length * 0.2, mainArc.length * 0.7));
    let startPt = mainArc[startIdx];
    let endPt = createVector(
      startPt.x + random(-width * 0.25, width * 0.25),
      startPt.y + random(height * 0.05, height * 0.2)
    );
    let branchArc = generateArcPath(startPt, endPt, 6);
    arcs.push({ path: branchArc, life: 12, maxLife: 12, type: 'branch' });
  }
  
  // 放电时产生辉光粒子
  for (let i = 0; i < 30; i++) {
    let pathPt = mainArc[floor(random(mainArc.length))];
    glowParticles.push({
      x: pathPt.x + random(-10, 10),
      y: pathPt.y + random(-10, 10),
      vx: random(-2, 2),
      vy: random(-2, 2),
      life: random(20, 60),
      maxLife: 60,
      size: random(1, 4),
      hue: random(200, 240)
    });
  }
}

function generateArcPath(start, end, segments) {
  let path = [];
  let dx = end.x - start.x;
  let dy = end.y - start.y;
  let dist = sqrt(dx * dx + dy * dy);
  
  // 电弧路径生成 — Fractal displacement (介质击穿模型)
  path.push(start.copy());
  path.push(end.copy());
  
  for (let iter = 0; iter < segments; iter++) {
    let newPath = [];
    for (let i = 0; i < path.length - 1; i++) {
      newPath.push(path[i]);
      let mid = p5.Vector.lerp(path[i], path[i + 1], 0.5);
      // 横向偏移量随段长衰减
      let segLen = p5.Vector.dist(path[i], path[i + 1]);
      let displacement = segLen * 0.35;
      // 偏移垂直于连接方向
      let angle = atan2(path[i + 1].y - path[i].y, path[i + 1].x - path[i].x) + HALF_PI;
      mid.x += cos(angle) * random(-displacement, displacement);
      mid.y += sin(angle) * random(-displacement, displacement);
      newPath.push(mid);
    }
    newPath.push(path[path.length - 1]);
    path = newPath;
    if (path.length > 200) break; // 防止过密
  }
  
  return path;
}

function drawArc(arc) {
  let alpha = map(arc.life, 0, arc.maxLife, 0, 100);
  let weight = arc.type === 'main' ? 3 : 1.5;
  
  // 外层辉光 — 暖橙等离子体边缘
  push();
  noFill();
  strokeWeight(weight + 6);
  stroke(25, 80, 70, alpha * 0.15);
  beginShape();
  for (let pt of arc.path) vertex(pt.x, pt.y);
  endShape();
  
  // 中层 — 电蓝
  strokeWeight(weight + 2);
  stroke(210, 85, 90, alpha * 0.4);
  beginShape();
  for (let pt of arc.path) vertex(pt.x, pt.y);
  endShape();
  
  // 核心 — 白光
  strokeWeight(weight);
  stroke(210, 10, 100, alpha * 0.9);
  beginShape();
  for (let pt of arc.path) vertex(pt.x, pt.y);
  endShape();
  pop();
  
  // 节点辉光
  if (arc.life > arc.maxLife * 0.5) {
    for (let i = 0; i < arc.path.length; i += 8) {
      let pt = arc.path[i];
      noStroke();
      fill(210, 60, 100, alpha * 0.1);
      ellipse(pt.x, pt.y, random(8, 20));
    }
  }
}

function drawElectrodes() {
  // 上极板
  push();
  noStroke();
  // 极板金属质感
  let gradient = drawingContext;
  fill(220, 15, 60, 80);
  rectMode(CENTER);
  rect(electrodeTop.x, electrodeTop.y, width * 0.3, 8, 4);
  // 极点发光
  fill(210, 40, 100, 30 + sin(frameCount * 0.05) * 10);
  ellipse(electrodeTop.x, electrodeTop.y + 4, 20, 20);
  
  // 下极板
  fill(220, 15, 60, 80);
  rect(electrodeBot.x, electrodeBot.y, width * 0.3, 8, 4);
  fill(210, 40, 100, 30 + sin(frameCount * 0.05 + PI) * 10);
  ellipse(electrodeBot.x, electrodeBot.y - 4, 20, 20);
  pop();
}

function drawPreBreakdown() {
  // 预击穿 — 极间微弱的电离路径暗示
  let t = millis() * 0.001;
  push();
  noFill();
  strokeWeight(0.5);
  for (let i = 0; i < 3; i++) {
    let alpha = 8 + sin(t * 2 + i) * 5;
    stroke(220, 50, 80, alpha);
    beginShape();
    let steps = 30;
    for (let s = 0; s <= steps; s++) {
      let frac = s / steps;
      let x = lerp(electrodeTop.x, electrodeBot.x, frac) + noise(frac * 3, t + i * 10) * 60 - 30;
      let y = lerp(electrodeTop.y, electrodeBot.y, frac);
      vertex(x, y);
    }
    endShape();
  }
  pop();
}

function drawAmbientField() {
  noStroke();
  for (let p of ambientField) {
    p.x += p.vx + sin(frameCount * 0.01 + p.y * 0.01) * 0.2;
    p.y += p.vy;
    
    // 被电弧吸引
    let distToCenter = abs(p.x - width / 2);
    if (distToCenter < width * 0.2) {
      p.vx += (width / 2 - p.x) * 0.0001;
    }
    
    // 边界循环
    if (p.x < 0) p.x = width;
    if (p.x > width) p.x = 0;
    if (p.y < 0) p.y = height;
    if (p.y > height) p.y = 0;
    
    fill(p.hue, 40, 60, p.alpha);
    ellipse(p.x, p.y, p.size);
  }
}

function updateGlowParticles() {
  noStroke();
  for (let i = glowParticles.length - 1; i >= 0; i--) {
    let p = glowParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= 1;
    
    let alpha = map(p.life, 0, p.maxLife, 0, 60);
    fill(p.hue, 70, 95, alpha);
    ellipse(p.x, p.y, p.size);
    
    if (p.life <= 0) glowParticles.splice(i, 1);
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  electrodeTop = createVector(width / 2, height * 0.12);
  electrodeBot = createVector(width / 2, height * 0.88);
}
</script>
</body>
</html>
