<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confluence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false });

let W, H;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  gl.viewport(0, 0, W, H);
  // Recreate FBOs on resize
  if(fbo0) { gl.deleteTexture(fbo0.tex); gl.deleteFramebuffer(fbo0.fb); }
  if(fbo1) { gl.deleteTexture(fbo1.tex); gl.deleteFramebuffer(fbo1.fb); }
  fbo0 = createFBO(); fbo1 = createFBO();
}

const vsrc = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){v_uv=a_pos*0.5+0.5;gl_Position=vec4(a_pos,0,1);}`;

const fsrc = `
precision highp float;
varying vec2 v_uv;
uniform vec2 u_res;
uniform float u_time;
uniform sampler2D u_prev;

#define PI 3.14159265

float hash(vec2 p){
  p=fract(p*vec2(123.34,456.21));
  p+=dot(p,p+45.32);
  return fract(p.x*p.y);
}

float noise2d(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 s=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return a+(b-a)*s.x+(c-a)*s.y+(a-b-c+d)*s.x*s.y;
}

// Quadratic bezier
vec2 bezier(vec2 a, vec2 b, vec2 c, float t){
  vec2 ab=mix(a,b,t);
  vec2 bc=mix(b,c,t);
  return mix(ab,bc,t);
}

void main(){
  vec2 px=v_uv*u_res;
  float t=u_time;

  vec3 prev=texture2D(u_prev,v_uv).rgb;
  vec3 bg=vec3(10.0/255.0);
  vec3 col=mix(prev,bg,0.06);

  vec2 conv=vec2(u_res.x*0.72, u_res.y*0.5);
  vec2 exitPt=vec2(u_res.x*1.1, u_res.y*0.5);

  // Convergence glow
  float pulse=1.0+sin(t*1.0)*0.15;
  float gd=length(px-conv);
  col+=vec3(0.784,0.824,1.0)*exp(-gd*gd/(1600.0*pulse))*0.12;

  // 200 particles, two streams
  for(int i=0;i<200;i++){
    float fi=float(i);
    float stream=fi<100.0?0.0:1.0;

    float s1=hash(vec2(fi*1.731,stream*7.0+0.1));
    float s2=hash(vec2(fi*2.913,stream*3.0+0.7));
    float s3=hash(vec2(fi*0.517,stream*11.0+3.1));

    // Start position (left side, offscreen)
    vec2 start=vec2(-s1*u_res.x*0.3,
      stream<0.5
        ? u_res.y*(0.15+s2*0.25)
        : u_res.y*(0.6+s2*0.25));

    // Control point (curved path toward convergence)
    float midX=u_res.x*(0.2+s3*0.3);
    float midY=mix(start.y, conv.y, 0.4+s1*0.2);
    midY+=noise2d(vec2(fi*0.1,t*0.3))*30.0-15.0;
    vec2 ctrl=vec2(midX, midY);

    // Lifecycle
    float speed=0.4+s1*0.3;
    float maxT_val=500.0+s2*200.0;
    float life=mod(t*60.0*speed+fi*37.0,maxT_val)/maxT_val;

    // Path: bezier to convergence, then straight out
    vec2 pp;
    bool merged=false;
    if(life<0.7){
      float bt=life/0.7;
      pp=bezier(start,ctrl,conv,bt);
      // Add noise wobble
      float n=noise2d(pp*0.003+vec2(t*0.3,fi*0.1));
      pp+=vec2(cos(n*PI*2.0),sin(n*PI*2.0))*3.0;
    } else {
      merged=true;
      float postT=(life-0.7)/0.3;
      pp=mix(conv,exitPt,postT);
      float n=noise2d(pp*0.003+vec2(t*0.2,fi*0.1));
      pp.y+=sin(n*PI*2.0)*5.0;
    }

    float d=length(px-pp);
    float sz=0.5+s1*1.0;

    // Fade in and out
    float alpha=smoothstep(0.0,0.05,life)*smoothstep(1.0,0.92,life);
    float ptAlpha=smoothstep(sz+1.5,max(0.0,sz-0.5),d)*alpha*0.4;

    vec3 pCol;
    if(merged){
      pCol=vec3(0.863,0.863,0.941);
    } else if(stream<0.5){
      pCol=vec3(0.392,0.627,1.0);
    } else {
      pCol=vec3(1.0,0.549,0.314);
    }
    col+=pCol*ptAlpha;
  }

  gl_FragColor=vec4(col,1.0);
}`;

function makeShader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,makeShader(gl.VERTEX_SHADER,vsrc));
gl.attachShader(prog,makeShader(gl.FRAGMENT_SHADER,fsrc));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(prog,'u_res');
const uTime=gl.getUniformLocation(prog,'u_time');
const uPrev=gl.getUniformLocation(prog,'u_prev');

function createFBO(){
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return{tex,fb};
}
let fbo0=null,fbo1=null;
resize();
let ping=0,time=0;

function render(){
  time+=0.016;
  gl.uniform2f(uRes,W,H);
  gl.uniform1f(uTime,time);

  const src=ping===0?fbo0:fbo1;
  const dst=ping===0?fbo1:fbo0;
  gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fb);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,src.tex);
  gl.uniform1i(uPrev,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.bindTexture(gl.TEXTURE_2D,dst.tex);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  ping=1-ping;
  requestAnimationFrame(render);
}
render();
</script>
</body></html>
