<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>织 / Weave</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a0a; }
  canvas { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>
<script>
// 织 / Weave — living flow field
// Threads drift through a noise field, leaving traces that slowly fade

const threads = [];
const NUM_THREADS = 120;
let noiseScale = 0.003;
let timeOffset = 0;
let fadeLayer;

// Palette: warm earth + cold ink
const colors = [
  [200, 160, 100],  // amber
  [180, 130, 80],   // copper
  [140, 100, 65],   // dark gold
  [90, 120, 100],   // moss
  [70, 90, 110],    // steel blue
  [50, 65, 80],     // dark slate
  [190, 175, 155],  // parchment
  [160, 80, 70],    // terracotta
];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(min(2, window.devicePixelRatio || 1));
  
  fadeLayer = createGraphics(width, height);
  fadeLayer.background(10, 10, 12);
  
  for (let i = 0; i < NUM_THREADS; i++) {
    threads.push(makeThread());
  }
  
  background(10, 10, 12);
}

function makeThread() {
  let col = random(colors);
  return {
    x: random(width),
    y: random(height),
    prevX: 0,
    prevY: 0,
    col: col,
    alpha: random(15, 50),
    weight: random(0.5, 3),
    speed: random(0.8, 2.5),
    life: 0,
    maxLife: random(200, 800),
    noiseZ: random(1000),
  };
}

function draw() {
  // Slow fade: draw semi-transparent background on fade layer
  fadeLayer.noStroke();
  fadeLayer.fill(10, 10, 12, 4);
  fadeLayer.rect(0, 0, width, height);
  
  // Draw threads on fade layer
  for (let t of threads) {
    t.prevX = t.x;
    t.prevY = t.y;
    
    // Flow field with time evolution
    let angle = noise(
      t.x * noiseScale,
      t.y * noiseScale,
      timeOffset + t.noiseZ * 0.0005
    ) * TAU * 3;
    
    // Domain warping - second noise layer
    let warp = noise(
      t.x * noiseScale * 2 + 500,
      t.y * noiseScale * 2 + 500,
      timeOffset * 0.7
    ) * PI;
    angle += warp * 0.5;
    
    t.x += cos(angle) * t.speed;
    t.y += sin(angle) * t.speed;
    
    // Life cycle
    t.life++;
    let lifeFade = 1;
    if (t.life < 30) lifeFade = t.life / 30;
    if (t.life > t.maxLife - 50) lifeFade = (t.maxLife - t.life) / 50;
    lifeFade = max(0, lifeFade);
    
    // Draw
    fadeLayer.stroke(t.col[0], t.col[1], t.col[2], t.alpha * lifeFade);
    fadeLayer.strokeWeight(t.weight);
    fadeLayer.line(t.prevX, t.prevY, t.x, t.y);
    
    // Respawn if out of bounds or expired
    if (t.x < -50 || t.x > width + 50 || t.y < -50 || t.y > height + 50 || t.life > t.maxLife) {
      let nt = makeThread();
      t.x = nt.x;
      t.y = nt.y;
      t.prevX = t.x;
      t.prevY = t.y;
      t.col = nt.col;
      t.alpha = nt.alpha;
      t.weight = nt.weight;
      t.speed = nt.speed;
      t.life = 0;
      t.maxLife = nt.maxLife;
      t.noiseZ = nt.noiseZ;
    }
  }
  
  // Copy fade layer to main canvas
  image(fadeLayer, 0, 0);
  
  // Occasional bright particles at convergence points
  if (frameCount % 8 === 0) {
    let px = random(width);
    let py = random(height);
    let a1 = noise(px * noiseScale, py * noiseScale, timeOffset) * TAU * 3;
    let a2 = noise((px + 10) * noiseScale, (py + 10) * noiseScale, timeOffset) * TAU * 3;
    if (abs(a1 - a2) > 2) {
      noStroke();
      fill(255, 220, 180, random(10, 30));
      ellipse(px, py, random(2, 6));
    }
  }
  
  timeOffset += 0.002;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  fadeLayer = createGraphics(width, height);
  fadeLayer.background(10, 10, 12);
}
</script>
</body>
</html>
