<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undercurrent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080a10; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Undercurrent — invisible currents beneath a still surface
// Domain-warped FBM flow, indigo-teal palette + amber undertow

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vsrc = `attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const fsrc = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;

// simplex-style hash
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 perm(vec4 x){ return mod289(((x*34.0)+1.0)*x); }

float noise(vec3 p){
  vec3 a = floor(p);
  vec3 d = p - a;
  d = d * d * (3.0 - 2.0 * d);
  vec4 b = a.xxyy + vec4(0.0,1.0,0.0,1.0);
  vec4 k1 = perm(b.xyxy);
  vec4 k2 = perm(k1.xyxy + b.zzww);
  vec4 c = k2 + a.zzzz;
  vec4 k3 = perm(c);
  vec4 k4 = perm(c + 1.0);
  vec4 o1 = fract(k3 * (1.0/41.0));
  vec4 o2 = fract(k4 * (1.0/41.0));
  vec4 o3 = o2 * d.z + o1 * (1.0 - d.z);
  vec2 o4 = o3.yw * d.x + o3.xz * (1.0 - d.x);
  return o4.y * d.y + o4.x * (1.0 - d.y);
}

float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  vec3 shift = vec3(100.0);
  for(int i = 0; i < 6; i++){
    v += a * noise(p);
    p = p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

// domain warping: fbm of fbm
float warp(vec2 uv, float t){
  vec3 p = vec3(uv * 3.0, t * 0.08);
  float q1 = fbm(p + vec3(0.0, 0.0, 0.0));
  float q2 = fbm(p + vec3(5.2, 1.3, 0.0));
  float r1 = fbm(p + vec3(q1 * 4.0, q2 * 4.0, 0.0));
  float r2 = fbm(p + vec3(q1 * 4.0 + 1.7, q2 * 4.0 + 9.2, 0.0));
  return fbm(p + vec3(r1 * 3.5, r2 * 3.5, t * 0.03));
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;
  vec2 st = vec2(uv.x * aspect, uv.y);

  float t = u_time;
  float w = warp(st, t);
  float w2 = warp(st + vec2(0.3, -0.2), t + 50.0);

  // Palette: deep indigo base → muted teal midtones → amber accent
  // Analogous cool: indigo(240°) → teal(190°) → slate(210°)
  // Warm accent: amber(35°) only where flows converge

  vec3 deep    = vec3(0.031, 0.039, 0.063);  // #080a10 near-black indigo
  vec3 indigo  = vec3(0.08, 0.09, 0.18);     // dark indigo
  vec3 teal    = vec3(0.07, 0.16, 0.19);     // muted teal
  vec3 slate   = vec3(0.12, 0.14, 0.18);     // blue-grey
  vec3 amber   = vec3(0.35, 0.22, 0.08);     // low-sat amber

  // Layer 1: base indigo field
  vec3 col = mix(deep, indigo, smoothstep(0.2, 0.7, w));

  // Layer 2: teal currents in mid-range
  col = mix(col, teal, smoothstep(0.35, 0.55, w) * 0.7);

  // Layer 3: slate ridges where flows pile up
  float ridge = abs(w - 0.5) < 0.08 ? 1.0 : 0.0;
  ridge = smoothstep(0.06, 0.0, abs(w - 0.5));
  col = mix(col, slate, ridge * 0.4);

  // Layer 4: amber undertow — appears only in convergence zones
  float convergence = smoothstep(0.58, 0.72, w) * smoothstep(0.55, 0.65, w2);
  col = mix(col, amber, convergence * 0.35);

  // subtle bright filament where both warps peak
  float filament = smoothstep(0.68, 0.73, w) * smoothstep(0.65, 0.70, w2);
  vec3 warmLight = vec3(0.55, 0.38, 0.15);
  col += warmLight * filament * 0.15;

  // vignette — darken edges
  vec2 vc = uv - 0.5;
  float vig = 1.0 - dot(vc, vc) * 1.2;
  col *= smoothstep(0.0, 0.8, vig);

  // very subtle film grain
  float grain = (noise(vec3(gl_FragCoord.xy * 0.5, t * 2.0)) - 0.5) * 0.03;
  col += grain;

  gl_FragColor = vec4(col, 1.0);
}
`;

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vs = createShader(gl.VERTEX_SHADER, vsrc);
const fs = createShader(gl.FRAGMENT_SHADER, fsrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

function draw(t) {
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
