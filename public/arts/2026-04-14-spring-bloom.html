<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF8F3; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui; }
  canvas { display: block; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  #info { position: absolute; bottom: 12px; right: 12px; font-size: 11px; color: #999; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<div id="info">Spring Bloom · Fidenza-style · Click to regenerate</div>
<script>
// Spring Bloom — Multi-origin growth with spring palette
// Technique: Flow field (radial + noise blend) → thick color blocks,
// collision detection, soft edges, light diffusion effect

const PALETTE = [
  // [r, g, b, weight] — spring awakening
  [255, 182, 193, 32],  // sakura pink (#FFB6C1)
  [255, 160, 180, 18],  // deeper cherry
  [176, 224, 230, 28],  // powder blue
  [135, 206, 250, 16],  // sky blue lighter
  [152, 251, 152, 24],  // pale green
  [144, 238, 144, 14],  // light green
  [255, 222, 89, 16],   // apricot yellow
  [255, 239, 165, 10],  // pale gold
  [221, 160, 221, 12],  // plum lavender
  [255, 250, 240, 8],   // floral white
  [240, 255, 240, 6],   // honeydew glow
];

// Build weighted color distribution
let weightedColors = [];
for (let p of PALETTE) {
  for (let i = 0; i < p[3]; i++) {
    weightedColors.push([p[0], p[1], p[2]]);
  }
}

function pickColor() {
  return weightedColors[Math.floor(Math.random() * weightedColors.length)];
}

let W, H, cols, rows, flowField;
const SCALE = 28;
const CELL = 7;
let collisionGrid;
let collisionW, collisionH;
let curves = [];
let seed;

function setup() {
  seed = Math.floor(Math.random() * 99999);
  randomSeed(seed);
  noiseSeed(seed);

  const aspect = 9 / 12;
  const maxH = windowHeight * 0.93;
  const maxW = windowWidth * 0.93;
  if (maxW / maxH > aspect) {
    H = Math.floor(maxH);
    W = Math.floor(H * aspect);
  } else {
    W = Math.floor(maxW);
    H = Math.floor(W / aspect);
  }

  createCanvas(W, H);
  pixelDensity(1);
  noLoop();

  cols = Math.ceil(W / SCALE);
  rows = Math.ceil(H / SCALE);

  collisionW = Math.ceil(W / CELL);
  collisionH = Math.ceil(H / CELL);
  collisionGrid = new Uint8Array(collisionW * collisionH);

  generateFlowField();
  generateCurves();
  drawAll();
}

function generateFlowField() {
  flowField = new Float32Array(cols * rows);
  const zOff = random(1000);
  const turbulence = random([0.5, 0.7, 0.9, 1.1]);
  
  // Pick 2-4 growth centers
  const numCenters = floor(random(2, 4.5));
  const centers = [];
  for (let i = 0; i < numCenters; i++) {
    centers.push({
      x: random(W * 0.15, W * 0.85),
      y: random(H * 0.15, H * 0.85),
      strength: random(0.6, 1.2)
    });
  }
  
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let px = x * SCALE;
      let py = y * SCALE;
      
      // Blend radial flow from multiple centers + noise
      let angle = 0;
      let angleWeight = 0;
      
      for (let center of centers) {
        let dx = px - center.x;
        let dy = py - center.y;
        let dist = sqrt(dx * dx + dy * dy);
        let influence = 1 / (1 + dist * 0.008);
        
        // Radial angle away from center
        let radialAngle = atan2(dy, dx) + random(-0.3, 0.3);
        angle += radialAngle * influence * center.strength;
        angleWeight += influence * center.strength;
      }
      
      if (angleWeight > 0) angle /= angleWeight;
      
      // Add noise texture
      let noiseFactor = noise(x * 0.05 * turbulence, y * 0.05 * turbulence, zOff);
      angle += (noiseFactor - 0.5) * TWO_PI * 0.7;
      
      flowField[y * cols + x] = angle;
    }
  }
}

function getAngle(x, y) {
  let col = constrain(Math.floor(x / SCALE), 0, cols - 1);
  let row = constrain(Math.floor(y / SCALE), 0, rows - 1);
  return flowField[row * cols + col];
}

function checkCollision(x, y, halfW) {
  let cx = Math.floor(x / CELL);
  let cy = Math.floor(y / CELL);
  let r = Math.ceil(halfW / CELL) + 1;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      let gx = cx + dx;
      let gy = cy + dy;
      if (gx >= 0 && gx < collisionW && gy >= 0 && gy < collisionH) {
        if (collisionGrid[gy * collisionW + gx]) return true;
      }
    }
  }
  return false;
}

function markCollision(x, y, halfW) {
  let cx = Math.floor(x / CELL);
  let cy = Math.floor(y / CELL);
  let r = Math.ceil(halfW / CELL);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      let gx = cx + dx;
      let gy = cy + dy;
      if (gx >= 0 && gx < collisionW && gy >= 0 && gy < collisionH) {
        collisionGrid[gy * collisionW + gx] = 1;
      }
    }
  }
}

function generateCurves() {
  const sizes = [
    { w: random(50, 85), prob: 0.18 },   // jumbo
    { w: random(28, 50), prob: 0.28 },   // large
    { w: random(16, 28), prob: 0.38 },   // medium
    { w: random(7, 16), prob: 0.16 },    // small
  ];

  const margin = 25;
  let attempts = 0;
  const maxAttempts = 4000;
  const maxCurves = 320;

  while (curves.length < maxCurves && attempts < maxAttempts) {
    attempts++;

    let x = random(margin, W - margin);
    let y = random(margin, H - margin);

    let r = random();
    let cumProb = 0;
    let blockW = sizes[2].w;
    for (let s of sizes) {
      cumProb += s.prob;
      if (r < cumProb) { blockW = s.w; break; }
    }

    let halfW = blockW / 2;

    if (checkCollision(x, y, halfW + 3)) continue;

    let points = [{ x, y }];
    let cx = x, cy = y;
    let stepSize = random(2.2, 3.2);
    let maxSteps = floor(random(20, 120));

    for (let i = 0; i < maxSteps; i++) {
      let angle = getAngle(cx, cy);
      cx += cos(angle) * stepSize;
      cy += sin(angle) * stepSize;

      if (cx < margin || cx > W - margin || cy < margin || cy > H - margin) break;
      if (checkCollision(cx, cy, halfW + 2)) break;

      points.push({ x: cx, y: cy });
    }

    if (points.length < 6) continue;

    for (let pt of points) {
      markCollision(pt.x, pt.y, halfW + 1);
    }

    let baseCol = pickColor();
    let col = [
      constrain(baseCol[0] + random(-12, 12), 0, 255),
      constrain(baseCol[1] + random(-12, 12), 0, 255),
      constrain(baseCol[2] + random(-12, 12), 0, 255),
    ];

    curves.push({ points, width: blockW, color: col });
  }
}

function drawAll() {
  // Warm cream base
  background(255, 248, 243);

  // Subtle texture: soft scattered speckles
  randomSeed(seed);
  noStroke();
  for (let i = 0; i < 12000; i++) {
    let opacity = random(8, 35);
    fill(random(245, 255), random(235, 250), random(230, 248), opacity);
    ellipse(random(W), random(H), random(1.2, 2.8));
  }

  // Sort by size (larger back)
  curves.sort((a, b) => b.width - a.width);

  for (let curve of curves) {
    drawCurve(curve);
  }

  // Radial glow vignette
  drawRadialGlow();
}

function drawCurve(curve) {
  let { points, width: w, color: col } = curve;
  let style = random();

  if (style < 0.65) {
    drawSoftBlock(points, w, col);
  } else if (style < 0.88) {
    drawGradientBlock(points, w, col);
  } else {
    drawThreadedShape(points, w, col);
  }
}

function drawSoftBlock(points, w, col) {
  noStroke();
  let alpha = random(140, 220);
  fill(col[0], col[1], col[2], alpha);

  beginShape();
  for (let i = 0; i < points.length; i++) {
    let angle = i < points.length - 1
      ? atan2(points[i + 1].y - points[i].y, points[i + 1].x - points[i].x)
      : atan2(points[i].y - points[i - 1].y, points[i].x - points[i - 1].x);
    let perpAngle = angle + HALF_PI;
    vertex(points[i].x + cos(perpAngle) * w / 2, points[i].y + sin(perpAngle) * w / 2);
  }
  for (let i = points.length - 1; i >= 0; i--) {
    let angle = i < points.length - 1
      ? atan2(points[i + 1].y - points[i].y, points[i + 1].x - points[i].x)
      : atan2(points[i].y - points[i - 1].y, points[i].x - points[i - 1].x);
    let perpAngle = angle - HALF_PI;
    vertex(points[i].x + cos(perpAngle) * w / 2, points[i].y + sin(perpAngle) * w / 2);
  }
  endShape(CLOSE);

  // Soft glow edge
  stroke(255, 255, 255, random(20, 50));
  strokeWeight(1.8);
  noFill();
  beginShape();
  for (let i = 0; i < points.length; i++) {
    let angle = i < points.length - 1
      ? atan2(points[i + 1].y - points[i].y, points[i + 1].x - points[i].x)
      : atan2(points[i].y - points[i - 1].y, points[i].x - points[i - 1].x);
    let perpAngle = angle + HALF_PI;
    vertex(points[i].x + cos(perpAngle) * w * 0.4, points[i].y + sin(perpAngle) * w * 0.4);
  }
  endShape();
}

function drawGradientBlock(points, w, col) {
  // Layered translucent blocks creating depth
  noStroke();
  for (let layer = 0; layer < 4; layer++) {
    let layerW = w * map(layer, 0, 3, 1.0, 0.3);
    let alpha = map(layer, 0, 3, random(80, 140), random(20, 60));
    fill(col[0], col[1], col[2], alpha);

    beginShape();
    for (let i = 0; i < points.length; i++) {
      let angle = i < points.length - 1
        ? atan2(points[i + 1].y - points[i].y, points[i + 1].x - points[i].x)
        : atan2(points[i].y - points[i - 1].y, points[i].x - points[i - 1].x);
      let perpAngle = angle + HALF_PI;
      vertex(points[i].x + cos(perpAngle) * layerW / 2, points[i].y + sin(perpAngle) * layerW / 2);
    }
    for (let i = points.length - 1; i >= 0; i--) {
      let angle = i < points.length - 1
        ? atan2(points[i + 1].y - points[i].y, points[i + 1].x - points[i].x)
        : atan2(points[i].y - points[i - 1].y, points[i].x - points[i - 1].x);
      let perpAngle = angle - HALF_PI;
      vertex(points[i].x + cos(perpAngle) * layerW / 2, points[i].y + sin(perpAngle) * layerW / 2);
    }
    endShape(CLOSE);
  }
}

function drawThreadedShape(points, w, col) {
  // Many fine parallel lines with subtle noise — hand-texture effect
  let lineCount = floor(w / 1.3);
  let alpha = random(80, 150);
  stroke(col[0], col[1], col[2], alpha);
  strokeWeight(1.1);
  noFill();

  for (let l = 0; l < lineCount; l++) {
    let offset = map(l, 0, lineCount - 1, -w / 2, w / 2);
    beginShape();
    for (let i = 0; i < points.length; i++) {
      let angle = i < points.length - 1
        ? atan2(points[i + 1].y - points[i].y, points[i + 1].x - points[i].x)
        : atan2(points[i].y - points[i - 1].y, points[i].x - points[i - 1].x);
      let perpAngle = angle + HALF_PI;
      let noiseOff = (noise(i * 0.08, l * 0.25) - 0.5) * 3.2;
      vertex(
        points[i].x + cos(perpAngle) * (offset + noiseOff),
        points[i].y + sin(perpAngle) * (offset + noiseOff)
      );
    }
    endShape();
  }
}

function drawRadialGlow() {
  noStroke();
  let cx = W / 2, cy = H / 2;
  let maxR = dist(0, 0, cx, cy) * 1.1;
  
  // Warm radial glow
  for (let r = maxR; r > maxR * 0.55; r -= 5) {
    let alpha = map(r, maxR * 0.55, maxR, 0, 18);
    fill(255, 235, 210, alpha);
    ellipse(cx, cy, r * 2, r * 2);
  }
}

function mousePressed() {
  collisionGrid = new Uint8Array(collisionW * collisionH);
  curves = [];
  seed = Math.floor(Math.random() * 99999);
  randomSeed(seed);
  noiseSeed(seed);
  generateFlowField();
  generateCurves();
  drawAll();
}
</script>
</body>
</html>
