<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干涉 / Interference</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #08080e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
const W = 800, H = 800;

// --- Shaders ---
const vsrc = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const fsrc = `
precision highp float;
varying vec2 v_uv;
uniform float u_time;
uniform vec2 u_resolution;
uniform sampler2D u_prev;

#define PI 3.14159265

// Sources
const vec2 srcA = vec2(280.0, 320.0);
const vec2 srcB = vec2(520.0, 480.0);
const float freqA = 0.035;
const float freqB = 0.038;
const float phaseB = 0.7 * PI;

// Hash noise for particles
float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float interference(vec2 p, float t) {
  float dA = length(p - srcA);
  float dB = length(p - srcB);
  float ampA = max(0.0, 1.0 - dA / 450.0);
  float ampB = max(0.0, 1.0 - dB / 450.0);
  float wA = sin(dA * freqA - t * 2.2);
  float wB = sin(dB * freqB - t * 2.2 + phaseB);
  return wA * ampA + wB * ampB;
}

void main() {
  vec2 px = v_uv * u_resolution;
  float t = u_time;

  // Previous frame for trail
  vec3 prev = texture2D(u_prev, v_uv).rgb;

  // Interference field
  float val = interference(px, t);
  float absVal = abs(val);
  bool constructive = val > 0.0;
  vec3 fieldCol = vec3(0.0);
  float fieldAlpha = 0.0;

  if (absVal > 0.8) {
    float intensity = (absVal - 0.8) / 1.2;
    if (constructive) {
      fieldCol = vec3(80.0 + intensity * 140.0, 100.0 + intensity * 130.0, 180.0 + intensity * 75.0) / 255.0;
    } else {
      fieldCol = vec3(100.0 + intensity * 140.0, 80.0 + intensity * 90.0, 40.0 + intensity * 50.0) / 255.0;
    }
    fieldAlpha = (intensity * 180.0 + 20.0) / 255.0;
  } else if (absVal < 0.15) {
    fieldCol = vec3(30.0, 25.0, 40.0) / 255.0;
    fieldAlpha = (0.15 - absVal) / 0.15 * 40.0 / 255.0;
  } else {
    float t2 = absVal / 0.8;
    fieldCol = vec3(20.0 + t2 * 40.0, 20.0 + t2 * 45.0, 30.0 + t2 * 60.0) / 255.0;
    fieldAlpha = (t2 * 50.0 + 5.0) / 255.0;
  }

  // Blend field with prev frame (trail effect)
  vec3 col = prev * 0.92 + fieldCol * fieldAlpha * 0.12 / max(fieldAlpha, 0.001) * fieldAlpha;
  col = prev * 0.92 + fieldCol * 0.12;

  // Fade background
  col = mix(col, vec3(8.0/255.0, 8.0/255.0, 14.0/255.0), 0.08);

  // Wave rings from sources
  for (int s = 0; s < 2; s++) {
    vec2 src = s == 0 ? srcA : srcB;
    float freq = s == 0 ? freqA : freqB;
    float hue_sel = s == 0 ? 215.0 : 40.0;
    float d = length(px - src);
    float wavelength = PI * 2.0 / freq;
    float phase = mod(d - t * 2.2 / freq * wavelength / (PI * 2.0), wavelength);
    float ring = 1.0 - smoothstep(0.0, 2.0, abs(phase));
    float decay = max(0.0, 1.0 - d / 450.0);
    float ringAlpha = ring * decay * 0.06;
    // Approximate hue
    vec3 ringCol = s == 0 ? vec3(0.35, 0.45, 0.7) : vec3(0.7, 0.5, 0.3);
    col += ringCol * ringAlpha;
  }

  // Axis line between sources (dashed)
  vec2 ab = srcB - srcA;
  float abLen = length(ab);
  vec2 abDir = ab / abLen;
  vec2 toP = px - srcA;
  float proj = dot(toP, abDir);
  float perp = abs(dot(toP, vec2(-abDir.y, abDir.x)));
  if (proj > 0.0 && proj < abLen && perp < 1.0) {
    float dash = step(0.5, fract(proj / 12.0));
    float axAlpha = (0.04 + 0.02 * sin(t * 0.8)) * dash;
    col += vec3(0.47, 0.51, 0.63) * axAlpha;
  }

  // Midpoint marker
  vec2 mid = (srcA + srcB) * 0.5;
  float midD = length(px - mid);
  col += vec3(0.63, 0.63, 0.7) * smoothstep(2.5, 1.0, midD) * 0.12;

  // Source glows
  for (int s = 0; s < 2; s++) {
    vec2 src = s == 0 ? srcA : srcB;
    float phase_s = s == 0 ? 0.0 : phaseB;
    float pulse = 1.0 + 0.3 * sin(t * 3.0 + phase_s);
    float d = length(px - src);
    float glow = smoothstep(40.0 * pulse, 0.0, d);
    vec3 glowCol = s == 0 ? vec3(0.45, 0.55, 0.8) : vec3(0.75, 0.55, 0.3);
    col += glowCol * glow * 0.3;
    // Core
    col += glowCol * smoothstep(4.0, 2.0, d) * 0.7;
  }

  // Particles along nodal lines (procedural)
  for (int i = 0; i < 80; i++) {
    float fi = float(i);
    float seed = hash(vec2(fi * 1.731, fi * 0.419));
    float seed2 = hash(vec2(fi * 2.913, fi * 0.773));
    // Particle position evolves over time
    vec2 pp = vec2(seed * 800.0, seed2 * 800.0);
    // Drift along nodal lines
    float pTime = mod(t * (0.2 + seed * 0.4) + fi * 3.7, 20.0);
    for (int step = 0; step < 8; step++) {
      float eps = 3.0;
      float gx = interference(pp + vec2(eps, 0.0), t) - interference(pp - vec2(eps, 0.0), t);
      float gy = interference(pp + vec2(0.0, eps), t) - interference(pp - vec2(0.0, eps), t);
      pp += vec2(-gy, gx) * 1.5 * (0.2 + seed * 0.4);
    }
    float pVal = abs(interference(pp, t));
    float brightness = pVal < 0.3 ? (0.3 - pVal) / 0.3 : 0.05;
    float d = length(px - pp);
    float pSize = (0.5 + seed * 1.5) * (0.5 + brightness);
    float pAlpha = smoothstep(pSize + 0.5, pSize - 0.5, d) * brightness * 0.6;
    // Color blend
    float d0 = length(pp - srcA);
    float d1 = length(pp - srcB);
    float blend = d0 / (d0 + d1);
    vec3 pCol = mix(vec3(0.45, 0.55, 0.75), vec3(0.7, 0.55, 0.35), blend);
    col += pCol * pAlpha;
  }

  // Vignette
  vec2 center = u_resolution * 0.5;
  float vd = length(px - center);
  float vig = smoothstep(200.0, 500.0, vd) * 0.6;
  col = mix(col, vec3(8.0/255.0, 8.0/255.0, 14.0/255.0), vig);

  gl_FragColor = vec4(col, 1.0);
}`;

// --- WebGL setup ---
function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderInfoLog(s) === '') console.warn(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes = gl.getUniformLocation(prog, 'u_resolution');
const uPrev = gl.getUniformLocation(prog, 'u_prev');
gl.uniform2f(uRes, W, H);

// Ping-pong FBOs for trail
function createFBO() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb };
}
const fbo0 = createFBO(), fbo1 = createFBO();
let ping = 0;

let time = 0;
function frame() {
  time += 0.016;
  const src = ping === 0 ? fbo0 : fbo1;
  const dst = ping === 0 ? fbo1 : fbo0;

  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, W, H);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(uPrev, 0);
  gl.uniform1f(uTime, time);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Draw to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  ping = 1 - ping;
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
