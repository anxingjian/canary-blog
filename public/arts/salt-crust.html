<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crust 壳</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1C1008; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let plates = [];
let cracks = [];
let mouse = { x: 0, y: 0, active: false };
let time = 0;

const COLORS = {
  terracotta: '#D4956A',
  verdigris: '#4A7C6F',
  burnt: '#1C1008',
  calcium: '#F2EAD8',
  rust: '#6B3A2A'
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initPlates();
}

function initPlates() {
  plates = [];
  cracks = [];
  
  // Voronoi-like salt crust plates
  const numSeeds = 40 + Math.floor(Math.random() * 20);
  const seeds = [];
  for (let i = 0; i < numSeeds; i++) {
    seeds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      age: Math.random(),
      mineral: Math.random()
    });
  }
  
  // Generate plate data
  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i];
    plates.push({
      cx: s.x,
      cy: s.y,
      age: s.age,
      mineral: s.mineral,
      thickness: 0.3 + Math.random() * 0.7,
      crackResistance: Math.random()
    });
  }
  
  // Pre-generate crack network
  for (let i = 0; i < seeds.length; i++) {
    for (let j = i + 1; j < seeds.length; j++) {
      const dx = seeds[i].x - seeds[j].x;
      const dy = seeds[i].y - seeds[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < W * 0.15) {
        // Midpoint with jitter = crack location
        const mx = (seeds[i].x + seeds[j].x) / 2 + (Math.random() - 0.5) * 20;
        const my = (seeds[i].y + seeds[j].y) / 2 + (Math.random() - 0.5) * 20;
        cracks.push({
          x1: seeds[i].x, y1: seeds[i].y,
          x2: seeds[j].x, y2: seeds[j].y,
          mx: mx, my: my,
          depth: Math.random(),
          width: 0.5 + Math.random() * 2.5
        });
      }
    }
  }
}

function getPlateColor(plate) {
  const m = plate.mineral;
  const a = plate.age;
  if (m < 0.3) {
    // Calcium-rich: lighter
    return lerpColor(COLORS.calcium, COLORS.terracotta, a * 0.4);
  } else if (m < 0.6) {
    // Terracotta dominant
    return lerpColor(COLORS.terracotta, COLORS.rust, a * 0.5);
  } else if (m < 0.8) {
    // Verdigris patches (copper deposits)
    return lerpColor(COLORS.verdigris, COLORS.terracotta, a * 0.3);
  } else {
    // Iron-rich rust
    return lerpColor(COLORS.rust, COLORS.burnt, a * 0.6);
  }
}

function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3), 16), g1 = parseInt(c1.slice(3,5), 16), b1 = parseInt(c1.slice(5,7), 16);
  const r2 = parseInt(c2.slice(1,3), 16), g2 = parseInt(c2.slice(3,5), 16), b2 = parseInt(c2.slice(5,7), 16);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${b})`;
}

function drawCrust() {
  // Background: deep burnt earth
  ctx.fillStyle = COLORS.burnt;
  ctx.fillRect(0, 0, W, H);
  
  // Draw plates as irregular polygons approximated by radial fills
  for (const plate of plates) {
    const radius = W * 0.06 * plate.thickness;
    const color = getPlateColor(plate);
    
    // Main plate body
    ctx.save();
    ctx.translate(plate.cx, plate.cy);
    
    // Irregular shape
    ctx.beginPath();
    const sides = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2 + plate.age;
      const r = radius * (0.7 + 0.3 * Math.sin(angle * 3 + plate.mineral * 10));
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    
    // Gradient fill simulating thickness
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    grad.addColorStop(0, color);
    grad.addColorStop(0.6, color);
    grad.addColorStop(1, lerpColor(color, COLORS.burnt, 0.5));
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Mineral deposit texture on surface
    if (plate.mineral > 0.5) {
      ctx.globalAlpha = 0.3;
      for (let i = 0; i < 5; i++) {
        const tx = (Math.random() - 0.5) * radius;
        const ty = (Math.random() - 0.5) * radius;
        ctx.beginPath();
        ctx.arc(tx, ty, 2 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fillStyle = plate.mineral > 0.8 ? COLORS.calcium : COLORS.verdigris;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    
    ctx.restore();
  }
  
  // Draw crack network
  for (const crack of cracks) {
    const mouseDistToCrack = distToSegment(mouse.x, mouse.y, crack.x1, crack.y1, crack.x2, crack.y2);
    const expansion = mouse.active ? Math.max(0, 1 - mouseDistToCrack / 200) * 3 : 0;
    
    ctx.beginPath();
    ctx.moveTo(crack.x1, crack.y1);
    
    // Jagged crack path
    const steps = 8;
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const baseX = crack.x1 + (crack.x2 - crack.x1) * t;
      const baseY = crack.y1 + (crack.y2 - crack.y1) * t;
      const jitter = 3 + expansion * 2;
      const x = baseX + (Math.sin(t * 17 + crack.depth * 10) * jitter);
      const y = baseY + (Math.cos(t * 13 + crack.depth * 7) * jitter);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(crack.x2, crack.y2);
    
    ctx.strokeStyle = lerpColor(COLORS.burnt, '#000000', 0.5 + crack.depth * 0.3);
    ctx.lineWidth = crack.width + expansion;
    ctx.stroke();
    
    // Lighter edge (mineral deposit along crack edge)
    if (crack.depth > 0.5) {
      ctx.strokeStyle = `rgba(242, 234, 216, ${0.15 + expansion * 0.1})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
  
  // Evaporation particles rising from cracks near mouse
  if (mouse.active) {
    drawEvaporation();
  }
}

function drawEvaporation() {
  const numParticles = 20;
  for (let i = 0; i < numParticles; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 80;
    const x = mouse.x + Math.cos(angle) * dist;
    const y = mouse.y + Math.sin(angle) * dist - Math.random() * 30;
    const size = 1 + Math.random() * 2;
    const alpha = 0.1 + Math.random() * 0.2;
    
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(242, 234, 216, ${alpha})`;
    ctx.fill();
  }
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.sqrt((px-x1)**2 + (py-y1)**2);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const projX = x1 + t * dx, projY = y1 + t * dy;
  return Math.sqrt((px - projX)**2 + (py - projY)**2);
}

// Slow animation: crust drying/contracting over time
function animate() {
  time += 0.005;
  
  // Subtle plate drift simulating thermal expansion
  for (const plate of plates) {
    plate.cx += Math.sin(time + plate.age * 10) * 0.02;
    plate.cy += Math.cos(time + plate.mineral * 8) * 0.02;
  }
  
  drawCrust();
  
  // Overlay: heat shimmer
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = COLORS.terracotta;
  const shimmerY = H * 0.3 + Math.sin(time * 2) * 20;
  ctx.fillRect(0, shimmerY, W, 2);
  ctx.globalAlpha = 1;
  
  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => {
  mouse.active = false;
});

canvas.addEventListener('click', () => {
  // Click adds a new crack from mouse position
  const nearestPlate = plates.reduce((best, p) => {
    const d = Math.sqrt((p.cx - mouse.x)**2 + (p.cy - mouse.y)**2);
    return d < best.d ? { p, d } : best;
  }, { p: null, d: Infinity });
  
  if (nearestPlate.p) {
    cracks.push({
      x1: mouse.x, y1: mouse.y,
      x2: nearestPlate.p.cx, y2: nearestPlate.p.cy,
      mx: (mouse.x + nearestPlate.p.cx) / 2,
      my: (mouse.y + nearestPlate.p.cy) / 2,
      depth: 0.7 + Math.random() * 0.3,
      width: 1 + Math.random() * 2
    });
  }
});

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
