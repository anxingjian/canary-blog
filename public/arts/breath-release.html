<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>释 / Release</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF8F0; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let mouseX = -1, mouseY = -1;

const palette = [
  [255, 183, 197],  // 樱粉
  [168, 216, 185],  // 嫩绿
  [135, 206, 235],  // 天蓝
  [200, 162, 200],  // 薰衣草
  [255, 222, 173],  // 杏黄
];

// Release: the held breath finally lets go.
// Particles burst outward from center in slow waves,
// trails linger and fade, rings expand and dissolve.

class ReleaseParticle {
  constructor() {
    this.spawn();
  }

  spawn() {
    const angle = Math.random() * Math.PI * 2;
    this.angle = angle;
    this.x = cx;
    this.y = cy;
    // Stagger the release — not everything escapes at once
    this.delay = Math.random() * 6;
    this.speed = 0.3 + Math.random() * 1.2;
    this.dist = 0;
    this.maxDist = 80 + Math.random() * Math.min(W, H) * 0.4;
    this.size = 1.5 + Math.random() * 3.5;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.alpha = 0;
    this.wobbleAmp = Math.random() * 15 + 5;
    this.wobbleFreq = Math.random() * 2 + 1;
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.trail = [];
    this.born = time;
    this.released = false;
    this.deceleration = 0.985 + Math.random() * 0.01;
  }

  update(t) {
    const age = t - this.born;
    if (age < this.delay) {
      // Pre-release: tremble at center
      this.x = cx + Math.sin(t * 8 + this.wobblePhase) * 2;
      this.y = cy + Math.cos(t * 7 + this.wobblePhase * 1.3) * 2;
      this.alpha = 0.15 + 0.1 * Math.sin(t * 4);
      return;
    }

    if (!this.released) {
      this.released = true;
      this.releaseTime = t;
      this.currentSpeed = this.speed * (1.5 + Math.random() * 0.5);
    }

    const releaseAge = t - this.releaseTime;

    // Burst outward with deceleration
    this.currentSpeed *= this.deceleration;
    this.dist += this.currentSpeed;

    // Gentle wobble perpendicular to radial direction
    const wobble = Math.sin(t * this.wobbleFreq + this.wobblePhase) * this.wobbleAmp * (1 - this.dist / this.maxDist);
    const perpAngle = this.angle + Math.PI / 2;

    this.x = cx + Math.cos(this.angle) * this.dist + Math.cos(perpAngle) * wobble;
    this.y = cy + Math.sin(this.angle) * this.dist + Math.sin(perpAngle) * wobble;

    // Fade in on release, then slowly fade out at distance
    const distRatio = this.dist / this.maxDist;
    if (releaseAge < 0.5) {
      this.alpha = Math.min(0.8, releaseAge * 1.6);
    } else {
      this.alpha = 0.8 * Math.max(0, 1 - distRatio * distRatio);
    }

    // Mouse: push particles further outward (accelerate release)
    if (mouseX > 0) {
      const dx = this.x - mouseX;
      const dy = this.y - mouseY;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 100 && d > 0) {
        const force = (1 - d / 100) * 2;
        this.x += (dx / d) * force;
        this.y += (dy / d) * force;
        this.alpha = Math.min(1, this.alpha + (1 - d / 100) * 0.3);
      }
    }

    // Trail
    this.trail.push({ x: this.x, y: this.y, alpha: this.alpha, size: this.size });
    if (this.trail.length > 12) this.trail.shift();

    // Respawn when too far or too faded
    if (this.dist > this.maxDist || this.alpha <= 0.01) {
      this.spawn();
    }
  }

  draw() {
    const [r, g, b] = this.color;

    // Draw trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const trailAlpha = t.alpha * (i / this.trail.length) * 0.3;
      const trailSize = t.size * (0.3 + 0.7 * (i / this.trail.length));
      ctx.beginPath();
      ctx.arc(t.x, t.y, trailSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${trailAlpha})`;
      ctx.fill();
    }

    // Main particle with glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha})`;
    ctx.fill();

    if (this.size > 2) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.08})`;
      ctx.fill();
    }
  }
}

// Expanding rings — breath waves rippling outward
class BreathWave {
  constructor(i) {
    this.i = i;
    this.reset();
  }

  reset() {
    this.radius = 0;
    this.maxRadius = Math.min(W, H) * 0.55;
    this.speed = 0.4 + Math.random() * 0.3;
    this.color = palette[this.i % palette.length];
    this.born = time + this.i * 1.2; // staggered release
    this.lineWidth = 1 + Math.random() * 1.5;
  }

  update(t) {
    if (t < this.born) return;
    this.radius += this.speed;
    if (this.radius > this.maxRadius) {
      this.reset();
      this.born = t + Math.random() * 2;
    }
  }

  draw(t) {
    if (t < this.born || this.radius <= 0) return;
    const [r, g, b] = this.color;
    const progress = this.radius / this.maxRadius;
    // Strong at birth, fade as it expands
    const alpha = 0.25 * (1 - progress) * (1 - progress);

    ctx.beginPath();
    ctx.arc(cx, cy, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth = this.lineWidth * (1 - progress * 0.5);
    ctx.stroke();
  }
}

// Center: a pulsing core that diminishes as breath is released
function drawCore(t) {
  // The core shrinks and pulses — letting go
  const cycle = t * 0.3;
  const release = Math.sin(cycle);
  const coreR = Math.max(3, 15 - t * 0.05 % 12 + release * 4);

  for (let layer = 3; layer >= 0; layer--) {
    const lr = coreR + layer * 10;
    const alpha = 0.04 * (4 - layer) * (0.5 + 0.5 * Math.sin(t * 0.8));
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, lr);
    gradient.addColorStop(0, `rgba(255, 183, 197, ${alpha * 1.5})`);
    gradient.addColorStop(0.4, `rgba(168, 216, 185, ${alpha})`);
    gradient.addColorStop(1, `rgba(135, 206, 235, 0)`);
    ctx.beginPath();
    ctx.arc(cx, cy, lr, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }
}

// Dissolving filaments — the structure of held breath breaking apart
function drawFilaments(t) {
  const count = 24;
  for (let i = 0; i < count; i++) {
    const baseAngle = (i / count) * Math.PI * 2;
    // Filaments splay outward over time
    const splay = Math.sin(t * 0.2 + i * 0.5) * 0.08;
    const angle = baseAngle + splay;

    const innerR = 8 + Math.sin(t * 0.5 + i) * 5;
    const outerR = 30 + Math.sin(t * 0.3 + i * 0.7) * 20 + 40;

    // Each filament is a curve, not straight
    const midR = (innerR + outerR) / 2;
    const curve = Math.sin(t * 1.5 + i * 1.2) * 15;
    const perpAngle = angle + Math.PI / 2;

    const [cr, cg, cb] = palette[i % palette.length];
    const alpha = 0.06 + 0.03 * Math.sin(t * 0.8 + i);

    ctx.beginPath();
    ctx.moveTo(
      cx + Math.cos(angle) * innerR,
      cy + Math.sin(angle) * innerR
    );
    ctx.quadraticCurveTo(
      cx + Math.cos(angle) * midR + Math.cos(perpAngle) * curve,
      cy + Math.sin(angle) * midR + Math.sin(perpAngle) * curve,
      cx + Math.cos(angle) * outerR,
      cy + Math.sin(angle) * outerR
    );
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

let particles = [];
let waves = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}

function init() {
  resize();
  particles = [];
  waves = [];

  for (let i = 0; i < 180; i++) {
    particles.push(new ReleaseParticle());
  }
  for (let i = 0; i < 8; i++) {
    waves.push(new BreathWave(i));
  }
}

function animate() {
  time += 0.012;

  // Gentle fade — trails linger like the last warmth of exhaled air
  ctx.fillStyle = 'rgba(255, 248, 240, 0.08)';
  ctx.fillRect(0, 0, W, H);

  drawFilaments(time);
  waves.forEach(w => { w.update(time); w.draw(time); });
  drawCore(time);

  particles.forEach(p => {
    p.update(time);
    p.draw();
  });

  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => {
  mouseX = mouseY = -1;
});
window.addEventListener('resize', () => {
  resize();
  particles.forEach(p => p.spawn());
});

init();
animate();
</script>
</body>
</html>
