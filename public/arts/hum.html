<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hum — 频率 #1</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #F0F8FF; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let sources = [];
let time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Initial source at center
sources.push({ x: W/2, y: H/2, birth: 0, strength: 1 });

canvas.addEventListener('click', (e) => {
  sources.push({ x: e.clientX, y: e.clientY, birth: time, strength: 1 });
  if (sources.length > 8) sources.shift();
});

function lerp(a, b, t) { return a + (b - a) * t; }

function draw() {
  time += 0.02;
  
  // Fill background with slight fade for trails
  ctx.fillStyle = 'rgba(240, 248, 255, 0.08)';
  ctx.fillRect(0, 0, W, H);
  
  const res = 6; // pixel step
  
  for (let x = 0; x < W; x += res) {
    for (let y = 0; y < H; y += res) {
      let totalWave = 0;
      
      for (const src of sources) {
        const dx = x - src.x;
        const dy = y - src.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const age = time - src.birth;
        const freq = 0.015;
        const speed = 120;
        const wave = Math.sin(dist * freq - age * speed * freq) * src.strength;
        const decay = Math.exp(-dist * 0.002) * Math.min(age * 0.5, 1);
        totalWave += wave * decay;
      }
      
      if (Math.abs(totalWave) > 0.15) {
        let alpha = Math.abs(totalWave);
        alpha = Math.min(alpha, 1);
        
        if (totalWave > 0) {
          // Amber orange for positive phase
          const r = 255, g = Math.floor(140 * alpha), b = 0;
          ctx.fillStyle = `rgba(${r}, ${g}, 0, ${alpha * 0.7})`;
        } else {
          // Midnight purple for negative phase
          const intensity = alpha;
          ctx.fillStyle = `rgba(45, 10, 78, ${intensity * 0.6})`;
        }
        ctx.fillRect(x, y, res, res);
      }
    }
  }
  
  // Draw nodes at standing wave peaks (where multiple sources interfere constructively)
  if (sources.length > 1) {
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * Math.PI * 2 + time * 0.3;
      const radius = 80 + Math.sin(time * 0.5 + i * 0.5) * 60;
      const cx = sources[0].x + Math.cos(angle) * radius;
      const cy = sources[0].y + Math.sin(angle) * radius;
      
      // Check if this point is at a wave peak
      let totalWave = 0;
      for (const src of sources) {
        const dx = cx - src.x;
        const dy = cy - src.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const age = time - src.birth;
        const wave = Math.sin(dist * 0.015 - age * 120 * 0.015);
        totalWave += wave;
      }
      
      if (totalWave > 0.8) {
        const glow = (totalWave - 0.8) * 5;
        ctx.beginPath();
        ctx.arc(cx, cy, 2 + glow * 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 206, 209, ${Math.min(glow, 0.9)})`;
        ctx.fill();
        
        // Glow ring
        ctx.beginPath();
        ctx.arc(cx, cy, 4 + glow * 4, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 206, 209, ${glow * 0.3})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
  
  // Central pulsing core
  const pulse = Math.sin(time * 2) * 0.3 + 0.7;
  for (const src of sources) {
    const age = time - src.birth;
    if (age < 3) {
      const coreSize = 3 + pulse * 4;
      const coreAlpha = Math.max(0, 1 - age / 3);
      ctx.beginPath();
      ctx.arc(src.x, src.y, coreSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 140, 0, ${coreAlpha * pulse})`;
      ctx.fill();
    }
  }
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
