<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春風 / Harukaze</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
// 春風 / Harukaze — Canary 2026-04-11
// Fidenza-inspired: flow field + thick rectangular color blocks
// Spring palette, collision detection, probabilistic color

const PALETTE = [
  { hex: '#FFB7C5', w: 3 },  // 樱粉
  { hex: '#F7A8B8', w: 2 },  // 深樱粉
  { hex: '#A8D8B9', w: 3 },  // 嫩绿
  { hex: '#87CEEB', w: 2 },  // 天蓝
  { hex: '#FFDEAD', w: 2 },  // 杏黄
  { hex: '#C8A2C8', w: 1 },  // 薰衣草
  { hex: '#FFE4E1', w: 1 },  // 浅粉
  { hex: '#B5EAD7', w: 1 },  // 薄荷
];

const BG = '#FFF8F0';
let cols, rows, scl, field;
let strokes = [];
let occupied; // collision grid
let cellSize = 4;
let occCols, occRows;
let seed;

function weightedRandom(palette) {
  let total = 0;
  for (let p of palette) total += p.w;
  let r = Math.random() * total;
  for (let p of palette) {
    r -= p.w;
    if (r <= 0) return p.hex;
  }
  return palette[0].hex;
}

function setup() {
  seed = Math.floor(Math.random() * 999999);
  noiseSeed(seed);
  
  let sz = min(windowWidth, windowHeight);
  createCanvas(sz, sz);
  pixelDensity(2);
  
  scl = 20;
  cols = floor(width / scl) + 1;
  rows = floor(height / scl) + 1;
  
  // Collision grid
  occCols = floor(width / cellSize) + 1;
  occRows = floor(height / cellSize) + 1;
  occupied = new Uint8Array(occCols * occRows);
  
  // Generate flow field with some turbulence variation
  field = new Float32Array(cols * rows);
  let turbulence = random(0.003, 0.008);
  let zOff = random(1000);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let angle = noise(x * turbulence * scl, y * turbulence * scl, zOff) * TAU * 2.5;
      field[y * cols + x] = angle;
    }
  }
  
  // Generate strokes
  let attempts = 0;
  let maxAttempts = 8000;
  let maxStrokes = 500;
  
  while (strokes.length < maxStrokes && attempts < maxAttempts) {
    attempts++;
    let sx = random(width * 0.05, width * 0.95);
    let sy = random(height * 0.05, height * 0.95);
    
    // Check if start is free
    let ci = floor(sx / cellSize);
    let ri = floor(sy / cellSize);
    if (ci >= 0 && ci < occCols && ri >= 0 && ri < occRows && occupied[ri * occCols + ci]) continue;
    
    // Pick random thickness and length
    let sizes = [
      { thick: random(3, 6), steps: floor(random(20, 60)), w: 4 },    // small
      { thick: random(8, 14), steps: floor(random(15, 45)), w: 3 },   // medium
      { thick: random(18, 30), steps: floor(random(10, 35)), w: 2 },  // large
      { thick: random(35, 55), steps: floor(random(8, 20)), w: 1 },   // jumbo
    ];
    let sz = weightedRandomObj(sizes);
    let thickness = sz.thick;
    let maxSteps = sz.steps;
    
    let col = weightedRandom(PALETTE);
    let alpha = random(0.4, 0.85);
    
    // Trace path
    let pts = [];
    let cx = sx, cy = sy;
    let valid = true;
    let stepSize = scl * 0.4;
    
    for (let s = 0; s < maxSteps; s++) {
      let gi = floor(cx / scl);
      let gj = floor(cy / scl);
      if (gi < 0 || gi >= cols - 1 || gj < 0 || gj >= rows - 1) break;
      
      let angle = field[gj * cols + gi];
      pts.push({ x: cx, y: cy });
      
      cx += cos(angle) * stepSize;
      cy += sin(angle) * stepSize;
      
      // Boundary check
      if (cx < 0 || cx > width || cy < 0 || cy > height) break;
      
      // Collision check
      let halfT = thickness / 2 + 2;
      for (let dx = -halfT; dx <= halfT; dx += cellSize) {
        for (let dy = -halfT; dy <= halfT; dy += cellSize) {
          let oi = floor((cx + dx) / cellSize);
          let oj = floor((cy + dy) / cellSize);
          if (oi >= 0 && oi < occCols && oj >= 0 && oj < occRows && occupied[oj * occCols + oi]) {
            valid = false;
            break;
          }
        }
        if (!valid) break;
      }
      if (!valid) {
        if (pts.length < 3) { pts = []; }
        break;
      }
    }
    
    if (pts.length < 3) continue;
    
    // Mark occupied
    for (let p of pts) {
      let halfT = thickness / 2 + 1;
      for (let dx = -halfT; dx <= halfT; dx += cellSize * 0.5) {
        for (let dy = -halfT; dy <= halfT; dy += cellSize * 0.5) {
          let oi = floor((p.x + dx) / cellSize);
          let oj = floor((p.y + dy) / cellSize);
          if (oi >= 0 && oi < occCols && oj >= 0 && oj < occRows) {
            occupied[oj * occCols + oi] = 1;
          }
        }
      }
    }
    
    strokes.push({ pts, thickness, col, alpha });
  }
  
  // Draw
  background(BG);
  
  // Subtle warm gradient overlay on background
  noStroke();
  for (let y = 0; y < height; y += 2) {
    let a = map(y, 0, height, 0, 15);
    fill(255, 235, 210, a);
    rect(0, y, width, 2);
  }
  
  // Draw strokes as thick rounded rectangles along path
  for (let s of strokes) {
    let c = color(s.col);
    c.setAlpha(s.alpha * 255);
    
    stroke(c);
    strokeWeight(s.thickness);
    strokeCap(ROUND);
    strokeJoin(ROUND);
    noFill();
    
    beginShape();
    for (let p of s.pts) {
      curveVertex(p.x, p.y);
    }
    endShape();
    
    // Light highlight on top edge — gives "光感"
    let hc = color(255, 255, 255, s.alpha * 60);
    stroke(hc);
    strokeWeight(s.thickness * 0.3);
    beginShape();
    for (let p of s.pts) {
      curveVertex(p.x, p.y - s.thickness * 0.15);
    }
    endShape();
  }
  
  // Floating particles — pollen / dust in spring air
  let numParticles = floor(random(200, 400));
  noStroke();
  for (let i = 0; i < numParticles; i++) {
    let px = random(width);
    let py = random(height);
    let ps = random(1, 3.5);
    let pc = color(weightedRandom(PALETTE));
    pc.setAlpha(random(30, 100));
    fill(pc);
    ellipse(px, py, ps, ps);
  }
  
  // Subtle white particles for sparkle
  for (let i = 0; i < 80; i++) {
    let px = random(width);
    let py = random(height);
    fill(255, 255, 255, random(40, 120));
    ellipse(px, py, random(1, 2.5), random(1, 2.5));
  }
  
  noLoop();
}

function weightedRandomObj(arr) {
  let total = 0;
  for (let a of arr) total += a.w;
  let r = Math.random() * total;
  for (let a of arr) {
    r -= a.w;
    if (r <= 0) return a;
  }
  return arr[0];
}

function windowResized() {
  // Static piece, no resize
}
</script>
</body>
</html>
