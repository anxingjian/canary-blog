<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侵蚀 / Erosion</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0b; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0, 1); }`;

const fs = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 u_res;
uniform float u_time;

// Simplex-ish noise
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float fbm(vec2 p, float t) {
  float f = 0.0;
  float amp = 0.5;
  float freq = 1.0;
  for (int i = 0; i < 6; i++) {
    f += amp * snoise(p * freq + t * 0.03 * float(i + 1));
    freq *= 2.1;
    amp *= 0.48;
  }
  return f;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);

  float t = u_time * 0.15;

  // A solid geometric form — a monolith
  float monolith = smoothstep(0.005, 0.0, abs(p.x) - 0.18 + 0.06 * p.y);
  monolith *= smoothstep(-0.55, -0.5, p.y) * smoothstep(0.5, 0.45, p.y);

  // Erosion: noise eats into the form over time
  float erosionStrength = 0.3 + 0.25 * sin(t * 0.4);
  float n1 = fbm(p * 3.0 + vec2(t * 0.1, 0.0), t);
  float n2 = fbm(p * 5.0 + vec2(0.0, t * 0.08), t * 1.3);
  float erosion = smoothstep(-0.1, 0.4, n1 * erosionStrength + n2 * 0.15);

  // The eroded form
  float form = monolith * (1.0 - erosion * 0.85);

  // Particles drifting away — the eroded material
  float particles = 0.0;
  for (int i = 0; i < 40; i++) {
    float fi = float(i);
    float seed = fract(sin(fi * 127.1) * 43758.5453);
    float seed2 = fract(sin(fi * 269.5) * 18732.1234);
    float speed = 0.02 + seed * 0.04;
    float px = 0.18 * (seed2 * 2.0 - 1.0) + sin(t * speed * 3.0 + fi) * 0.3;
    float py = mod(-0.5 + seed * 1.0 + t * speed, 1.2) - 0.6;
    // Drift outward
    px += sign(px) * t * speed * 0.5;
    float d = length(p - vec2(px, py));
    float size = 0.001 + 0.003 * seed;
    particles += smoothstep(size, size * 0.3, d) * (0.3 + 0.7 * seed);
  }

  // Color palette: warm stone tones eroding to cool dust
  vec3 stoneColor = mix(
    vec3(0.82, 0.75, 0.65), // warm sandstone
    vec3(0.6, 0.55, 0.5),   // weathered
    snoise(p * 8.0 + t * 0.05) * 0.5 + 0.5
  );

  // Edge glow where erosion meets form
  float edge = abs(form - 0.5);
  float edgeGlow = smoothstep(0.15, 0.0, edge) * erosion * monolith;

  vec3 col = vec3(0.0);

  // The monolith body
  col += form * stoneColor * (0.6 + 0.4 * (1.0 - erosion));

  // Erosion edge — warm amber glow
  col += edgeGlow * vec3(0.9, 0.6, 0.3) * 0.6;

  // Particles — dusty, fading
  vec3 dustColor = vec3(0.7, 0.65, 0.55);
  col += particles * dustColor * 0.5;

  // Subtle vignette
  float vig = 1.0 - 0.4 * length(uv - 0.5);
  col *= vig;

  // Very subtle grain
  float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + u_time) * 43758.5453);
  col += (grain - 0.5) * 0.015;

  fragColor = vec4(col, 1.0);
}`;

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

function render(t) {
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
