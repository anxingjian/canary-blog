<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干涉 / Interference</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A0A0A; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
let sources = [];
let time = 0;
let particles = [];

const VERMILLION = { r: 196, g: 30, b: 58 };
const GOLD = { r: 212, g: 160, b: 23 };
const BONE = { r: 240, g: 230, b: 210 };

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Start with two sources
sources.push({ x: W * 0.35, y: H * 0.45, phase: 0, freq: 0.04, amp: 1 });
sources.push({ x: W * 0.65, y: H * 0.55, phase: 0, freq: 0.04, amp: 1 });

// Particles that respond to interference
const NUM_PARTICLES = 300;
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: 0, vy: 0,
    size: 1.5 + Math.random() * 2,
    life: 0.3 + Math.random() * 0.7
  });
}

function waveAt(x, y, t) {
  let val = 0;
  for (const s of sources) {
    const dx = x - s.x;
    const dy = y - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const wave = Math.sin(dist * s.freq - t * 2 + s.phase) * s.amp;
    const decay = 1 / (1 + dist * 0.003);
    val += wave * decay;
  }
  return val;
}

function gradientAt(x, y, t) {
  const eps = 2;
  const dx = waveAt(x + eps, y, t) - waveAt(x - eps, y, t);
  const dy = waveAt(x, y + eps, t) - waveAt(x, y - eps, t);
  return { dx: dx / (2 * eps), dy: dy / (2 * eps) };
}

function lerpColor(a, b, t) {
  return {
    r: a.r + (b.r - a.r) * t,
    g: a.g + (b.g - a.g) * t,
    b: a.b + (b.b - a.b) * t
  };
}

function draw() {
  time += 0.02;

  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Draw interference field as grid of dots
  const step = 18;
  for (let x = step / 2; x < W; x += step) {
    for (let y = step / 2; y < H; y += step) {
      const val = waveAt(x, y, time);
      const norm = (val + 2) / 4; // normalize roughly to 0-1

      if (norm > 0.55) {
        // Constructive interference — vermillion to gold
        const t = Math.min((norm - 0.55) / 0.45, 1);
        const col = lerpColor(VERMILLION, GOLD, t);
        const alpha = 0.15 + t * 0.6;
        const size = 1 + t * 3;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${alpha})`;
        ctx.fill();
      } else if (norm < 0.45) {
        // Destructive interference — faint bone
        const t = Math.max((0.45 - norm) / 0.45, 0);
        const alpha = t * 0.06;
        const size = 0.5 + t * 0.5;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${BONE.r},${BONE.g},${BONE.b},${alpha})`;
        ctx.fill();
      }
    }
  }

  // Draw particles pushed by wave gradients
  for (const p of particles) {
    const g = gradientAt(p.x, p.y, time);
    p.vx += g.dx * 80;
    p.vy += g.dy * 80;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.x += p.vx;
    p.y += p.vy;

    // Wrap
    if (p.x < 0) p.x += W;
    if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H;
    if (p.y > H) p.y -= H;

    const val = waveAt(p.x, p.y, time);
    const intensity = Math.max(0, val) / 2;
    const col = lerpColor(VERMILLION, GOLD, intensity);
    const alpha = 0.2 + intensity * 0.7;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.8 + intensity * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${alpha * p.life})`;
    ctx.fill();

    // Draw connections between close particles in high-intensity zones
    if (intensity > 0.3) {
      for (const q of particles) {
        if (q === p) continue;
        const dx = q.x - p.x;
        const dy = q.y - p.y;
        const dist = dx * dx + dy * dy;
        if (dist < 3000 && dist > 100) {
          const lineAlpha = (1 - dist / 3000) * intensity * 0.15 * p.life;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(${GOLD.r},${GOLD.g},${GOLD.b},${lineAlpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  // Draw source points
  for (const s of sources) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 2);
    const r = 4 + pulse * 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${GOLD.r},${GOLD.g},${GOLD.b},${0.6 + pulse * 0.4})`;
    ctx.fill();

    // Glow
    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 30 + pulse * 15);
    grd.addColorStop(0, `rgba(${VERMILLION.r},${VERMILLION.g},${VERMILLION.b},0.15)`);
    grd.addColorStop(1, 'rgba(10,10,10,0)');
    ctx.beginPath();
    ctx.arc(s.x, s.y, 45, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

// Click to add/move sources
canvas.addEventListener('click', (e) => {
  if (sources.length < 5) {
    sources.push({
      x: e.clientX, y: e.clientY,
      phase: Math.random() * Math.PI * 2,
      freq: 0.03 + Math.random() * 0.02,
      amp: 0.8 + Math.random() * 0.4
    });
  } else {
    // Move oldest non-original source
    const idx = 2 + ((sources.length - 2) % (sources.length - 2 || 1));
    sources[idx >= sources.length ? 2 : idx].x = e.clientX;
    sources[idx >= sources.length ? 2 : idx].y = e.clientY;
  }
});

draw();
</script>
</body>
</html>
