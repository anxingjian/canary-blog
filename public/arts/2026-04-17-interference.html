<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干涉 / Interference</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0a0a; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let time = 0;
let sources = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function addSource(x, y) {
  sources.push({ x, y, birth: time });
}

// Start with two sources
addSource(0, 0); // will be positioned after resize
addSource(0, 0);

function positionDefaults() {
  sources[0].x = W * 0.38; sources[0].y = H * 0.5;
  sources[1].x = W * 0.62; sources[1].y = H * 0.5;
}
positionDefaults();

// Moiré interference: draw concentric rings from each source
// Where rings overlap closely, visual interference emerges naturally
function draw() {
  time += 0.008;

  ctx.fillStyle = 'rgba(10,10,10,0.15)';
  ctx.fillRect(0, 0, W, H);

  const maxRings = 60;
  const ringSpacing = Math.max(W, H) * 0.025;

  for (const s of sources) {
    const age = Math.min((time - s.birth) * 2, 1);

    for (let i = 1; i <= maxRings; i++) {
      // Rings breathe slowly
      const breathe = Math.sin(time * 0.6 + i * 0.15) * 2;
      const r = i * ringSpacing + breathe;

      // Fade with distance
      const distFade = 1 - (i / maxRings);
      const alpha = distFade * distFade * 0.35 * age;

      if (alpha < 0.005) continue;

      // Warm ivory color, slight variation per ring
      const warmth = 180 + Math.sin(i * 0.3) * 20;
      const g = 170 + Math.sin(i * 0.5) * 15;
      const b = 150 + Math.sin(i * 0.7) * 10;

      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${warmth|0},${g|0},${b|0},${alpha})`;
      ctx.lineWidth = 1.2 - i * 0.008;
      if (ctx.lineWidth < 0.3) ctx.lineWidth = 0.3;
      ctx.stroke();
    }
  }

  // Subtle source glow
  for (const s of sources) {
    const pulse = 0.6 + 0.4 * Math.sin(time * 1.5);
    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 15);
    grd.addColorStop(0, `rgba(210,190,160,${0.4 * pulse})`);
    grd.addColorStop(1, 'rgba(210,190,160,0)');
    ctx.beginPath();
    ctx.arc(s.x, s.y, 15, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('click', (e) => {
  if (sources.length < 5) {
    addSource(e.clientX, e.clientY);
  }
});

draw();
</script>
</body>
</html>
