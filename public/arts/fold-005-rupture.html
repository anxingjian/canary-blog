<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupture 裂 — Fold Series</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0C0C0C; }
canvas { display: block; }
</style>
</head>
<body>
<script>
// Rupture 裂 — When folding exceeds rock's ductility, it breaks
// Thrust fault simulation

const BASALT = [12, 12, 12];
const LAVA = [255, 78, 0];
const OBSIDIAN = [43, 23, 0];
const AMBER = [255, 200, 87];
const PUMICE = [235, 235, 211];

let layers = [];
let faultAngle = 0.45; // radians from horizontal
let faultX;
let displacement = 0;
let targetDisplacement = 0;
let shearStress = 0;
let ruptured = false;
let ruptureTime = 0;
let particles = [];
let mouseInfluence = { x: 0, y: 0 };

function setup() {
  createCanvas(windowWidth, windowHeight);
  faultX = width * 0.52;
  initLayers();
}

function initLayers() {
  layers = [];
  let numLayers = 18;
  let spacing = height / (numLayers + 2);
  for (let i = 0; i < numLayers; i++) {
    let baseY = spacing * (i + 1.5);
    let thickness = random(2, 5);
    let layerType = random();
    let col;
    if (layerType < 0.5) col = PUMICE;
    else if (layerType < 0.8) col = OBSIDIAN;
    else col = [lerp(OBSIDIAN[0], PUMICE[0], 0.3), lerp(OBSIDIAN[1], PUMICE[1], 0.3), lerp(OBSIDIAN[2], PUMICE[2], 0.3)];
    layers.push({ baseY, thickness, col, offset: random(100) });
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  faultX = width * 0.52;
  initLayers();
}

function draw() {
  background(BASALT[0], BASALT[1], BASALT[2]);
  
  // Mouse influence on shear direction
  mouseInfluence.x = (mouseX - width / 2) / width;
  mouseInfluence.y = (mouseY - height / 2) / height;
  faultAngle = 0.45 + mouseInfluence.x * 0.3;
  
  // Stress accumulation
  if (!ruptured) {
    shearStress += 0.0008;
    if (shearStress > 1.0) {
      triggerRupture();
    }
  }
  
  // Displacement animation
  if (ruptured) {
    let elapsed = (millis() - ruptureTime) / 1000;
    if (mouseIsPressed) {
      targetDisplacement += 0.3;
    }
    displacement = lerp(displacement, targetDisplacement, 0.04);
  }
  
  drawLayers();
  drawFaultZone();
  drawParticles();
  drawStressIndicator();
}

function drawLayers() {
  noFill();
  for (let layer of layers) {
    let col = layer.col;
    let alpha = 180 + 50 * sin(layer.offset);
    stroke(col[0], col[1], col[2], alpha);
    strokeWeight(layer.thickness);
    
    beginShape();
    for (let x = 0; x < width; x += 4) {
      let y = layer.baseY;
      
      // Pre-fault folding (existing deformation)
      let distToFault = x - faultX;
      let foldInfluence = exp(-abs(distToFault) / (width * 0.2));
      y += sin(x * 0.005 + layer.offset) * 15 * foldInfluence;
      
      // Drag folding near fault
      let dragZone = width * 0.08;
      if (abs(distToFault) < dragZone) {
        let dragFactor = 1 - abs(distToFault) / dragZone;
        dragFactor = pow(dragFactor, 2);
        y += (distToFault > 0 ? -1 : 1) * dragFactor * 30 * (shearStress + displacement * 0.02);
      }
      
      // Displacement on hanging wall (left side moves up)
      if (ruptured && x < faultX - 5) {
        let proximityToFault = max(0, 1 - abs(x - faultX) / (width * 0.4));
        y -= displacement * proximityToFault;
        // Slight rotation
        y -= (faultX - x) * sin(faultAngle) * displacement * 0.0003;
      }
      
      // Break at fault
      if (ruptured && abs(x - faultX) < 3) {
        strokeWeight(0); // gap
      }
      
      vertex(x, y);
    }
    endShape();
  }
}

function drawFaultZone() {
  // The fault plane itself
  let faultLen = height * 1.2;
  let fx1 = faultX - cos(faultAngle) * faultLen / 2;
  let fy1 = height / 2 + sin(faultAngle) * faultLen / 2;
  let fx2 = faultX + cos(faultAngle) * faultLen / 2;
  let fy2 = height / 2 - sin(faultAngle) * faultLen / 2;
  
  // Fault zone glow - friction heat
  let glowIntensity = ruptured ? 0.6 + 0.4 * sin(millis() * 0.003) : shearStress * 0.5;
  
  // Multiple passes for glow
  for (let i = 5; i >= 0; i--) {
    let w = i * 4 + 2;
    let a = glowIntensity * (60 - i * 8);
    stroke(LAVA[0], LAVA[1], LAVA[2], a);
    strokeWeight(w);
    line(fx1, fy1, fx2, fy2);
  }
  
  // Core line
  stroke(AMBER[0], AMBER[1], AMBER[2], 200 * glowIntensity);
  strokeWeight(1.5);
  line(fx1, fy1, fx2, fy2);
  
  // Fault gouge / debris zone
  if (ruptured || shearStress > 0.5) {
    let debrisIntensity = ruptured ? 1 : (shearStress - 0.5) * 2;
    for (let t = 0; t < 1; t += 0.02) {
      let px = lerp(fx1, fx2, t);
      let py = lerp(fy1, fy2, t);
      let spread = (ruptured ? 12 : 6) * debrisIntensity;
      px += random(-spread, spread);
      py += random(-spread, spread);
      let size = random(1, 3);
      noStroke();
      fill(AMBER[0], AMBER[1], AMBER[2], random(40, 100) * debrisIntensity);
      ellipse(px, py, size);
    }
  }
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05; // gravity
    p.life -= 0.015;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    
    noStroke();
    let col = p.hot ? LAVA : AMBER;
    fill(col[0], col[1], col[2], p.life * 200);
    ellipse(p.x, p.y, p.size * p.life);
  }
}

function drawStressIndicator() {
  // Subtle stress bar at bottom
  if (!ruptured) {
    let barW = width * 0.3;
    let barH = 3;
    let barX = width / 2 - barW / 2;
    let barY = height - 30;
    
    // Background
    noStroke();
    fill(OBSIDIAN[0], OBSIDIAN[1], OBSIDIAN[2], 100);
    rect(barX, barY, barW, barH, 2);
    
    // Fill
    let fillCol = lerpColor(color(PUMICE[0], PUMICE[1], PUMICE[2]), color(LAVA[0], LAVA[1], LAVA[2]), shearStress);
    fill(fillCol);
    rect(barX, barY, barW * shearStress, barH, 2);
  }
}

function triggerRupture() {
  ruptured = true;
  ruptureTime = millis();
  targetDisplacement = 40 + random(20);
  
  // Emit particles along fault
  let faultLen = height * 0.8;
  for (let i = 0; i < 60; i++) {
    let t = random();
    let px = faultX + random(-10, 10);
    let py = height * 0.1 + faultLen * t;
    particles.push({
      x: px, y: py,
      vx: random(-3, 3),
      vy: random(-4, 1),
      size: random(2, 6),
      life: 1,
      hot: random() < 0.6
    });
  }
}

function mousePressed() {
  if (!ruptured) {
    shearStress = min(shearStress + 0.15, 1.01);
  } else {
    targetDisplacement += 20;
    // More particles on click
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: faultX + random(-8, 8),
        y: random(height * 0.2, height * 0.8),
        vx: random(-2, 2),
        vy: random(-3, 0),
        size: random(2, 5),
        life: 1,
        hot: random() < 0.7
      });
    }
  }
}
</script>
</body>
</html>
