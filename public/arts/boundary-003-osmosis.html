<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渗透 / Osmosis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFF8F0; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, midX;
let particles = [];
const MAX = 600;

// Spring palette — warm side vs cool side
const warmColors = ['#FFB7C5', '#FFDEAD', '#F4A6B0', '#FFD1DC'];
const coolColors = ['#A8D8B9', '#87CEEB', '#B5D8CC', '#C8A2C8'];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  midX = W / 2;
}
resize();
window.addEventListener('resize', resize);

// Membrane properties
let membraneWobble = [];
const MEMBRANE_SEGMENTS = 80;
for (let i = 0; i < MEMBRANE_SEGMENTS; i++) {
  membraneWobble.push(Math.random() * Math.PI * 2);
}

class Particle {
  constructor(side) {
    this.side = side; // 'warm' or 'cool'
    if (side === 'warm') {
      this.x = Math.random() * midX * 0.8 + midX * 0.1;
      this.color = warmColors[Math.floor(Math.random() * warmColors.length)];
    } else {
      this.x = midX + Math.random() * midX * 0.8 + midX * 0.1;
      this.color = coolColors[Math.floor(Math.random() * coolColors.length)];
    }
    this.y = Math.random() * H;
    this.r = 2.5 + Math.random() * 4;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.opacity = 0.3 + Math.random() * 0.5;
    this.crossed = false;
    this.crossTime = 0;
    this.phase = Math.random() * Math.PI * 2;
  }

  update(t) {
    // Brownian drift
    this.vx += (Math.random() - 0.5) * 0.15;
    this.vy += (Math.random() - 0.5) * 0.15;

    // Osmotic pressure — push toward the side with fewer of your kind
    const warmCount = particles.filter(p => p.x < midX).length;
    const coolCount = particles.length - warmCount;
    const warmOnRight = particles.filter(p => p.side === 'warm' && p.x > midX).length;
    const coolOnLeft = particles.filter(p => p.side === 'cool' && p.x < midX).length;

    // Gentle drift toward equilibrium
    if (this.side === 'warm' && this.x < midX) {
      this.vx += 0.008; // warm particles want to diffuse right
    } else if (this.side === 'cool' && this.x > midX) {
      this.vx -= 0.008; // cool particles want to diffuse left
    }

    // Near membrane — resistance
    const distToMembrane = Math.abs(this.x - midX);
    if (distToMembrane < 30) {
      // Membrane resistance — some pass, some bounce
      const passChance = 0.003 + (this.crossed ? 0.001 : 0);
      if (distToMembrane < 5 && !this.crossed && Math.random() < passChance) {
        this.crossed = true;
        this.crossTime = t;
        // Small burst through
        this.vx *= 2;
      } else if (distToMembrane < 15 && !this.crossed) {
        // Bounce softly
        if (this.x < midX) this.vx -= 0.05;
        else this.vx += 0.05;
      }
    }

    // After crossing, glow fades over time
    if (this.crossed) {
      const age = t - this.crossTime;
      this.opacity = Math.max(0.2, 0.8 - age * 0.0003);
    }

    // Damping
    this.vx *= 0.98;
    this.vy *= 0.98;

    this.x += this.vx;
    this.y += this.vy;

    // Soft bounds
    if (this.x < this.r) { this.x = this.r; this.vx *= -0.5; }
    if (this.x > W - this.r) { this.x = W - this.r; this.vx *= -0.5; }
    if (this.y < this.r) { this.y = this.r; this.vy *= -0.5; }
    if (this.y > H - this.r) { this.y = H - this.r; this.vy *= -0.5; }

    // Gentle pulse
    this.displayR = this.r + Math.sin(t * 0.002 + this.phase) * 0.8;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.displayR, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.opacity;
    ctx.fill();

    // Soft glow for crossed particles
    if (this.crossed) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.displayR * 2.5, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.displayR * 2.5);
      g.addColorStop(0, this.color);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.globalAlpha = 0.15;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// Init particles — more warm than cool to create pressure difference
for (let i = 0; i < MAX * 0.6; i++) particles.push(new Particle('warm'));
for (let i = 0; i < MAX * 0.4; i++) particles.push(new Particle('cool'));

let mouseY = H / 2;
canvas.addEventListener('mousemove', e => { mouseY = e.clientY; });

let t = 0;
function draw() {
  t++;
  // Light warm background with subtle gradient
  const bg = ctx.createLinearGradient(0, 0, W, 0);
  bg.addColorStop(0, '#FFF5EE');
  bg.addColorStop(0.5, '#FFF8F0');
  bg.addColorStop(1, '#F0F8F5');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Draw membrane
  ctx.beginPath();
  ctx.moveTo(midX, 0);
  for (let i = 0; i < MEMBRANE_SEGMENTS; i++) {
    const y = (i / MEMBRANE_SEGMENTS) * H;
    const wobble = Math.sin(t * 0.01 + membraneWobble[i]) * 8;
    const mouseInfluence = Math.exp(-Math.pow((y - mouseY) / 100, 2)) * 15;
    ctx.lineTo(midX + wobble + mouseInfluence, y);
  }
  ctx.strokeStyle = 'rgba(180, 160, 140, 0.2)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Membrane dots — pores
  for (let i = 0; i < MEMBRANE_SEGMENTS; i += 3) {
    const y = (i / MEMBRANE_SEGMENTS) * H;
    const wobble = Math.sin(t * 0.01 + membraneWobble[i]) * 8;
    const poreOpen = Math.sin(t * 0.005 + i * 0.3) > 0.3;
    ctx.beginPath();
    ctx.arc(midX + wobble, y, poreOpen ? 3 : 1.5, 0, Math.PI * 2);
    ctx.fillStyle = poreOpen ? 'rgba(180, 160, 140, 0.1)' : 'rgba(180, 160, 140, 0.3)';
    ctx.fill();
  }

  // Update and draw particles
  for (const p of particles) {
    p.update(t);
    p.draw();
  }

  // Info overlay — concentration
  const leftWarm = particles.filter(p => p.side === 'warm' && p.x < midX).length;
  const rightWarm = particles.filter(p => p.side === 'warm' && p.x >= midX).length;
  const leftCool = particles.filter(p => p.side === 'cool' && p.x < midX).length;
  const rightCool = particles.filter(p => p.side === 'cool' && p.x >= midX).length;

  ctx.globalAlpha = 0.3;
  ctx.font = '11px monospace';
  ctx.fillStyle = '#B0A090';
  ctx.textAlign = 'left';
  ctx.fillText(`warm: ${leftWarm}  cool: ${leftCool}`, 16, H - 16);
  ctx.textAlign = 'right';
  ctx.fillText(`warm: ${rightWarm}  cool: ${rightCool}`, W - 16, H - 16);
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
