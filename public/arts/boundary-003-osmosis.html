<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渗透 / Osmosis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
}
resize();
window.addEventListener('resize', resize);

// --- Colors ---
const WARM = ['#FFB7C5', '#FFDEAD', '#F4A460', '#FFD0B0', '#FFC4B0'];
const COOL = ['#87CEEB', '#A8D8B9', '#C8A2C8', '#9DC8E8', '#B8C8D8'];

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

const warmRgb = WARM.map(hexToRgb);
const coolRgb = COOL.map(hexToRgb);

// --- Mouse ---
let mx = W * 0.5, my = H * 0.5;
let mouseActive = false;

document.addEventListener('mousemove', e => {
  mx = e.clientX * dpr;
  my = e.clientY * dpr;
  mouseActive = true;
});
document.addEventListener('mouseleave', () => { mouseActive = false; });
document.addEventListener('touchmove', e => {
  e.preventDefault();
  mx = e.touches[0].clientX * dpr;
  my = e.touches[0].clientY * dpr;
  mouseActive = true;
}, { passive: false });
document.addEventListener('touchend', () => { mouseActive = false; });

// --- Particles ---
const COUNT = 300;
const particles = [];

class Particle {
  constructor(side) {
    this.side = side; // 'warm' or 'cool'
    this.crossed = false;
    this.crossing = false;
    this.crossGlow = 0;
    const c = side === 'warm'
      ? warmRgb[Math.floor(Math.random() * warmRgb.length)]
      : coolRgb[Math.floor(Math.random() * coolRgb.length)];
    this.r = c.r; this.g = c.g; this.b = c.b;
    this.size = 1.5 + Math.random() * 2.5;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.008 + Math.random() * 0.02;
    this.driftSpeed = 0.15 + Math.random() * 0.3;
    this.reset();
  }

  reset() {
    if (this.side === 'warm') {
      this.x = Math.random() * W * 0.4;
    } else {
      this.x = W * 0.6 + Math.random() * W * 0.4;
    }
    this.y = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.crossed = false;
    this.crossing = false;
    this.crossGlow = 0;
  }
}

for (let i = 0; i < COUNT; i++) {
  particles.push(new Particle(i < COUNT / 2 ? 'warm' : 'cool'));
}

let time = 0;

function membraneX(y, t) {
  const base = W * 0.5;
  const wave = Math.sin(y * 0.006 + t * 0.015) * 20
    + Math.sin(y * 0.012 + t * 0.008) * 10
    + Math.sin(y * 0.003 + t * 0.025) * 15;
  // breathing
  const breath = Math.sin(t * 0.01) * 8;
  // mouse distortion
  let mouseDist = 0;
  if (mouseActive) {
    const dy = y - my;
    mouseDist = Math.exp(-dy * dy / (80000)) * (mx - base) * 0.3;
  }
  return base + wave + breath + mouseDist;
}

function draw() {
  // Soft clear
  ctx.fillStyle = 'rgba(255, 248, 240, 0.08)';
  ctx.fillRect(0, 0, W, H);
  time++;

  const midX = W * 0.5;

  // --- Draw membrane ---
  ctx.beginPath();
  const step = 4;
  for (let y = 0; y <= H; y += step) {
    const x = membraneX(y, time);
    if (y === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(200, 180, 170, 0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Membrane glow
  for (let y = 0; y < H; y += 6) {
    const x = membraneX(y, time);
    const glowA = 0.03 + 0.02 * Math.sin(y * 0.01 + time * 0.02);
    const grd = ctx.createRadialGradient(x, y, 0, x, y, 25);
    grd.addColorStop(0, `rgba(220, 200, 190, ${glowA})`);
    grd.addColorStop(1, 'rgba(220, 200, 190, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(x - 25, y - 3, 50, 6);
  }

  // --- Update particles ---
  for (const p of particles) {
    p.wobble += p.wobbleSpeed;
    const wy = Math.sin(p.wobble) * 0.6;
    const memX = membraneX(p.y, time);

    // Concentration-driven drift toward opposite side
    if (!p.crossed && !p.crossing) {
      // Drift toward membrane
      const dir = p.side === 'warm' ? 1 : -1;
      const distToMem = Math.abs(p.x - memX);

      // Gentle attraction toward membrane
      if (distToMem > 30) {
        p.vx += dir * 0.005 * p.driftSpeed;
      }

      // Near membrane: chance to start crossing
      if (distToMem < 15) {
        if (Math.random() < 0.002) {
          p.crossing = true;
          p.vx = dir * (0.5 + Math.random() * 0.5);
        } else {
          // Bounce gently
          p.vx -= dir * 0.02;
        }
      }
    }

    if (p.crossing) {
      p.crossGlow = Math.min(1, p.crossGlow + 0.05);
      const dir = p.side === 'warm' ? 1 : -1;
      // Check if passed membrane
      if ((p.side === 'warm' && p.x > memX + 30) ||
          (p.side === 'cool' && p.x < memX - 30)) {
        p.crossed = true;
        p.crossing = false;
      }
    }

    if (p.crossed) {
      p.crossGlow = Math.max(0, p.crossGlow - 0.008);
      // Slow drift in new territory
      p.vx *= 0.98;
      const dir = p.side === 'warm' ? 1 : -1;
      p.vx += dir * 0.003;

      // Reset if too far
      if (p.x < -20 || p.x > W + 20 || Math.random() < 0.0005) {
        p.reset();
      }
    }

    // Apply velocity with damping
    p.vx *= 0.995;
    p.vy *= 0.99;
    p.vy += wy * 0.05;

    // gentle random drift
    p.vx += (Math.random() - 0.5) * 0.02;
    p.vy += (Math.random() - 0.5) * 0.03;

    p.x += p.vx;
    p.y += p.vy;

    // Keep in bounds vertically
    if (p.y < 0) p.y += H;
    if (p.y > H) p.y -= H;

    // Keep warm on left, cool on right (if not crossing/crossed)
    if (!p.crossed && !p.crossing) {
      if (p.side === 'warm' && p.x > memX - 5) {
        p.x = memX - 5;
        p.vx *= -0.3;
      }
      if (p.side === 'cool' && p.x < memX + 5) {
        p.x = memX + 5;
        p.vx *= -0.3;
      }
      // Don't go off screen
      if (p.side === 'warm' && p.x < 10) { p.x = 10; p.vx *= -0.5; }
      if (p.side === 'cool' && p.x > W - 10) { p.x = W - 10; p.vx *= -0.5; }
    }

    // --- Draw ---
    const alpha = 0.5 + p.crossGlow * 0.4;

    // Cross glow
    if (p.crossGlow > 0.05) {
      const gr = p.size * (4 + p.crossGlow * 8);
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
      glow.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, ${p.crossGlow * 0.15})`);
      glow.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);
      ctx.fillStyle = glow;
      ctx.fillRect(p.x - gr, p.y - gr, gr * 2, gr * 2);
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
