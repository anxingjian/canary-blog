<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花野 / Hanano</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFF8F0; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
// 花野 / Hanano — Canary 2026-04-13
// Fidenza-inspired: flow field + thick color blocks + collision detection
// Spring palette: sakura pink, fresh green, sky blue, apricot yellow

const PALETTE_W = [
  ['#FFB7C5', 22], ['#FF9CAD', 10], ['#A8D8B9', 18], ['#7EC8A0', 8],
  ['#87CEEB', 16], ['#6BB8DC', 6],  ['#FFDEAD', 14], ['#FFD08A', 8],
  ['#C8A2C8', 8],  ['#FFFFFF', 6],
];
const PALETTE_TOTAL = PALETTE_W.reduce((s, p) => s + p[1], 0);

const BG = '#FFF8F0';
let seed, sz;
const CELL = 6;
let grid, gridCols;

function wPick() {
  let r = random(PALETTE_TOTAL);
  for (let p of PALETTE_W) { r -= p[1]; if (r <= 0) return p[0]; }
  return PALETTE_W[0][0];
}

// Rotated rect → sample points for collision
function getBlockCells(cx, cy, angle, bw, bh, margin) {
  let cells = [];
  let cosA = cos(angle), sinA = sin(angle);
  let step = CELL;
  for (let ly = -margin; ly <= bh + margin; ly += step) {
    for (let lx = -bw/2 - margin; lx <= bw/2 + margin; lx += step) {
      let wx = cx + lx * cosA - ly * sinA;
      let wy = cy + lx * sinA + ly * cosA;
      let gx = floor(wx / CELL);
      let gy = floor(wy / CELL);
      if (gx < 0 || gy < 0 || gx >= gridCols || gy >= gridCols) {
        cells.push([-1, -1]); // out of bounds marker
      } else {
        cells.push([gx, gy]);
      }
    }
  }
  return cells;
}

function canPlace(cells) {
  for (let [gx, gy] of cells) {
    if (gx < 0) return false; // out of bounds
    if (grid[gy * gridCols + gx]) return false;
  }
  return true;
}

function markCells(cells) {
  for (let [gx, gy] of cells) {
    if (gx >= 0) grid[gy * gridCols + gx] = true;
  }
}

function setup() {
  seed = Math.floor(Math.random() * 999999);
  randomSeed(seed);
  noiseSeed(seed);

  sz = min(windowWidth, windowHeight);
  createCanvas(sz, sz);
  pixelDensity(2);
  background(BG);

  // Warm wash
  noStroke();
  for (let y = 0; y < height; y++) {
    let t = y / height;
    fill(lerp(255, 252, t), lerp(250, 244, t), lerp(242, 230, t), 35);
    rect(0, y, width, 1);
  }

  gridCols = ceil(sz / CELL);
  grid = new Uint8Array(gridCols * gridCols);

  let noiseScale = random(0.0015, 0.004);
  let turbulence = random(0.8, 2.2);

  // Size tiers: [minW, maxW, minH, maxH, weight]
  const SIZES = [
    [4, 10, 15, 45, 35],
    [8, 18, 30, 90, 28],
    [14, 30, 50, 160, 18],
    [24, 50, 80, 260, 10],
    [40, 80, 120, 360, 4],
  ];
  const SIZE_TOTAL = SIZES.reduce((s, t) => s + t[4], 0);

  function pickSize() {
    let r = random(SIZE_TOTAL);
    for (let s of SIZES) { r -= s[4]; if (r <= 0) return [random(s[0], s[1]), random(s[2], s[3])]; }
    return [8, 30];
  }

  let placed = 0, attempts = 0;
  let maxAttempts = 50000, maxPlaced = 900;

  while (attempts < maxAttempts && placed < maxPlaced) {
    attempts++;

    let sx = random(sz * 0.01, sz * 0.99);
    let sy = random(sz * 0.01, sz * 0.99);
    let [bw, bh] = pickSize();
    let angle = noise(sx * noiseScale, sy * noiseScale) * TWO_PI * turbulence;

    let cells = getBlockCells(sx, sy, angle, bw, bh, 2);
    if (!canPlace(cells)) continue;

    let col = color(wPick());
    col.setAlpha(random(130, 230));

    push();
    translate(sx, sy);
    rotate(angle);
    noStroke();
    fill(col);

    let mode = random();
    if (mode < 0.65) {
      // Solid block
      rect(-bw/2, 0, bw, bh, random(0, 2));
    } else if (mode < 0.88) {
      // Soft shape: parallel lines with noise offset
      let nLines = max(3, floor(bw / 1.8));
      for (let li = 0; li < nLines; li++) {
        let lx = -bw/2 + (li / nLines) * bw;
        stroke(col);
        strokeWeight(1.1);
        noFill();
        beginShape();
        for (let ly = 0; ly < bh; ly += 3) {
          curveVertex(lx + noise(lx * 0.1, ly * 0.05, seed * 0.01) * 4 - 2, ly);
        }
        endShape();
      }
    } else {
      // Outline
      noFill();
      stroke(col);
      strokeWeight(random(1.5, 3));
      rect(-bw/2, 0, bw, bh, random(0, 2));
    }

    pop();
    markCells(cells);
    placed++;
  }

  // Light spots
  noStroke();
  for (let i = 0; i < random(35, 65); i++) {
    let lx = random(sz), ly = random(sz), lr = random(30, 100);
    for (let d = lr; d > 0; d -= 2) {
      fill(255, 255, 248, map(d, 0, lr, 14, 0));
      ellipse(lx, ly, d, d);
    }
  }

  // Pollen
  for (let i = 0; i < random(200, 400); i++) {
    let pc = color(wPick());
    pc.setAlpha(random(30, 80));
    fill(pc); noStroke();
    ellipse(random(sz), random(sz), random(1, 3));
  }

  // Grain
  loadPixels();
  for (let i = 0; i < pixels.length; i += 4) {
    let g = random(-5, 5);
    pixels[i] += g; pixels[i+1] += g; pixels[i+2] += g;
  }
  updatePixels();

  noLoop();
  console.log('花野 / Hanano — seed:', seed, '— placed:', placed, '/', attempts);
}
</script>
</body>
</html>
