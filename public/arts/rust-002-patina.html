<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Patina 绿</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0B2622; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<script>
// Patina — copper carbonate growth simulation
// Verdigris palette: deep emerald, mint frost, malachite, dark copper

let particles = [];
let seeds = [];
const PALETTE = [
  [46, 139, 114],   // #2E8B72 malachite green
  [95, 184, 160],   // #5FB8A0 verdigris
  [142, 207, 183],  // #8ECFB7 mint frost
  [26, 74, 64],     // #1A4A40 deep patina
  [60, 160, 130],   // mid green
];
const COPPER = [122, 92, 58]; // #7A5C3A aged copper

let pg; // offscreen buffer for accumulation
let time = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pg = createGraphics(width, height);
  pg.background(11, 38, 34); // #0B2622

  // Seed points — nucleation sites where patina begins
  let numSeeds = floor(random(8, 15));
  for (let i = 0; i < numSeeds; i++) {
    seeds.push({
      x: random(width * 0.1, width * 0.9),
      y: random(height * 0.1, height * 0.9),
      radius: 0,
      maxRadius: random(80, 250),
      speed: random(0.2, 0.6),
      colorIdx: floor(random(PALETTE.length)),
      age: 0,
      branches: floor(random(3, 7))
    });
  }

  // Wandering particles — carbonate molecules finding their way
  for (let i = 0; i < 300; i++) {
    let seed = random(seeds);
    let angle = random(TWO_PI);
    let dist = random(20, 100);
    particles.push({
      x: seed.x + cos(angle) * dist,
      y: seed.y + sin(angle) * dist,
      vx: random(-0.5, 0.5),
      vy: random(-0.5, 0.5),
      size: random(1, 4),
      colorIdx: floor(random(PALETTE.length)),
      alpha: random(30, 80),
      life: random(200, 600)
    });
  }

  noStroke();
}

function draw() {
  time++;

  // Draw onto accumulation buffer
  pg.noStroke();

  // Grow seed regions — diffusion-limited aggregation style
  for (let s of seeds) {
    if (s.radius < s.maxRadius) {
      s.radius += s.speed * 0.3;
      s.age++;

      // Draw crystalline growth edges
      let col = PALETTE[s.colorIdx];
      for (let b = 0; b < s.branches; b++) {
        let baseAngle = (TWO_PI / s.branches) * b + sin(s.age * 0.01) * 0.3;
        let r = s.radius;
        let wobble = noise(s.x * 0.01, s.y * 0.01, time * 0.005 + b) * 30;

        for (let j = 0; j < 3; j++) {
          let angle = baseAngle + random(-0.2, 0.2);
          let px = s.x + cos(angle) * (r + wobble + random(-5, 5));
          let py = s.y + sin(angle) * (r + wobble + random(-5, 5));
          let sz = random(2, 8);
          let a = map(r, 0, s.maxRadius, 40, 10);

          pg.fill(col[0], col[1], col[2], a);
          pg.ellipse(px, py, sz, sz);
        }
      }

      // Inner texture — layers of oxidation
      if (time % 3 === 0) {
        let innerR = random(s.radius * 0.3, s.radius * 0.8);
        let innerAngle = random(TWO_PI);
        let ix = s.x + cos(innerAngle) * innerR;
        let iy = s.y + sin(innerAngle) * innerR;
        let innerCol = PALETTE[(s.colorIdx + floor(random(1, 3))) % PALETTE.length];
        pg.fill(innerCol[0], innerCol[1], innerCol[2], random(10, 30));
        pg.ellipse(ix, iy, random(3, 15), random(3, 15));
      }
    }
  }

  // Wandering particles — slow chemical drift
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.life--;

    if (p.life <= 0) {
      // Respawn near a seed
      let seed = random(seeds);
      let angle = random(TWO_PI);
      let dist = random(seed.radius, seed.radius + 60);
      p.x = seed.x + cos(angle) * dist;
      p.y = seed.y + sin(angle) * dist;
      p.life = random(200, 600);
      p.colorIdx = floor(random(PALETTE.length));
      continue;
    }

    // Brownian motion with drift toward nearest seed
    let nearest = seeds[0];
    let minD = dist(p.x, p.y, seeds[0].x, seeds[0].y);
    for (let s of seeds) {
      let d = dist(p.x, p.y, s.x, s.y);
      if (d < minD) { minD = d; nearest = s; }
    }

    let attraction = 0.02;
    p.vx += (nearest.x - p.x) * attraction * 0.001 + random(-0.1, 0.1);
    p.vy += (nearest.y - p.y) * attraction * 0.001 + random(-0.1, 0.1);
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.x += p.vx;
    p.y += p.vy;

    let col = PALETTE[p.colorIdx];
    let a = map(p.life, 0, 300, 5, p.alpha);
    pg.fill(col[0], col[1], col[2], a);
    pg.ellipse(p.x, p.y, p.size, p.size);
  }

  // Copper showing through — wounds in the patina
  if (time % 20 === 0 && time < 500) {
    let wx = random(width);
    let wy = random(height);
    // Only show copper where there's no heavy patina
    let nearSeed = false;
    for (let s of seeds) {
      if (dist(wx, wy, s.x, s.y) < s.radius * 0.5) {
        nearSeed = true; break;
      }
    }
    if (!nearSeed) {
      pg.fill(COPPER[0], COPPER[1], COPPER[2], random(15, 40));
      pg.ellipse(wx, wy, random(5, 25), random(5, 25));
    }
  }

  // Fine crystalline veins — dendritic growth
  if (time % 5 === 0) {
    for (let s of seeds) {
      if (s.radius > 30) {
        let startAngle = random(TWO_PI);
        let len = random(10, 40);
        let sx = s.x + cos(startAngle) * s.radius * random(0.4, 0.9);
        let sy = s.y + sin(startAngle) * s.radius * random(0.4, 0.9);
        let col = PALETTE[s.colorIdx];

        pg.stroke(col[0], col[1], col[2], 15);
        pg.strokeWeight(random(0.5, 1.5));
        pg.beginShape();
        pg.noFill();
        let cx = sx, cy = sy;
        for (let step = 0; step < len; step++) {
          cx += random(-3, 3);
          cy += random(-3, 3);
          pg.vertex(cx, cy);
        }
        pg.endShape();
        pg.noStroke();
      }
    }
  }

  // Render accumulated buffer
  image(pg, 0, 0);

  // Subtle shimmering highlights on top (wet patina look)
  if (time > 100) {
    for (let i = 0; i < 3; i++) {
      let hx = random(width);
      let hy = random(height);
      let nearSeed2 = false;
      for (let s of seeds) {
        if (dist(hx, hy, s.x, s.y) < s.radius * 0.7) {
          nearSeed2 = true; break;
        }
      }
      if (nearSeed2) {
        let shimmer = 128 + sin(time * 0.05 + hx * 0.01) * 40;
        fill(shimmer, 255, 220, 3 + sin(time * 0.02) * 2);
        ellipse(hx, hy, random(2, 6), random(2, 6));
      }
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  let newPg = createGraphics(width, height);
  newPg.image(pg, 0, 0);
  pg = newPg;
}
</script>
</body>
</html>
